ente{background:#dbeafe;color:#1d4ed8}.badge-curso{background:#fef3c7;color:#92400e}.badge-terminado{background:#dcfce7;color:#166534}.badge-cancelado{background:#fee2e2;color:#991b1b}@media(max-width:800px){.vehicle-grid,.form-grid,.work-columns{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:stretch}.topbar-actions{width:100%}.small-btn{width:100%}.header-logo{align-items:flex-start}.header-logo img{width:58px;height:58px}.header h2{font-size:28px}.content{padding:18px}}

<body>
<div id="loginView" class="box"><div class="header"><div class="header-logo"><img src="icono-512.png" alt="MENDIcar"><div><h2>MENDIcar</h2><p>Gestión digital de automoción</p></div></div></div><div class="content"><input id="username" type="text" placeholder="Usuario / correo"><input id="password" type="password" placeholder="Contraseña"><button type="button" onclick="login()">Entrar</button><div id="loginError" class="msg error hidden"></div></div><div class="footer-credit">Aplicación realizada por <strong>Alain Urionabarrenetxea</strong></div></div>
<div id="appView" class="box hidden"><div class="header"><div class="header-logo"><img src="icono-512.png" alt="MENDIcar"><div><h2>MENDIcar</h2><p id="welcomeText"></p></div></div></div><div class="content"><div class="topbar"><div id="viewModeText">Consulta de vehículo</div><div class="topbar-actions"><button id="showAllBtn" class="small-btn hidden" type="button" onclick="showAllVehicles()">Ver todos</button><button id="showWorksBtn" class="small-btn hidden" type="button" onclick="showWorksPanel()">Trabajos</button><button id="showCalendarBtn" class="small-btn hidden" type="button" onclick="showCalendarPanel()">Calendario</button><button id="showQrHistoryBtn" class="small-btn hidden" type="button" onclick="showQrHistoryPanel()">Historial QR</button><button class="small-btn secondary-btn" type="button" onclick="logout()">Cerrar sesión</button></div></div><div id="appMessage" class="msg info hidden"></div><div id="vehicleDetail"></div><div id="tableContainer" class="table-wrap hidden"><table><thead><tr><th>ID</th><th>Vehículo</th><th>Color</th><th>VIN</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody id="tableBody"></tbody></table></div></div><div class="footer-credit">Aplicación realizada por <strong>Alain Urionabarrenetxea</strong></div></div>
<button id="helpBtn" class="help-floating hidden" type="button" onclick="startTutorial(true)">❓ Ayuda</button>

<script>
let USERS=[],vehicles=[],currentUser=null;const SHEET_ID="1sf2TS8gCKachrkz66S6E_zQuafVpu7F_AhSLdhi-W-g",SHEET_GID="0",SAVE_API_URL="https://script.google.com/macros/s/AKfycbwBYs2oADcw-Za-nLVbR0oF5L6ZHx2gYd1JS-0vjIW9IbD53P9j7U68R09-WGieM2Er2A/exec";
function showLoginError(t){const e=document.getElementById('loginError');e.textContent=t;e.classList.remove('hidden')}function clearLoginError(){const e=document.getElementById('loginError');e.textContent='';e.classList.add('hidden')}function showMessage(t,type='info'){const e=document.getElementById('appMessage');e.textContent=t;e.className='msg '+type;e.classList.remove('hidden')}function clearMessage(){const e=document.getElementById('appMessage');e.textContent='';e.classList.add('hidden')}function value(v){return v==null?'':String(v).trim()}function normalizeYesNo(v){const x=String(v||'').trim().toLowerCase();if(['bai','si','sí','yes'].includes(x))return'Bai';if(['ez','no'].includes(x))return'Ez';return'Ez'}function normalizeRole(v){const x=String(v||'').trim().toLowerCase();if(x==='profesor'||x==='irakaslea')return'profesor';if(x==='alumno'||x==='ikaslea')return'alumno';return x}function isActive(v){const x=String(v||'').trim().toLowerCase();return ['bai','si','sí','yes','1','true'].includes(x)}function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function escapeAttr(v){return escapeHtml(v)}function escapeJs(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"')}function getEntryParams(){const p=new URLSearchParams(location.search);return{id:p.get('id'),trabajo:p.get('trabajo'),profesor:p.get('profesor'),panel:p.get('panel'),qrHarrera:p.get('qrHarrera')||p.get('harrera')||p.get('qr')}}
async function login(){clearLoginError();const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value.trim();try{const r=await fetch('https://opensheet.elk.sh/'+SHEET_ID+'/ERABILTZAILEAK');USERS=await r.json();const user=USERS.find(u=>String(u.usuario||'').trim().toLowerCase()===username&&String(u.password||'').trim()===password&&isActive(u.activo));if(!user){showLoginError('Usuario o contraseña incorrectos, o usuario inactivo.');return}const role=normalizeRole(user.rol),entry=getEntryParams();if(role==='alumno'&&!entry.id&&!entry.trabajo&&!entry.qrHarrera){showLoginError('Acceso solo permitido mediante QR del coche, ficha de trabajo o QR de recepción.');return}currentUser={username:String(user.usuario||'').trim(),role,name:String(user.nombre||user.usuario||'').trim(),taldea:String(user.taldea||'').trim()};document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('helpBtn').classList.remove('hidden');document.getElementById('welcomeText').textContent='Bienvenido, '+currentUser.name+' · Rol: '+currentUser.role;if(currentUser.role==='profesor'){document.getElementById('showWorksBtn').classList.remove('hidden');document.getElementById('showCalendarBtn').classList.remove('hidden');document.getElementById('showQrHistoryBtn').classList.remove('hidden');}loadVehiclesJSONP();registrarUsoApp('LOGIN','Entrada en la aplicación','','','');maybeStartTutorial()}catch(err){showLoginError('Error cargando usuarios:\n'+err.message)}}
function logout(){currentUser=null;vehicles=[];document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');['username','password'].forEach(id=>document.getElementById(id).value='');document.getElementById('vehicleDetail').innerHTML='';document.getElementById('tableBody').innerHTML='';document.getElementById('tableContainer').classList.add('hidden');document.getElementById('showAllBtn').classList.add('hidden');document.getElementById('showWorksBtn').classList.add('hidden');clearMessage();clearLoginError()}

async function normKeyValue(v){return String(v||'').trim().toLowerCase()}
function getField(r,names){if(!r)return '';for(let i=0;i<names.length;i++){const n=names[i];if(r[n]!==undefined&&r[n]!==null&&String(r[n]).trim()!=='')return String(r[n]).trim()}return ''}

function getLatestByQR(rows, qrId){
  const target=normKeyValue(qrId);
  const filtered=rows.filter(r=>{
    const qrValue=getField(r,['QR_RECEPCION','QR_HARRERA','QR','qrRecepcion','qrHarrera']);
    return normKeyValue(qrValue)===target;
  });
  if(!filtered.length)return null;
  filtered.sort((a,b)=>{
    const av=getField(a,['FECHA','DATA'])+' '+getField(a,['HORA','ORDUA']);
    const bv=getField(b,['FECHA','DATA'])+' '+getField(b,['HORA','ORDUA']);
    return av.localeCompare(bv);
  });
  return filtered[filtered.length-1];
}


function getLatestWorkRowsByRecepcion(rows,idRecepcion,matricula){
  const rec=String(idRecepcion||'').trim();
  const mat=String(matricula||'').trim().toLowerCase();
  let filtered=rows.filter(r=>String(r.ID_TRABAJO||'').trim()!=='' && String(r.ID_RECEPCION||'').trim()===rec);
  if(!filtered.length && mat){
    filtered=rows.filter(r=>String(r.ID_TRABAJO||'').trim()!=='' && String(r.MATRIKULA||'').trim().toLowerCase()===mat);
  }
  filtered.sort((a,b)=>getWorkSortValue(a).localeCompare(getWorkSortValue(b)));
  const latestMap={};
  filtered.forEach(r=>{latestMap[String(r.ID_TRABAJO||'').trim()]=r});
  return Object.values(latestMap).filter(r=>{
    const estado=String(r.EGOERA||'').trim().toLowerCase();
    return estado!=='terminado'&&estado!=='cancelado';
  });
}

function getLatestWorkRowsByMatricula(rows, matricula){
  const filtered = rows.filter(r =>
    String(r.ID_TRABAJO || '').trim() !== '' &&
    String(r.MATRIKULA || '').trim().toLowerCase() === String(matricula || '').trim().toLowerCase()
  );

  filtered.sort((a,b) => getWorkSortValue(a).localeCompare(getWorkSortValue(b)));

  const latestMap = {};
  filtered.forEach(r => {
    latestMap[String(r.ID_TRABAJO || '').trim()] = r;
  });

  return Object.values(latestMap).filter(r => {
    const estado = String(r.EGOERA || '').trim().toLowerCase();
    return estado !== 'terminado' && estado !== 'cancelado';
  });
}

function loadReceptionQR(qrId){
  clearMessage();
  registrarActividadQR('HARRERA', qrId, 'ENTRA_QR', 'Entrada al QR de recepción');

  callSaveAPI({accion:'comprobarQrHarrera', qrRecepcion: qrId}, checkResp => {
    if(checkResp && checkResp.ok && checkResp.ocupado){
      showMessage(
        'Este QR ya está ocupado. No se puede crear otra recepción con el mismo QR.' +
        (checkResp.sugerido ? ' Si necesitas otro QR, coge el ' + checkResp.sugerido + '.' : ''),
        'error'
      );

      renderOccupiedQrSummary(qrId, checkResp.recepcion || {}, checkResp.sugerido || '');

      // Carga trabajos/histórico debajo si existen, pero la tarjeta básica ya queda visible aunque falle la lectura.
      callSaveAPI({accion:'listarLanak'}, lResp => {
        if(lResp && lResp.ok){
          WORK_ROWS_CACHE = lResp.rows || [];
        }
      });

      return;
    }

    callSaveAPI({accion:'listarQrHarrera'}, qrResp => {
      if(!qrResp || !qrResp.ok){
        showMessage('Error cargando QR de recepción.', 'error');
        return;
      }

      const rows = qrResp.rows || [];
      const qr = rows.find(r => String(r.QR_HARRERA || '').trim() === String(qrId).trim());

      if(!qr){
        showMessage('No existe este QR de recepción: ' + qrId, 'error');
        return;
      }

      const estado = String(qr.EGOERA || '').trim().toLowerCase();

      if(estado === 'libre'){
        renderReceptionForm(qrId);
        return;
      }

      callSaveAPI({accion:'listarHarrera'}, hResp => {
        const harreraRows = hResp && hResp.ok ? (hResp.rows || []) : [];
        let harrera = getLatestByQR(harreraRows, qrId);

        callSaveAPI({accion:'listarLanak'}, lResp => {
          const lanakRows = lResp && lResp.ok ? (lResp.rows || []) : [];
          WORK_ROWS_CACHE = lanakRows;
          renderReceptionDetail(qr, harrera, lanakRows);
        });
      });
    });
  });
}

function getReceptionDisplayField(row, names){
  if(!row) return '';

  for(let i = 0; i < names.length; i++){
    const name = names[i];

    if(row[name] !== undefined && row[name] !== null && String(row[name]).trim() !== ''){
      return String(row[name]).trim();
    }
  }

  const normalized = {};
  Object.keys(row).forEach(k => {
    normalized[String(k).trim().toUpperCase()] = row[k];
  });

  for(let i = 0; i < names.length; i++){
    const key = String(names[i]).trim().toUpperCase();

    if(normalized[key] !== undefined && normalized[key] !== null && String(normalized[key]).trim() !== ''){
      return String(normalized[key]).trim();
    }
  }

  return '';
}



function getReceptionWorkshop(row){
  const candidates = [
    row.TIPO_TRABAJO,
    row.TAILERRA,
    row.TALLER,
    row.QUEJA_CLIENTE,
    row.TRABAJO_SOLICITADO
  ];

  for(const value of candidates){
    const s = String(value || '').trim().toUpperCase();

    if(s === 'MEKANIKA' || s === 'MECANICA' || s === 'MECÁNICA'){
      return 'MEKANIKA';
    }

    if(s === 'KARROZERIA' || s === 'CARROCERIA' || s === 'CARROCERÍA'){
      return 'KARROZERIA';
    }
  }

  return 'SIN_TALLER';
}


function parseTrabajosJsonFront(row){
  const raw = getReceptionDisplayField(row, ['TRABAJOS_JSON','trabajos_json']);
  const trabajoSolicitado = getReceptionDisplayField(row, ['TRABAJO_SOLICITADO','Trabajo solicitado','LANA']);
  try{
    const parsed = JSON.parse(raw || '[]');
    if(Array.isArray(parsed) && parsed.length) return parsed;
  }catch(e){}
  return String(trabajoSolicitado || '').split(',').map(x=>x.trim()).filter(Boolean).map((texto,i)=>({id:'T'+(i+1),texto:texto,estado:'pendiente',obs:'',evidencias:[]}));
}

function getRecepcionById(idRecepcion){
  return (window.RECEPCIONES_CACHE||[]).find(r=>String(r.ID_RECEPCION||'').trim()===String(idRecepcion).trim());
}

function toggleChecklistItem(idRecepcion,idTarea,checked){
  const r=getRecepcionById(idRecepcion); if(!r)return;
  const trabajos=parseTrabajosJsonFront(r);
  const t=trabajos.find(x=>String(x.id)===String(idTarea)); if(!t)return;
  t.estado=checked?'terminado':'pendiente';
  r.TRABAJOS_JSON=JSON.stringify(trabajos);
  const sel=document.getElementById('estado_'+idRecepcion+'_'+idTarea); if(sel)sel.value=t.estado;
}

function selectChecklistState(idRecepcion,idTarea,estado){
  const r=getRecepcionById(idRecepcion); if(!r)return;
  const trabajos=parseTrabajosJsonFront(r);
  const t=trabajos.find(x=>String(x.id)===String(idTarea)); if(!t)return;
  t.estado=estado;
  r.TRABAJOS_JSON=JSON.stringify(trabajos);
  document.querySelectorAll('input[data-idrecepcion="'+idRecepcion+'"][data-idtarea="'+idTarea+'"]').forEach(ch=>{ch.checked=estado==='terminado'});
}

function guardarChecklistRecepcion(idRecepcion){
  if(SAVE_LOCKS['checklist_'+idRecepcion]){showMessage('Ya se está guardando este checklist.','error');return;}
  const r=getRecepcionById(idRecepcion); if(!r){showMessage('No se ha encontrado la recepción.','error');return;}
  const trabajos=parseTrabajosJsonFront(r);
  const obs=document.getElementById('obsChecklist_'+idRecepcion)?.value||'';
  SAVE_LOCKS['checklist_'+idRecepcion]=true;
  showMessage('Guardando checklist...','success');
  callSaveAPI({accion:'actualizarTrabajosRecepcion',idRecepcion:idRecepcion,trabajosJson:JSON.stringify(trabajos),usuario:currentUser?currentUser.username:'',oharrak:obs},resp=>{
    SAVE_LOCKS['checklist_'+idRecepcion]=false;
    if(!resp||!resp.ok){showMessage('Error guardando checklist: '+(resp&&resp.msg?resp.msg:'Error desconocido'),'error');return;}
    showMessage(resp.msg||'Checklist guardado correctamente.','success');
    setTimeout(()=>{const entry=getEntryParams(); if(entry.qrHarrera){loadReceptionQR(entry.qrHarrera)}else{showWorksPanel()}},700);
  });
}

function renderHistoryByRecepcion(idRecepcion,matricula){
  let rows=WORK_ROWS_CACHE.filter(r=>String(r.ID_RECEPCION||'').trim()===String(idRecepcion||'').trim());
  if(!rows.length){
    rows=WORK_ROWS_CACHE.filter(r=>String(r.MATRIKULA||'').trim().toLowerCase()===String(matricula||'').trim().toLowerCase());
  }
  rows.sort((a,b)=>getWorkSortValue(a).localeCompare(getWorkSortValue(b)));
  if(!rows.length)return "<div class='ficha-box'>No hay histórico para esta recepción.</div>";
  return rows.map(r=>{
    const estado=String(r.EGOERA||'').trim();
    const prioridad=String(r.LEHENTASUNA||'normal').trim();
    const badgeClass=estado==='en curso'?'badge-curso':estado==='terminado'?'badge-terminado':estado==='cancelado'?'badge-cancelado':'badge-pendiente';
    return `<div class="work-card priority-${escapeAttr(prioridad)}"><strong>${escapeHtml(r.AUTOA||'')}</strong> · ${escapeHtml(r.MATRIKULA||'')}<br>ID recepción: ${escapeHtml(r.ID_RECEPCION||'')}<br>Fecha: ${escapeHtml(r.DATA||r.SORTZE_DATA||'')} ${escapeHtml(r.ORDUA||r.SORTZE_ORDUA||'')}<br>Usuario: ${escapeHtml(r.ERABILTZAILEA||'')}<br>Taller: ${escapeHtml(r.TAILERRA||'')}<br>Prioridad: ${escapeHtml(prioridad)}<br><span class="badge ${badgeClass}">${escapeHtml(estado)}</span><br><br>${escapeHtml(r.LANA||'')}${getProgressValue(r)?`<br><br><strong>Progreso:</strong><br>${escapeHtml(getProgressValue(r))}`:''}</div>`;
  }).join('');
}

function createReception(qrId){
  if(!currentUser)return;

  if(SAVE_LOCKS['crearRecepcion']){
    showMessage('Ya se está guardando la recepción. Espera unos segundos.', 'error');
    return;
  }

  const payload={
    accion:'crearRecepcion',
    qrRecepcion:qrId,
    usuario:currentUser.username,
    rol:currentUser.role,
    taldea:currentUser.taldea,
    matricula:document.getElementById('recMatricula').value.trim(),
    marca:document.getElementById('recMarca').value.trim(),
    modelo:document.getElementById('recModelo').value.trim(),
    km:document.getElementById('recKm').value.trim(),
    cliente:document.getElementById('recCliente').value.trim(),
    telefono:document.getElementById('recTelefono').value.trim(),
    email:document.getElementById('recEmail').value.trim(),
    tipoTrabajo:document.getElementById('recTipoTrabajo').value,
    prioridad:document.getElementById('recPrioridad').value,
    quejaCliente:document.getElementById('recQuejaCliente').value.trim(),
    trabajoSolicitado:document.getElementById('recTrabajoSolicitado').value.trim(),
    estadoVehiculo:'',
    danosVisibles:document.getElementById('recDanosVisibles').value.trim(),
    fotos:'',
    observaciones:document.getElementById('recObservaciones').value.trim(),
    estadoRecepcion:document.getElementById('recEstadoRecepcion').value
  };

  if(!payload.matricula||!payload.cliente){
    showMessage('Rellena al menos matrícula y cliente.','error');
    return;
  }

  SAVE_LOCKS['crearRecepcion']=true;

  const btn = document.getElementById('btnCrearRecepcion');
  if(btn){
    btn.disabled = true;
    btn.dataset.oldText = btn.textContent;
    btn.textContent = 'Guardando...';
    btn.classList.add('save-busy');
  }

  showMessage('Guardando recepción. No cierres la aplicación ni pulses varias veces.', 'success');

  callSaveAPI(payload,r=>{
    SAVE_LOCKS['crearRecepcion']=false;

    if(btn){
      btn.disabled = false;
      btn.textContent = btn.dataset.oldText || 'Crear recepción';
      btn.classList.remove('save-busy');
    }

    if(!r||!r.ok){
      showMessage('Error creando recepción:\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');
      return;
    }

    showMessage('Recepción creada correctamente. Guardado con éxito.', 'success');
    document.getElementById('vehicleDetail').insertAdjacentHTML('afterbegin', '<div class="success-box">✅ Recepción guardada con éxito</div>');

    setTimeout(()=>loadReceptionQR(qrId),800);
  });
}

function getPlannedDate(row){

function getPlannedTime(row){
  return getAnyField(row, ['N.ORDUA','N_ORDUA','HORA_PROGRAMADA','HORA','ORDUA']);
}

function getCalendarStatus(row){
  const trabajos = parseTrabajosJsonFront(row);
  if(!trabajos.length) return 'sin trabajos';

  const pendientes = trabajos.filter(t=>{
    const e = String(t.estado || '').toLowerCase();
    return e !== 'terminado' && e !== 'cancelado';
  }).length;

  if(pendientes === 0) return 'cerrado';

  if(trabajos.some(t=>String(t.estado || '').toLowerCase()==='en curso')) return 'en curso';

  return 'pendiente';
}

function loadCalendar(){
  const mode = document.getElementById('calendarViewMode')?.value || 'week';
  const base = document.getElementById('calendarBaseDate')?.value || new Date().toISOString().slice(0,10);

  callSaveAPI({accion:'listarHarrera'}, resp=>{
    if(!resp || !resp.ok){
      document.getElementById('calendarList').innerHTML = "<div class='msg error'>Error cargando planificación</div>";
      return;
    }

    const rows = (resp.rows || []).filter(r=>{
      const estado = String(getAnyField(r,['ESTADO_RECEPCION','ESTADO RECEPCION']) || 'abierta').toLowerCase();
      return estado !== 'cerrada' && estado !== 'cerrado';
    });

    renderCalendar(rows, mode, base);
  });
}

function dateDiffDays(a,b){
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((da - db) / 86400000);
}

function renderCalendar(rows, mode, base){
  const filtered = rows.filter(r=>{
    const fecha = getPlannedDate(r);
    if(mode === 'all') return true;
    if(!fecha) return mode === 'all';

    const diff = dateDiffDays(fecha, base);
    if(mode === 'today') return diff === 0;
    if(mode === 'week') return diff >= 0 && diff <= 6;
    return true;
  }).sort((a,b)=>{
    const av = (getPlannedDate(a)||'9999-99-99') + ' ' + (getPlannedTime(a)||'99:99');
    const bv = (getPlannedDate(b)||'9999-99-99') + ' ' + (getPlannedTime(b)||'99:99');
    return av.localeCompare(bv);
  });

  if(!filtered.length){
    document.getElementById('calendarList').innerHTML = "<div class='ficha-box'>No hay trabajos planificados en esta vista.</div>";
    return;
  }

  const grouped = {};
  filtered.forEach(r=>{
    const fecha = getPlannedDate(r) || 'Sin fecha';
    if(!grouped[fecha]) grouped[fecha] = [];
    grouped[fecha].push(r);
  });

  document.getElementById('calendarList').innerHTML = Object.keys(grouped).map(fecha=>{
    return `
      <h3 style="margin-top:18px;font-size:22px;">${escapeHtml(fecha)}</h3>
      ${grouped[fecha].map(r=>{
        const hora = getPlannedTime(r) || '-';
        const qr = getAnyField(r,['QR_RECEPCION','QR RECEPCION']);
        const marca = getAnyField(r,['MARCA']);
        const modelo = getAnyField(r,['MODELO']);
        const matricula = getAnyField(r,['MATRICULA','MATRIKULA']);
        const cliente = getAnyField(r,['CLIENTE','BEZEROA']);
        const taller = getReceptionWorkshop(r);
        const trabajos = parseTrabajosJsonFront(r);
        const estado = getCalendarStatus(r);
        const tareas = trabajos.map(t=>`${t.estado==='terminado'?'☑':'☐'} ${escapeHtml(t.texto||'')}`).join('<br>');

        return `
          <div class="work-reception-card" style="border-left-color:${estado==='en curso'?'#f59e0b':estado==='cerrado'?'#16a34a':'#2563eb'};">
            <div class="work-reception-summary">
              <strong style="font-size:20px;">${escapeHtml(hora)} · ${escapeHtml((marca+' '+modelo).trim() || 'Vehículo')}</strong>
              ${matricula ? `<span style="color:#6b7280;"> · ${escapeHtml(matricula)}</span>` : ''}
              <br>
              <span class="qr-line">${escapeHtml(qr || '-')}</span>
              <br>
              <span style="color:#6b7280;font-weight:800;">${escapeHtml(taller)} · ${escapeHtml(cliente || '')} · ${escapeHtml(estado)}</span>
              <div style="margin-top:10px;line-height:1.5;">${tareas}</div>
            </div>
          </div>
        `;
      }).join('')}
    `;
  }).join('');
}

// MENDICAR_V3_2_FRONT_HELPERS

function normalizeHeaderName(name){
  return String(name || '')
    .trim()
    .toUpperCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,'_');
}

function getAnyField(row, names){
  if(!row) return '';

  for(const n of names){
    if(row[n] !== undefined && row[n] !== null && String(row[n]).trim() !== ''){
      return String(row[n]).trim();
    }
  }

  const normalized = {};
  Object.keys(row || {}).forEach(k => {
    normalized[normalizeHeaderName(k)] = row[k];
  });

  for(const n of names){
    const key = normalizeHeaderName(n);
    if(normalized[key] !== undefined && normalized[key] !== null && String(normalized[key]).trim() !== ''){
      return String(normalized[key]).trim();
    }
  }

  return '';
}

function parseTrabajosJsonFront(row){
  // 1) Lectura principal desde TRABAJOS_JSON
  let raw = getAnyField(row, ['TRABAJOS_JSON','TRABAJOS JSON','trabajos_json']);

  // 2) Si por cualquier desplazamiento de columna viene en una clave rara,
  // buscamos en todos los valores de la fila un texto que parezca JSON de trabajos.
  if(!raw){
    for(const k of Object.keys(row || {})){
      const v = String(row[k] || '').trim();
      if(v.startsWith('[{') && v.includes('"texto"')){
        raw = v;
        break;
      }
    }
  }

  try{
    const parsed = JSON.parse(raw || '[]');
    if(Array.isArray(parsed) && parsed.length){
      return parsed.map((t,i)=>({
        id: t.id || ('T'+(i+1)),
        texto: t.texto || t.lana || t.trabajo || '',
        estado: t.estado || 'pendiente',
        obs: t.obs || '',
        evidencias: Array.isArray(t.evidencias) ? t.evidencias : []
      })).filter(t => String(t.texto || '').trim() !== '');
    }
  }catch(e){}

  // 3) Fallback: reconstruir desde TRABAJO_SOLICITADO
  const trabajoSolicitado = getAnyField(row, ['TRABAJO_SOLICITADO','TRABAJO SOLICITADO','LANA','QUEJA_CLIENTE']);
  return String(trabajoSolicitado || '')
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean)
    .map((texto,i)=>({
      id:'T'+(i+1),
      texto:texto,
      estado:'pendiente',
      obs:'',
      evidencias:[]
    }));
}

function getReceptionWorkshop(row){
  const candidates = [
    getAnyField(row, ['TIPO_TRABAJO','TIPO TRABAJO']),
    getAnyField(row, ['TAILERRA','TALLER']),
    getAnyField(row, ['QUEJA_CLIENTE','QUEJA CLIENTE'])
  ];

  for(const value of candidates){
    const s = String(value || '').trim().toUpperCase();
    if(s === 'MEKANIKA' || s === 'MECANICA' || s === 'MECÁNICA') return 'MEKANIKA';
    if(s === 'KARROZERIA' || s === 'CARROCERIA' || s === 'CARROCERÍA') return 'KARROZERIA';
  }

  return 'SIN_TALLER';
}

function getRecepcionById(idRecepcion){
  return (window.RECEPCIONES_CACHE || []).find(r =>

function toggleChecklistItem(idRecepcion, idTarea, checked){
  const r = getRecepcionById(idRecepcion);
  if(!r) return;

  const trabajos = parseTrabajosJsonFront(r);
  const t = trabajos.find(x => String(x.id) === String(idTarea));
  if(!t) return;

  t.estado = checked ? 'terminado' : 'pendiente';
  r.TRABAJOS_JSON = JSON.stringify(trabajos);

  const sel = document.getElementById('estado_' + idRecepcion + '_' + idTarea);
  if(sel) sel.value = t.estado;
}

function selectChecklistState(idRecepcion, idTarea, estado){
  const r = getRecepcionById(idRecepcion);
  if(!r) return;

  const trabajos = parseTrabajosJsonFront(r);
  const t = trabajos.find(x => String(x.id) === String(idTarea));
  if(!t) return;

  t.estado = estado;
  r.TRABAJOS_JSON = JSON.stringify(trabajos);

  document
    .querySelectorAll('input[data-idrecepcion="'+idRecepcion+'"][data-idtarea="'+idTarea+'"]')
    .forEach(ch => { ch.checked = estado === 'terminado'; });
}

function guardarChecklistRecepcion(idRecepcion){
  if(SAVE_LOCKS['checklist_'+idRecepcion]){
    showMessage('Ya se está guardando este checklist. Espera unos segundos.', 'error');
    return;
  }

  const r = getRecepcionById(idRecepcion);
  if(!r){
    showMessage('No se ha encontrado la recepción.', 'error');
    return;
  }

  const trabajos = parseTrabajosJsonFront(r);
  const obsEl = document.getElementById('obsChecklist_' + idRecepcion);
  const obs = obsEl ? obsEl.value : '';

  SAVE_LOCKS['checklist_'+idRecepcion] = true;
  const tareasCerradas = trabajos.filter(t=>String(t.estado||'').toLowerCase()==='terminado').map(t=>t.texto).join(', ');
  const tareasCanceladas = trabajos.filter(t=>String(t.estado||'').toLowerCase()==='cancelado').map(t=>t.texto).join(', ');
  const qrLog = getAnyField(r,['QR_RECEPCION','QR RECEPCION']);
  if(tareasCerradas) registrarActividadQR('HARRERA', qrLog, 'TERMINA_TAREA', tareasCerradas);
  if(tareasCanceladas) registrarActividadQR('HARRERA', qrLog, 'CANCELA_TAREA', tareasCanceladas);
  registrarActividadQR('HARRERA', qrLog, 'GUARDA_CHECKLIST', obs || 'Checklist actualizado');
  showMessage('Guardando checklist...', 'success');

  callSaveAPI({
    accion:'actualizarTrabajosRecepcion',
    idRecepcion:idRecepcion,
    trabajosJson:JSON.stringify(trabajos),
    usuario:currentUser ? currentUser.username : '',
    oharrak:obs
  }, resp => {
    SAVE_LOCKS['checklist_'+idRecepcion] = false;

    if(!resp || !resp.ok){
      showMessage('Error guardando checklist: ' + (resp && resp.msg ? resp.msg : 'Error desconocido'), 'error');
      return;
    }

    showMessage(resp.msg || 'Checklist guardado correctamente.', 'success');
    registrarUsoApp('GUARDAR_CHECKLIST','Checklist actualizado',idRecepcion,getAnyField(r,['QR_RECEPCION','QR RECEPCION']),getAnyField(r,['MATRICULA','MATRIKULA']));

    setTimeout(()=>{
      const entry = getEntryParams();
      if(entry.qrHarrera){
        loadReceptionQR(entry.qrHarrera);
      }else{
        showWorksPanel();
      }
    },700);
  });
}

function loadWorks(){
  clearMessage();

  callSaveAPI({accion:'listarHarrera'}, hResp=>{
    if(!hResp || !hResp.ok){
      document.getElementById('worksList').innerHTML="<div class='msg error'>Error cargando recepciones</div>";
      return;
    }

    const rows = hResp.rows || [];

    window.RECEPCIONES_CACHE = rows.filter(r=>{
      const estadoRecepcion = String(getAnyField(r, ['ESTADO_RECEPCION','ESTADO RECEPCION']) || 'abierta').trim().toLowerCase();
      const idRecepcion = getAnyField(r, ['ID_RECEPCION','ID RECEPCION']);
      const qr = getAnyField(r, ['QR_RECEPCION','QR RECEPCION']);
      const trabajos = parseTrabajosJsonFront(r);

      if(!idRecepcion && !qr) return false;
      if(estadoRecepcion === 'cerrada' || estadoRecepcion === 'cerrado') return false;

      // Activa si tiene tareas pendientes/en curso o si no hay JSON todavía pero hay trabajo solicitado
      if(!trabajos.length) return true;

      return !trabajos.every(t=>{
        const e = String(t.estado || '').toLowerCase();
        return e === 'terminado' || e === 'cancelado';
      });
    });

    renderWorks(window.RECEPCIONES_CACHE);
  });
}

  const programmedDate = String(r.NOIZKO || '').trim();
  const programmedHour = String(r['N.ORDUA'] || '').trim();

  }

  return String(r.SORTZE_DATA || r.DATA || '') + ' ' + String(r.SORTZE_ORDUA || r.ORDUA || '');
}

function getPriorityValue(r){
  const p = String(r.LEHENTASUNA || 'normal').trim().toLowerCase();

        <br><br>
        ${escapeHtml(r.LANA || '')}
        ${getProgressValue(r) ? `<br><br><strong>Progreso:</strong><br>${escapeHtml(getProgressValue(r))}` : ''}
      </div>
    `;
  }).join('');
}

function createWork(){
  if(SAVE_LOCKS['crearTrabajo']){
    showMessage('Ya se está creando el trabajo. Espera unos segundos.', 'error');
    return;
  }

  const payload={
    accion:'crearTrabajo',
    tailerra:document.getElementById('workTailerra').value,
    cliente:document.getElementById('workCliente').value.trim(),
    autoa:document.getElementById('workAutoa').value.trim(),
    matricula:document.getElementById('workMatricula').value.trim(),
    fecha:document.getElementById('workFecha').value,
    hora:document.getElementById('workHora').value,
    prioridad:document.getElementById('workPrioridad').value,
    lana:document.getElementById('workLana').value.trim(),
    usuario:currentUser.username,
    rol:currentUser.role,
    taldea:currentUser.taldea || ''
  };

  if(!payload.cliente||!payload.lana){
    showMessage('Falta cliente o trabajo a realizar.','error');
    return;
  }

  SAVE_LOCKS['crearTrabajo']=true;
  const btn=document.getElementById('btnCrearTrabajo');
  if(btn){
    btn.disabled=true;
    btn.dataset.oldText=btn.textContent;
    btn.textContent='Guardando...';
    btn.classList.add('save-busy');
  }

  const resultBox=document.getElementById('workCreateResult');
  if(resultBox) resultBox.innerHTML='<div class="success-box">Guardando trabajo y buscando QR libre...</div>';

  callSaveAPI(payload,r=>{
    SAVE_LOCKS['crearTrabajo']=false;

    if(btn){
      btn.disabled=false;
      btn.textContent=btn.dataset.oldText || 'Crear trabajo y asignar QR libre';
      btn.classList.remove('save-busy');
    }

    if(!r||!r.ok){
      showMessage('Error creando trabajo:\\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');
      if(resultBox) resultBox.innerHTML='';
      return;
    }

    const qrAsignado = r.qrAsignado || r.qr || '';
    const idRecepcion = r.idRecepcion || '';

    showMessage('Trabajo creado correctamente. QR asignado automáticamente: '+qrAsignado,'success');
    registrarUsoApp('CREAR_ORDEN','Orden creada desde Trabajos',idRecepcion,qrAsignado,payload.matricula);

    if(resultBox){
      resultBox.innerHTML = `
        <div class="qr-assigned-big">
          <div class="qr-assigned-title">✅ ORDEN CREADA</div>
          <div class="qr-assigned-note">QR asignado automáticamente:</div>
          <div class="qr-assigned-code">${escapeHtml(qrAsignado)}</div>
          <div class="qr-assigned-note">
            Coge físicamente el cartel ${escapeHtml(qrAsignado)} y colócalo en el coche.<br>
            ID recepción: ${escapeHtml(idRecepcion)}
          </div>
          <button type="button" onclick="loadReceptionQR('${escapeJs(qrAsignado)}')">Abrir orden del ${escapeHtml(qrAsignado)}</button>
        </div>
      `;
    }

    setTimeout(()=>loadWorks(),700);
  });
}

function saveWorkStatus(idTrabajo){
  const selectEstado = document.getElementById('estado_' + idTrabajo);
  const selectPrioridad = document.getElementById('prioridad_' + idTrabajo);
  const progresoInput = document.getElementById('progreso_' + idTrabajo);

  if(!selectEstado){
    showMessage('No se ha encontrado el selector de estado.','error');
    return;
  }

  const botonActivo = document.activeElement;
  if(botonActivo && botonActivo.tagName === 'BUTTON'){
    botonActivo.disabled = true;
    botonActivo.textContent = 'Guardando...';
  }

  callSaveAPI({
    accion:'cambiarEstadoTrabajo',
    idTrabajo:idTrabajo,
    estado:selectEstado.value,
    prioridad:selectPrioridad ? selectPrioridad.value : '',
    progreso:progresoInput ? progresoInput.value.trim() : '',
    usuario:currentUser.username
  }, r => {
    if(botonActivo && botonActivo.tagName === 'BUTTON'){
      botonActivo.disabled = false;
      botonActivo.textContent = 'Guardar cambios';
    }

    if(!r || !r.ok){
      showMessage('Error actualizando trabajo:\n' + (r && r.msg ? r.msg : 'Error desconocido'), 'error');
      return;
    }

    showMessage(r.msg || 'Trabajo guardado correctamente.', 'success');

    const entry = getEntryParams();

    setTimeout(() => {
      if(entry.qrHarrera){
        loadReceptionQR(entry.qrHarrera);
      }else{
        loadWorks();
      }
    }, 500);
  });
}

function callSaveAPI(payload,onDone){const callbackName='handleSaveResponse_'+Date.now();window[callbackName]=function(result){try{onDone(result)}finally{const script=document.getElementById(callbackName);if(script)script.remove();delete window[callbackName]}};const params=new URLSearchParams();params.set('callback',callbackName);Object.keys(payload).forEach(k=>params.set(k,payload[k]??''));const script=document.createElement('script');script.id=callbackName;params.set('_ts',Date.now());params.set('_ts',Date.now());params.set('_ts',Date.now());script.src=SAVE_API_URL+'?'+params.toString();script.onerror=function(){showMessage('Error al conectar con el servicio de guardado.','error');script.remove();delete window[callbackName]};document.body.appendChild(script)}
function renderFichaTecnica(link){if(!link)return'';return`<div class="ficha-box"><strong>Ficha técnica</strong><br><br><a class="button-link" href="${escapeAttr(link)}" target="_blank" rel="noopener"><button type="button" class="small-btn">Ver ficha técnica</button></a></div>`}function renderRTA(link){if(!link)return'';return`<div class="ficha-box"><strong>RTA</strong><br><br><a class="button-link" href="${escapeAttr(link)}" target="_blank" rel="noopener"><button type="button" class="small-btn">Ver RTA</button></a></div>`}
function getTutorialSteps(){
  const role=currentUser&&currentUser.role?currentUser.role:'alumno';
  if(role==='profesor'){
    return [
      {title:'Bienvenido a MENDIcar',text:'Esta aplicación sirve para gestionar vehículos, recepciones, trabajos de mecánica y carrocería, progresos e histórico del taller.'},
      {title:'Panel principal',text:'Como profesor puedes ver todos los vehículos, abrir fichas, revisar estados y acceder al panel de trabajos.'},
      {title:'QR del centro',text:'Los QR de vehículos del centro abren directamente la ficha del coche.'},
      {title:'QR de recepción libre',text:'Si escaneas un QR de HARRERA libre, se abre el formulario de recepción.'},
      {title:'QR de recepción ocupado',text:'Si el QR ya está ocupado por un coche externo, debe abrirse la orden viva de trabajo.'},
      {title:'Trabajos activos',text:'Los trabajos se dividen en MEKANIKA y KARROZERIA. Pulsa sobre un coche para desplegar la tarea.'},
      {title:'Progreso de clase',text:'Al finalizar una clase, escribe qué se ha hecho para que el siguiente pueda continuar.'},
      {title:'Histórico',text:'Puedes consultar el histórico por matrícula o usar filtros en LANAK para ver quién hizo qué y cuándo.'}
    ];
  }
  return [
    {title:'Bienvenido a MENDIcar',text:'Usarás esta aplicación para consultar el vehículo asignado y registrar el trabajo realizado.'},
    {title:'Escanea el QR',text:'Entra siempre mediante el QR del vehículo o de la orden de trabajo.'},
    {title:'Lee el trabajo',text:'Antes de empezar, lee la descripción del trabajo y el último progreso guardado.'},
    {title:'Cambia el estado',text:'Si empiezas, pon “en curso”. Si acabas, pon “terminado”.'},
    {title:'Añade progreso',text:'Escribe claramente lo que has hecho y lo que queda pendiente.'},
    {title:'Guarda cambios',text:'Pulsa siempre “Guardar cambios”.'}
  ];
}
let tutorialSteps=[];let tutorialIndex=0;
function startTutorial(forced){tutorialSteps=getTutorialSteps();tutorialIndex=0;renderTutorialStep()}
function maybeStartTutorial(){if(!currentUser)return;const key='mendicar_tutorial_v2_'+currentUser.role;if(localStorage.getItem(key)==='ok')return;setTimeout(function(){startTutorial(false)},600)}
function renderTutorialStep(){const existing=document.getElementById('tutorialOverlay');if(existing)existing.remove();if(!tutorialSteps.length)return;const step=tutorialSteps[tutorialIndex];const overlay=document.createElement('div');overlay.id='tutorialOverlay';overlay.className='tutorial-overlay';overlay.innerHTML=`<div class="tutorial-card"><div class="tutorial-progress">Paso ${tutorialIndex+1} de ${tutorialSteps.length}</div><h2>${escapeHtml(step.title)}</h2><p>${escapeHtml(step.text)}</p><div class="tutorial-actions">${tutorialIndex>0?`<button type="button" class="tutorial-secondary" onclick="prevTutorialStep()">Atrás</button>`:''}${tutorialIndex<tutorialSteps.length-1?`<button type="button" onclick="nextTutorialStep()">Siguiente</button>`:`<button type="button" onclick="finishTutorial()">Finalizar</button>`}<button type="button" class="tutorial-secondary" onclick="skipTutorial()">Saltar</button></div></div>`;document.body.appendChild(overlay)}
function nextTutorialStep(){if(tutorialIndex<tutorialSteps.length-1){tutorialIndex++;renderTutorialStep()}}
function prevTutorialStep(){if(tutorialIndex>0){tutorialIndex--;renderTutorialStep()}}
function finishTutorial(){if(currentUser)localStorage.setItem('mendicar_tutorial_v2_'+currentUser.role,'ok');const overlay=document.getElementById('tutorialOverlay');if(overlay)overlay.remove()}
function skipTutorial(){finishTutorial()}


document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
