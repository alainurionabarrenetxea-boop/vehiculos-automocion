<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MENDIcar</title>

<link rel="icon" href="icono-512.png">
<link rel="apple-touch-icon" href="icono-512.png">

<meta name="theme-color" content="#2563eb">

<style>

/* ========= ESTILO ========= */

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:#eef4ff;
  color:#1f2937;
}

.hidden{
  display:none !important;
}

.box{
  max-width:1200px;
  margin:24px auto;
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  padding:24px;
}

.header-logo{
  display:flex;
  align-items:center;
  gap:18px;
}

.header-logo img{
  width:80px;
  height:80px;
  border-radius:18px;
  background:white;
  padding:6px;
}

.header h2{
  margin:0;
  font-size:42px;
}

.header p{
  margin-top:8px;
}

.content{
  padding:26px;
}

.footer-credit{
  text-align:center;
  padding:18px;
  font-size:13px;
  color:#6b7280;
  border-top:1px solid #e5e7eb;
}

.footer-credit strong{
  color:#2563eb;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:14px;
  border:1px solid #d1d5db;
  font-size:15px;
  box-sizing:border-box;
}

textarea{
  min-height:120px;
}

button{
  border:none;
  border-radius:14px;
  padding:14px 18px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  font-weight:700;
  font-size:15px;
}

button:hover{
  background:#1d4ed8;
}

.secondary-btn{
  background:#6b7280;
}

.vehicle-card{
  background:#f8fbff;
  border-radius:20px;
  padding:22px;
  border:1px solid #e5e7eb;
  margin-bottom:18px;
}

.vehicle-title{
  margin-top:0;
  font-size:32px;
}

.form-grid,
.work-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:12px;
}

.small-btn{
  width:auto;
  min-width:150px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:14px;
  border-bottom:1px solid #e5e7eb;
}

th{
  background:#f3f4f6;
}

.clickable-row:hover{
  background:#eff6ff;
  cursor:pointer;
}

.msg{
  padding:14px;
  border-radius:14px;
  margin-bottom:16px;
}

.error{
  background:#fef2f2;
  color:#b91c1c;
}

.info{
  background:#eff6ff;
  color:#1d4ed8;
}

.success{
  background:#ecfdf5;
  color:#047857;
}

.work-card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  border-left:8px solid #2563eb;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}

.priority-alta{
  border-left-color:#f59e0b;
}

.priority-urgente{
  border-left-color:#dc2626;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.badge-open{
  background:#dbeafe;
  color:#1d4ed8;
}

@media(max-width:800px){

  .form-grid,
  .work-columns{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
    align-items:stretch;
  }

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginView" class="box">

  <div class="header">

    <div class="header-logo">

      <img src="icono-512.png">

      <div>
        <h2>MENDIcar</h2>
        <p>Gestión digital de automoción</p>
      </div>

    </div>

  </div>

  <div class="content">

    <input
      id="username"
      type="text"
      placeholder="Usuario / correo"
    >

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button onclick="login()">
      Entrar
    </button>

    <div
      id="loginError"
      class="msg error hidden"
    ></div>

  </div>

  <div class="footer-credit">
    Aplicación realizada por
    <strong>Alain Urionabarrenetxea</strong>
  </div>

</div>

<!-- APP -->

<div id="appView" class="box hidden">

  <div class="header">

    <div class="header-logo">

      <img src="icono-512.png">

      <div>
        <h2>MENDIcar</h2>
        <p id="welcomeText"></p>
      </div>

    </div>

  </div>

  <div class="content">

    <div class="topbar">

      <div id="viewModeText">
        Consulta de vehículo
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">

        <button
          id="showAllBtn"
          class="small-btn hidden"
          onclick="showAllVehicles()"
        >
          Ver todos
        </button>

        <button
          class="small-btn"
          onclick="openJobsPanel()"
        >
          Trabajos
        </button>

        <button
          class="small-btn secondary-btn"
          onclick="logout()"
        >
          Cerrar sesión
        </button>

      </div>

    </div>

    <div
      id="appMessage"
      class="msg info hidden"
    ></div>

    <div id="vehicleDetail"></div>

    <div
      id="tableContainer"
      class="table-wrap hidden"
    >

      <table>

        <thead>
          <tr>
            <th>ID</th>
            <th>Vehículo</th>
            <th>Color</th>
            <th>VIN</th>
            <th>Estado</th>
            <th>Observaciones</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

    <!-- TRABAJOS -->

    <div
      id="jobsPanel"
      class="hidden"
    >

      <div class="vehicle-card">

        <h2 class="vehicle-title">
          Nuevo trabajo
        </h2>

        <div class="form-grid">

          <div>

            <label><strong>Taller</strong></label>

            <select id="jobTailerra">
              <option value="MEKANIKA">MEKANIKA</option>
              <option value="KARROZERIA">KARROZERIA</option>
            </select>

          </div>

          <div>

            <label><strong>Cliente</strong></label>

            <input id="jobCliente">

          </div>

          <div>

            <label><strong>Vehículo</strong></label>

            <input id="jobAutoa">

          </div>

          <div>

            <label><strong>Matrícula</strong></label>

            <input id="jobMatricula">

          </div>

          <div>

            <label><strong>Fecha programada</strong></label>

            <input
              id="jobFecha"
              type="date"
            >

          </div>

          <div>

            <label><strong>Hora programada</strong></label>

            <input
              id="jobHora"
              type="time"
            >

          </div>

          <div>

            <label><strong>Prioridad</strong></label>

            <select id="jobLehentasuna">
              <option value="normal">normal</option>
              <option value="alta">alta</option>
              <option value="urgente">urgente</option>
            </select>

          </div>

        </div>

        <label>
          <strong>Trabajo a realizar</strong>
        </label>

        <textarea id="jobLana"></textarea>

        <button onclick="createJob()">
          Crear trabajo
        </button>

      </div>

      <div class="work-columns">

        <div>

          <h2 class="vehicle-title">
            Mecánica
          </h2>

          <div id="mekanikaList"></div>

        </div>

        <div>

          <h2 class="vehicle-title">
            Carrocería
          </h2>

          <div id="karrozeriaList"></div>

        </div>

      </div>

    </div>

  </div>

  <div class="footer-credit">
    Aplicación realizada por
    <strong>Alain Urionabarrenetxea</strong>
  </div>

</div>

<script>

function login(){

  document
    .getElementById("loginView")
    .classList.add("hidden");

  document
    .getElementById("appView")
    .classList.remove("hidden");

  document
    .getElementById("welcomeText")
    .innerHTML =
    "Bienvenido · Profesor";

}

function logout(){

  document
    .getElementById("appView")
    .classList.add("hidden");

  document
    .getElementById("loginView")
    .classList.remove("hidden");

}

function openJobsPanel(){

  document
    .getElementById("jobsPanel")
    .classList.remove("hidden");

  document
    .getElementById("tableContainer")
    .classList.add("hidden");

  document
    .getElementById("vehicleDetail")
    .innerHTML = "";

}

function showAllVehicles(){

  document
    .getElementById("jobsPanel")
    .classList.add("hidden");

  document
    .getElementById("tableContainer")
    .classList.remove("hidden");

}

function createJob(){

  const cliente =
    document.getElementById("jobCliente").value;

  const autoa =
    document.getElementById("jobAutoa").value;

  const lana =
    document.getElementById("jobLana").value;

  const lehentasuna =
    document.getElementById("jobLehentasuna").value;

  const tailerra =
    document.getElementById("jobTailerra").value;

  const div =
    document.createElement("div");

  div.className =
    "work-card priority-" + lehentasuna;

  div.innerHTML = `

    <h3>${cliente}</h3>

    <strong>${autoa}</strong>

    <p>${lana}</p>

    <span class="badge badge-open">
      pendiente
    </span>

  `;

  if(tailerra === "MEKANIKA"){

    document
      .getElementById("mekanikaList")
      .prepend(div);

  }else{

    document
      .getElementById("karrozeriaList")
      .prepend(div);

  }

}

</script>

</body>
</html>
