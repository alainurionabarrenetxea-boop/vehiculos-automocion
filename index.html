ente{background:#dbeafe;color:#1d4ed8}.badge-curso{background:#fef3c7;color:#92400e}.badge-terminado{background:#dcfce7;color:#166534}.badge-cancelado{background:#fee2e2;color:#991b1b}@media(max-width:800px){.vehicle-grid,.form-grid,.work-columns{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:stretch}.topbar-actions{width:100%}.small-btn{width:100%}.header-logo{align-items:flex-start}.header-logo img{width:58px;height:58px}.header h2{font-size:28px}.content{padding:18px}}

<body>
<div id="loginView" class="box"><div class="header"><div class="header-logo"><img src="icono-512.png" alt="MENDIcar"><div><h2>MENDIcar</h2><p>Gestión digital de automoción</p></div></div></div><div class="content"><input id="username" type="text" placeholder="Usuario / correo"><input id="password" type="password" placeholder="Contraseña"><button type="button" onclick="login()">Entrar</button><div id="loginError" class="msg error hidden"></div></div><div class="footer-credit">Aplicación realizada por <strong>Alain Urionabarrenetxea</strong></div></div>
<div id="appView" class="box hidden"><div class="header"><div class="header-logo"><img src="icono-512.png" alt="MENDIcar"><div><h2>MENDIcar</h2><p id="welcomeText"></p></div></div></div><div class="content"><div class="topbar"><div id="viewModeText">Consulta de vehículo</div><div class="topbar-actions"><button id="showAllBtn" class="small-btn hidden" type="button" onclick="showAllVehicles()">Ver todos</button><button id="showWorksBtn" class="small-btn hidden" type="button" onclick="showWorksPanel()">Trabajos</button><button class="small-btn secondary-btn" type="button" onclick="logout()">Cerrar sesión</button></div></div><div id="appMessage" class="msg info hidden"></div><div id="vehicleDetail"></div><div id="tableContainer" class="table-wrap hidden"><table><thead><tr><th>ID</th><th>Vehículo</th><th>Color</th><th>VIN</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody id="tableBody"></tbody></table></div></div><div class="footer-credit">Aplicación realizada por <strong>Alain Urionabarrenetxea</strong></div></div>
<script>
let USERS=[],vehicles=[],currentUser=null;const SHEET_ID="1sf2TS8gCKachrkz66S6E_zQuafVpu7F_AhSLdhi-W-g",SHEET_GID="0",SAVE_API_URL="https://script.google.com/macros/s/AKfycbwBYs2oADcw-Za-nLVbR0oF5L6ZHx2gYd1JS-0vjIW9IbD53P9j7U68R09-WGieM2Er2A/exec";
function showLoginError(t){const e=document.getElementById('loginError');e.textContent=t;e.classList.remove('hidden')}function clearLoginError(){const e=document.getElementById('loginError');e.textContent='';e.classList.add('hidden')}function showMessage(t,type='info'){const e=document.getElementById('appMessage');e.textContent=t;e.className='msg '+type;e.classList.remove('hidden')}function clearMessage(){const e=document.getElementById('appMessage');e.textContent='';e.classList.add('hidden')}function value(v){return v==null?'':String(v).trim()}function normalizeYesNo(v){const x=String(v||'').trim().toLowerCase();if(['bai','si','sí','yes'].includes(x))return'Bai';if(['ez','no'].includes(x))return'Ez';return'Ez'}function normalizeRole(v){const x=String(v||'').trim().toLowerCase();if(x==='profesor'||x==='irakaslea')return'profesor';if(x==='alumno'||x==='ikaslea')return'alumno';return x}function isActive(v){const x=String(v||'').trim().toLowerCase();return ['bai','si','sí','yes','1','true'].includes(x)}function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function escapeAttr(v){return escapeHtml(v)}function escapeJs(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"')}function getEntryParams(){const p=new URLSearchParams(location.search);return{id:p.get('id'),trabajo:p.get('trabajo'),profesor:p.get('profesor'),panel:p.get('panel'),qrHarrera:p.get('qrHarrera')||p.get('harrera')||p.get('qr')}}
async function login(){clearLoginError();const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value.trim();try{const r=await fetch('https://opensheet.elk.sh/'+SHEET_ID+'/ERABILTZAILEAK');USERS=await r.json();const user=USERS.find(u=>String(u.usuario||'').trim().toLowerCase()===username&&String(u.password||'').trim()===password&&isActive(u.activo));if(!user){showLoginError('Usuario o contraseña incorrectos, o usuario inactivo.');return}const role=normalizeRole(user.rol),entry=getEntryParams();if(role==='alumno'&&!entry.id&&!entry.trabajo&&!entry.qrHarrera){showLoginError('Acceso solo permitido mediante QR del coche, ficha de trabajo o QR de recepción.');return}currentUser={username:String(user.usuario||'').trim(),role,name:String(user.nombre||user.usuario||'').trim(),taldea:String(user.taldea||'').trim()};document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('welcomeText').textContent='Bienvenido, '+currentUser.name+' · Rol: '+currentUser.role;if(currentUser.role==='profesor')document.getElementById('showWorksBtn').classList.remove('hidden');loadVehiclesJSONP()}catch(err){showLoginError('Error cargando usuarios:\n'+err.message)}}
function logout(){currentUser=null;vehicles=[];document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');['username','password'].forEach(id=>document.getElementById(id).value='');document.getElementById('vehicleDetail').innerHTML='';document.getElementById('tableBody').innerHTML='';document.getElementById('tableContainer').classList.add('hidden');document.getElementById('showAllBtn').classList.add('hidden');document.getElementById('showWorksBtn').classList.add('hidden');clearMessage();clearLoginError()}
function loadVehiclesJSONP(){clearMessage();const old=document.getElementById('sheetJsonpScript');if(old)old.remove();window.handleSheetData=function(response){try{const cols=response.table.cols.map((c,i)=>(c.label||'').trim()||'Columna '+(i+1));const rows=response.table.rows.map(row=>{const o={};cols.forEach((name,i)=>o[name]=row.c[i]&&row.c[i].v!=null?row.c[i].v:'');return o});vehicles=rows.map(r=>({id:value(r.ID),qr:value(r.QR),tailerra:value(r.TAILERRA),autoa:value(r.Autoa),color:value(r.Kolorea),vin:value(r.VIN),fitxaTeknika:value(r['Fitxa teknika']),rta:value(r.RTA),egokitua:value(r.Egokitua),erabilpena:value(r.Erabilpena),estado:value(r.Egoera),piztenDu:normalizeYesNo(value(r['Pizten du'])),piztuBeharDu:normalizeYesNo(value(r['Piztu behar du'])),observaciones:value(r.Oharrak),blokatuta:normalizeYesNo(value(r.BLOKATUTA)),idBlokeoa:value(r['ID BLOKEOA']),blokeoData:value(r['BLOKEO DATA']),blokeoZergatia:value(r['BLOKEO ZERGATIA'])})).filter(v=>v.id!=='');routeAfterLoad()}catch(e){showMessage('Error procesando la hoja:\n'+e.message,'error')}};const s=document.createElement('script');s.id='sheetJsonpScript';s.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?gid='+SHEET_GID+'&tqx=responseHandler:handleSheetData';s.onerror=()=>showMessage('No se ha podido cargar la hoja desde Google Sheets.','error');document.body.appendChild(s)}
function routeAfterLoad(){const entry=getEntryParams();if(!currentUser)return;if(entry.qrHarrera){loadReceptionQR(entry.qrHarrera);return}if(currentUser.role==='profesor'){if(entry.panel==='irakaslea'){showWorksPanel();return}if(entry.id){const v=vehicles.find(x=>String(x.id)===String(entry.id));if(!v){showMessage('No se ha encontrado ningún vehículo con ese ID.','error');return}renderVehicleDetail(v);return}document.getElementById('viewModeText').textContent='Panel general de profesor';document.getElementById('tableContainer').classList.remove('hidden');document.getElementById('showAllBtn').classList.add('hidden');renderVehiclesTable();return}if(currentUser.role==='alumno'){if(entry.id){const v=vehicles.find(x=>String(x.id)===String(entry.id));if(!v){showMessage('No se ha encontrado ningún vehículo con ese ID.','error');return}renderVehicleDetail(v);return}showMessage('Acceso denegado. El alumnado solo puede entrar desde QR o ficha de trabajo.','error')}}
function showAllVehicles(){if(!currentUser||currentUser.role!=='profesor')return;document.getElementById('viewModeText').textContent='Listado completo de vehículos';document.getElementById('vehicleDetail').innerHTML='';document.getElementById('tableContainer').classList.remove('hidden');document.getElementById('showAllBtn').classList.add('hidden');renderVehiclesTable()}function renderVehiclesTable(){document.getElementById('tableBody').innerHTML=vehicles.map(v=>`<tr class="clickable-row" onclick="openVehicleAsProfessor('${escapeJs(v.id)}')"><td>${escapeHtml(v.id)}</td><td>${escapeHtml(v.autoa)}</td><td>${escapeHtml(v.color)}</td><td>${escapeHtml(v.vin)}</td><td>${escapeHtml(v.estado)}</td><td>${escapeHtml(v.observaciones)}</td></tr>`).join('')}function openVehicleAsProfessor(id){const v=vehicles.find(x=>String(x.id)===String(id));if(v)renderVehicleDetail(v)}
function renderVehicleDetail(vehicle){const isProfesor=currentUser&&currentUser.role==='profesor',isBlockedForStudent=!isProfesor&&vehicle.blokatuta==='Bai';document.getElementById('viewModeText').textContent=isProfesor?'Ficha de vehículo':'Ficha asignada por QR';document.getElementById('tableContainer').classList.add('hidden');document.getElementById('showAllBtn').classList.toggle('hidden',!isProfesor);document.getElementById('vehicleDetail').innerHTML=`${vehicle.blokatuta==='Bai'?`<div class="danger-banner">🚫 VEHÍCULO BLOQUEADO\n${vehicle.idBlokeoa?'Bloqueado por: '+escapeHtml(vehicle.idBlokeoa):''}${vehicle.blokeoData?'\nFecha: '+escapeHtml(vehicle.blokeoData):''}${vehicle.blokeoZergatia?'\nMotivo: '+escapeHtml(vehicle.blokeoZergatia):''}</div>`:''}<div class="vehicle-card"><h2 class="vehicle-title">${escapeHtml(vehicle.autoa||'Vehículo')}</h2><div class="vehicle-grid"><div class="field"><div class="field-label">ID</div><div class="field-value">${escapeHtml(vehicle.id)}</div></div><div class="field"><div class="field-label">Taller</div><div class="field-value">${escapeHtml(vehicle.tailerra)}</div></div><div class="field"><div class="field-label">Color</div><div class="field-value">${escapeHtml(vehicle.color)}</div></div><div class="field"><div class="field-label">VIN</div><div class="field-value">${escapeHtml(vehicle.vin)}</div></div><div class="field"><div class="field-label">Egokitua</div><div class="field-value">${escapeHtml(vehicle.egokitua)}</div></div><div class="field"><div class="field-label">Erabilpena</div><div class="field-value">${escapeHtml(vehicle.erabilpena)}</div></div></div><div class="edit-box"><div id="saveStatus" class="save-status">Lista para guardar.</div><div class="form-grid"><div><label><strong>Estado / Egoera</strong></label><textarea id="estadoInput" ${isBlockedForStudent?'disabled':''}>${escapeHtml(vehicle.estado)}</textarea></div><div><label><strong>Observaciones / Oharrak</strong></label><textarea id="observacionesInput" ${isBlockedForStudent?'disabled':''}>${escapeHtml(vehicle.observaciones||'')}</textarea></div><div><label><strong>Pizten du</strong></label><select id="piztenDuInput" ${isBlockedForStudent?'disabled':''}><option value="Bai" ${vehicle.piztenDu==='Bai'?'selected':''}>Bai</option><option value="Ez" ${vehicle.piztenDu==='Ez'?'selected':''}>Ez</option></select></div><div><label><strong>Piztu behar du</strong></label><select id="piztuBeharDuInput" ${isBlockedForStudent?'disabled':''}><option value="Bai" ${vehicle.piztuBeharDu==='Bai'?'selected':''}>Bai</option><option value="Ez" ${vehicle.piztuBeharDu==='Ez'?'selected':''}>Ez</option></select></div>${isProfesor?`<div><label><strong>BLOKATUTA</strong></label><select id="blokatutaInput"><option value="Bai" ${vehicle.blokatuta==='Bai'?'selected':''}>Bai</option><option value="Ez" ${vehicle.blokatuta==='Ez'?'selected':''}>Ez</option></select></div><div><label><strong>BLOKEO ZERGATIA</strong></label><textarea id="blokeoZergatiaInput">${escapeHtml(vehicle.blokeoZergatia||'')}</textarea></div>`:''}</div>${!isBlockedForStudent?`<button type="button" onclick="saveVehicleChanges('${escapeJs(vehicle.id)}')">Guardar cambios</button>`:''}</div>${renderFichaTecnica(vehicle.fitxaTeknika)}${renderRTA(vehicle.rta)}</div>`}
function setSaveStatus(t,err=false){const e=document.getElementById('saveStatus');if(!e)return;e.textContent=t;e.style.background=err?'#fef2f2':'#eff6ff';e.style.color=err?'#b91c1c':'#1d4ed8'}function saveVehicleChanges(id){const v=vehicles.find(x=>String(x.id)===String(id));if(!v||!currentUser)return;const payload={accion:'guardarVehiculo',usuario:currentUser.username,rol:currentUser.role,idVehiculo:v.id,autoa:v.autoa,estado:document.getElementById('estadoInput').value.trim(),observaciones:document.getElementById('observacionesInput').value.trim(),piztenDu:document.getElementById('piztenDuInput').value,piztuBeharDu:document.getElementById('piztuBeharDuInput').value,blokeado:currentUser.role==='profesor'&&document.getElementById('blokatutaInput')?document.getElementById('blokatutaInput').value:v.blokatuta,motivo:currentUser.role==='profesor'&&document.getElementById('blokeoZergatiaInput')?document.getElementById('blokeoZergatiaInput').value.trim():v.blokeoZergatia};callSaveAPI(payload,r=>{if(!r||!r.ok){showMessage('Error al guardar:\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');setSaveStatus('Error al guardar.',true);return}showMessage('Cambios guardados correctamente.','success');loadVehiclesJSONP()})}
async function loadReceptionQR(qrId){clearMessage();try{const response=await fetch('https://opensheet.elk.sh/'+SHEET_ID+'/QR_HARRERA');const rows=await response.json();const qr=rows.find(r=>String(r.QR_HARRERA||'').trim()===String(qrId).trim());if(!qr){showMessage('No existe este QR de recepción: '+qrId,'error');return}const estado=String(qr.EGOERA||'').trim().toLowerCase();if(estado==='libre')renderReceptionForm(qrId);else renderReceptionDetail(qr)}catch(err){showMessage('Error cargando QR de recepción:\n'+err.message,'error')}}
function renderReceptionForm(qrId){document.getElementById('viewModeText').textContent='Nueva recepción de taller';document.getElementById('tableContainer').classList.add('hidden');document.getElementById('showAllBtn').classList.add('hidden');document.getElementById('vehicleDetail').innerHTML=`<div class="vehicle-card"><h2 class="vehicle-title">Recepción vehículo externo</h2><div class="field" style="margin-bottom:12px;"><div class="field-label">QR recepción</div><div class="field-value">${escapeHtml(qrId)}</div></div><div class="form-grid"><div><label><strong>Matrícula</strong></label><input id="recMatricula"></div><div><label><strong>Marca</strong></label><input id="recMarca"></div><div><label><strong>Modelo</strong></label><input id="recModelo"></div><div><label><strong>Kilómetros</strong></label><input id="recKm"></div><div><label><strong>Cliente</strong></label><input id="recCliente"></div><div><label><strong>Teléfono</strong></label><input id="recTelefono"></div><div><label><strong>Email</strong></label><input id="recEmail"></div><div><label><strong>Tipo de trabajo</strong></label><select id="recTipoTrabajo"><option value="MEKANIKA">Mecánica</option><option value="KARROZERIA">Carrocería</option><option value="BIAK">Mecánica + Carrocería</option></select></div><div><label><strong>Prioridad</strong></label><select id="recPrioridad"><option value="normal">normal</option><option value="alta">alta</option><option value="urgente">urgente</option></select></div><div><label><strong>Estado recepción</strong></label><select id="recEstadoRecepcion"><option value="abierta">abierta</option><option value="en curso">en curso</option><option value="cerrada">cerrada</option></select></div></div><label><strong>Queja del cliente</strong></label><textarea id="recQuejaCliente"></textarea><label><strong>Trabajo solicitado</strong></label><textarea id="recTrabajoSolicitado"></textarea><label><strong>Daños visibles</strong></label><textarea id="recDanosVisibles"></textarea><label><strong>Fotos</strong></label><textarea id="recFotos"></textarea><label><strong>Observaciones</strong></label><textarea id="recObservaciones"></textarea><button type="button" onclick="createReception('${escapeJs(qrId)}')">Crear recepción</button></div>`}
function renderReceptionDetail(qr){document.getElementById('viewModeText').textContent='Ficha de recepción';document.getElementById('tableContainer').classList.add('hidden');document.getElementById('showAllBtn').classList.add('hidden');document.getElementById('vehicleDetail').innerHTML=`<div class="vehicle-card"><h2 class="vehicle-title">Recepción ocupada</h2><div class="vehicle-grid"><div class="field"><div class="field-label">QR</div><div class="field-value">${escapeHtml(qr.QR_HARRERA)}</div></div><div class="field"><div class="field-label">Estado QR</div><div class="field-value">${escapeHtml(qr.EGOERA)}</div></div></div><div class="ficha-box">Este QR está ocupado. La recepción está guardada en la hoja HARRERA.</div>${currentUser&&currentUser.role==='profesor'?`<button type="button" class="danger-btn" onclick="closeReceptionQR('${escapeJs(qr.QR_HARRERA)}')">Cerrar recepción y liberar QR</button>`:''}</div>`}
function createReception(qrId){if(!currentUser)return;const payload={accion:'crearRecepcion',qrRecepcion:qrId,usuario:currentUser.username,rol:currentUser.role,taldea:currentUser.taldea,matricula:document.getElementById('recMatricula').value.trim(),marca:document.getElementById('recMarca').value.trim(),modelo:document.getElementById('recModelo').value.trim(),km:document.getElementById('recKm').value.trim(),cliente:document.getElementById('recCliente').value.trim(),telefono:document.getElementById('recTelefono').value.trim(),email:document.getElementById('recEmail').value.trim(),tipoTrabajo:document.getElementById('recTipoTrabajo').value,prioridad:document.getElementById('recPrioridad').value,quejaCliente:document.getElementById('recQuejaCliente').value.trim(),trabajoSolicitado:document.getElementById('recTrabajoSolicitado').value.trim(),estadoVehiculo:'',danosVisibles:document.getElementById('recDanosVisibles').value.trim(),fotos:document.getElementById('recFotos').value.trim(),observaciones:document.getElementById('recObservaciones').value.trim(),estadoRecepcion:document.getElementById('recEstadoRecepcion').value};if(!payload.matricula||!payload.cliente){showMessage('Rellena al menos matrícula y cliente.','error');return}callSaveAPI(payload,r=>{if(!r||!r.ok){showMessage('Error creando recepción:\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');return}showMessage('Recepción creada correctamente.','success');loadReceptionQR(qrId)})}
function closeReceptionQR(qrId){if(!confirm('¿Cerrar esta recepción y liberar el QR?'))return;callSaveAPI({accion:'cerrarRecepcion',qrRecepcion:qrId,usuario:currentUser.username,rol:currentUser.role},r=>{if(!r||!r.ok){showMessage('Error cerrando recepción:\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');return}showMessage('Recepción cerrada y QR liberado.','success');loadReceptionQR(qrId)})}
async let WORK_ROWS_CACHE = [];

function showWorksPanel(){
  if(!currentUser || currentUser.role !== 'profesor') return;

  document.getElementById('viewModeText').textContent = 'Panel de trabajos';
  document.getElementById('tableContainer').classList.add('hidden');
  document.getElementById('showAllBtn').classList.remove('hidden');

  document.getElementById('vehicleDetail').innerHTML = `
    <div class="vehicle-card">
      <h2 class="vehicle-title">Nuevo trabajo</h2>

      <div class="form-grid">
        <div>
          <label><strong>Taller</strong></label>
          <select id="workTailerra">
            <option value="MEKANIKA">MEKANIKA</option>
            <option value="KARROZERIA">KARROZERIA</option>
          </select>
        </div>

        <div><label><strong>Cliente</strong></label><input id="workCliente"></div>
        <div><label><strong>Vehículo</strong></label><input id="workAutoa"></div>
        <div><label><strong>Matrícula</strong></label><input id="workMatricula"></div>
        <div><label><strong>Fecha programada</strong></label><input type="date" id="workFecha"></div>
        <div><label><strong>Hora programada</strong></label><input type="time" id="workHora"></div>

        <div>
          <label><strong>Prioridad</strong></label>
          <select id="workPrioridad">
            <option value="normal">normal</option>
            <option value="alta">alta</option>
            <option value="urgente">urgente</option>
          </select>
        </div>
      </div>

      <label><strong>Trabajo a realizar</strong></label>
      <textarea id="workLana"></textarea>

      <button type="button" onclick="createWork()">Crear trabajo</button>
    </div>

    <div class="vehicle-card">
      <h2 class="vehicle-title">Trabajos activos</h2>
      <p style="margin-top:-8px;color:#6b7280;">
        Pulsa sobre un vehículo para desplegarlo. Al guardar como terminado o cancelado desaparece de esta lista y queda en LANAK.
      </p>
      <div id="worksList">Cargando...</div>
    </div>

    <div class="vehicle-card">
      <h2 class="vehicle-title">Histórico por matrícula</h2>
      <div class="form-grid">
        <div>
          <label><strong>Matrícula</strong></label>
          <input id="historyMatricula" placeholder="Ejemplo: BI6404BZ">
        </div>
        <div style="display:flex;align-items:end;">
          <button type="button" onclick="showWorkHistory()">Consultar histórico</button>
        </div>
      </div>
      <div id="historyResult"></div>
    </div>
  `;

  loadWorks();
}

async function loadWorks(){
  try{
    const response = await fetch('https://opensheet.elk.sh/' + SHEET_ID + '/LANAK');
    const rows = await response.json();
    WORK_ROWS_CACHE = rows;
    renderWorks(rows);
  }catch(err){
    document.getElementById('worksList').innerHTML = "<div class='msg error'>Error cargando trabajos</div>";
  }
}

function getWorkSortValue(r){
  const programmedDate = String(r.NOIZKO || '').trim();
  const programmedHour = String(r['N.ORDUA'] || '').trim();

  if(programmedDate){
    return programmedDate + ' ' + programmedHour;
  }

  return String(r.SORTZE_DATA || r.DATA || '') + ' ' + String(r.SORTZE_ORDUA || r.ORDUA || '');
}

function getPriorityValue(r){
  const p = String(r.LEHENTASUNA || 'normal').trim().toLowerCase();
  if(p === 'urgente') return 0;
  if(p === 'alta') return 1;
  return 2;
}

function renderWorks(rows){
  const allRows = rows.filter(r => String(r.ID_TRABAJO || '').trim() !== '');

  allRows.sort((a,b) => {
    const dateCompare = getWorkSortValue(a).localeCompare(getWorkSortValue(b));
    if(dateCompare !== 0) return dateCompare;
    return getPriorityValue(a) - getPriorityValue(b);
  });

  const latestMap = {};
  allRows.forEach(r => {
    latestMap[String(r.ID_TRABAJO || '').trim()] = r;
  });

  const latestRows = Object.values(latestMap);

  latestRows.sort((a,b) => {
    const dateCompare = getWorkSortValue(a).localeCompare(getWorkSortValue(b));
    if(dateCompare !== 0) return dateCompare;
    return getPriorityValue(a) - getPriorityValue(b);
  });

  const activeRows = latestRows.filter(r => {
    const estado = String(r.EGOERA || '').trim().toLowerCase();
    return estado !== 'terminado' && estado !== 'cancelado';
  });

  const mekanika = activeRows.filter(r => String(r.TAILERRA || '').trim() === 'MEKANIKA');
  const karrozeria = activeRows.filter(r => String(r.TAILERRA || '').trim() === 'KARROZERIA');

  document.getElementById('worksList').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;">
      <div>
        <h3 style="font-size:24px;margin-bottom:12px;">MEKANIKA</h3>
        ${renderWorkList(mekanika)}
      </div>
      <div>
        <h3 style="font-size:24px;margin-bottom:12px;">KARROZERIA</h3>
        ${renderWorkList(karrozeria)}
      </div>
    </div>
  `;
}

function renderWorkList(rows){
  if(!rows.length){
    return "<div class='ficha-box'>Sin trabajos</div>";
  }

  return rows.map(r => {
    const id = String(r.ID_TRABAJO || '').trim();
    const estado = String(r.EGOERA || 'pendiente').trim();
    const prioridad = String(r.LEHENTASUNA || 'normal').trim();
    const badgeClass = estado === 'en curso' ? 'badge-curso' :
                       estado === 'terminado' ? 'badge-terminado' :
                       estado === 'cancelado' ? 'badge-cancelado' :
                       'badge-pendiente';

    return `
      <details class="work-card priority-${escapeAttr(prioridad)}" style="padding:0;overflow:hidden;">
        <summary style="list-style:none;cursor:pointer;padding:18px;">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
            <div>
              <strong style="font-size:20px;">${escapeHtml(r.AUTOA || 'Vehículo')}</strong>
              ${r.MATRIKULA ? `<span style="color:#6b7280;"> · ${escapeHtml(r.MATRIKULA)}</span>` : ''}
              <br>
              <span style="color:#6b7280;">${escapeHtml(r.BEZEROA || '')}</span>
              <br>
              <span style="color:#6b7280;">Prioridad: ${escapeHtml(prioridad)}</span>
            </div>
            <span class="badge ${badgeClass}">${escapeHtml(estado)}</span>
          </div>
        </summary>

        <div style="padding:0 18px 18px;">
          <div class="field" style="margin-bottom:12px;">
            <div class="field-label">Trabajo</div>
            <div class="field-value">${escapeHtml(r.LANA || '')}</div>
          </div>

          <div class="vehicle-grid">
            <div class="field"><div class="field-label">Taller</div><div class="field-value">${escapeHtml(r.TAILERRA || '')}</div></div>
            <div class="field"><div class="field-label">Fecha</div><div class="field-value">${escapeHtml(r.NOIZKO || r.DATA || '')} ${escapeHtml(r['N.ORDUA'] || r.ORDUA || '')}</div></div>
            <div class="field"><div class="field-label">Usuario último registro</div><div class="field-value">${escapeHtml(r.ERABILTZAILEA || '')}</div></div>
            <div class="field"><div class="field-label">ID trabajo</div><div class="field-value">${escapeHtml(id)}</div></div>
          </div>

          <br>

          <label><strong>Estado</strong></label>
          <select id="estado_${escapeAttr(id)}">
            <option value="pendiente" ${estado === 'pendiente' ? 'selected' : ''}>pendiente</option>
            <option value="en curso" ${estado === 'en curso' ? 'selected' : ''}>en curso</option>
            <option value="terminado" ${estado === 'terminado' ? 'selected' : ''}>terminado</option>
            <option value="cancelado" ${estado === 'cancelado' ? 'selected' : ''}>cancelado</option>
          </select>

          <label><strong>Prioridad</strong></label>
          <select id="prioridad_${escapeAttr(id)}">
            <option value="normal" ${prioridad === 'normal' ? 'selected' : ''}>normal</option>
            <option value="alta" ${prioridad === 'alta' ? 'selected' : ''}>alta</option>
            <option value="urgente" ${prioridad === 'urgente' ? 'selected' : ''}>urgente</option>
          </select>

          <button type="button" onclick="saveWorkStatus('${escapeJs(id)}')">Guardar cambios</button>
        </div>
      </details>
    `;
  }).join('');
}

function showWorkHistory(){
  const input = document.getElementById('historyMatricula');
  const result = document.getElementById('historyResult');

  if(!input || !result) return;

  const matricula = String(input.value || '').trim().toLowerCase();

  if(!matricula){
    result.innerHTML = "<div class='msg error'>Introduce una matrícula.</div>";
    return;
  }

  const rows = WORK_ROWS_CACHE.filter(r =>
    String(r.MATRIKULA || '').trim().toLowerCase() === matricula
  );

  rows.sort((a,b) => getWorkSortValue(a).localeCompare(getWorkSortValue(b)));

  if(!rows.length){
    result.innerHTML = "<div class='ficha-box'>No hay histórico para esa matrícula.</div>";
    return;
  }

  result.innerHTML = rows.map(r => {
    const estado = String(r.EGOERA || '').trim();
    const prioridad = String(r.LEHENTASUNA || 'normal').trim();
    const badgeClass = estado === 'en curso' ? 'badge-curso' :
                       estado === 'terminado' ? 'badge-terminado' :
                       estado === 'cancelado' ? 'badge-cancelado' :
                       'badge-pendiente';

    return `
      <div class="work-card priority-${escapeAttr(prioridad)}">
        <strong>${escapeHtml(r.AUTOA || '')}</strong> · ${escapeHtml(r.MATRIKULA || '')}
        <br>
        Fecha: ${escapeHtml(r.DATA || r.SORTZE_DATA || '')} ${escapeHtml(r.ORDUA || r.SORTZE_ORDUA || '')}
        <br>
        Usuario: ${escapeHtml(r.ERABILTZAILEA || '')}
        <br>
        Taller: ${escapeHtml(r.TAILERRA || '')}
        <br>
        Prioridad: ${escapeHtml(prioridad)}
        <br>
        <span class="badge ${badgeClass}">${escapeHtml(estado)}</span>
        <br><br>
        ${escapeHtml(r.LANA || '')}
      </div>
    `;
  }).join('');
}

function createWork(){const payload={accion:'crearTrabajo',tailerra:document.getElementById('workTailerra').value,cliente:document.getElementById('workCliente').value.trim(),autoa:document.getElementById('workAutoa').value.trim(),matricula:document.getElementById('workMatricula').value.trim(),fecha:document.getElementById('workFecha').value,hora:document.getElementById('workHora').value,prioridad:document.getElementById('workPrioridad').value,lana:document.getElementById('workLana').value.trim(),usuario:currentUser.username};if(!payload.cliente||!payload.lana){showMessage('Falta cliente o trabajo a realizar.','error');return}callSaveAPI(payload,r=>{if(!r||!r.ok){showMessage('Error creando trabajo:\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');return}showMessage('Trabajo creado correctamente.','success');showWorksPanel()})}
function saveWorkStatus(idTrabajo){
  const selectEstado = document.getElementById('estado_' + idTrabajo);
  const selectPrioridad = document.getElementById('prioridad_' + idTrabajo);

  if(!selectEstado){
    showMessage('No se ha encontrado el selector de estado.','error');
    return;
  }

  callSaveAPI({
    accion:'cambiarEstadoTrabajo',
    idTrabajo:idTrabajo,
    estado:selectEstado.value,
    prioridad:selectPrioridad ? selectPrioridad.value : '',
    usuario:currentUser.username
  }, r => {
    if(!r || !r.ok){
      showMessage('Error actualizando trabajo:\n' + (r && r.msg ? r.msg : 'Error desconocido'), 'error');
      return;
    }
    showMessage('Trabajo guardado correctamente.', 'success');
    loadWorks();
  });
}
function callSaveAPI(payload,onDone){const callbackName='handleSaveResponse_'+Date.now();window[callbackName]=function(result){try{onDone(result)}finally{const script=document.getElementById(callbackName);if(script)script.remove();delete window[callbackName]}};const params=new URLSearchParams();params.set('callback',callbackName);Object.keys(payload).forEach(k=>params.set(k,payload[k]??''));const script=document.createElement('script');script.id=callbackName;script.src=SAVE_API_URL+'?'+params.toString();script.onerror=function(){showMessage('Error al conectar con el servicio de guardado.','error');script.remove();delete window[callbackName]};document.body.appendChild(script)}
function renderFichaTecnica(link){if(!link)return'';return`<div class="ficha-box"><strong>Ficha técnica</strong><br><br><a class="button-link" href="${escapeAttr(link)}" target="_blank" rel="noopener"><button type="button" class="small-btn">Ver ficha técnica</button></a></div>`}function renderRTA(link){if(!link)return'';return`<div class="ficha-box"><strong>RTA</strong><br><br><a class="button-link" href="${escapeAttr(link)}" target="_blank" rel="noopener"><button type="button" class="small-btn">Ver RTA</button></a></div>`}document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
