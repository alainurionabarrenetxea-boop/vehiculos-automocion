<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MENDIcar</title>

  <link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
  <link rel="apple-touch-icon" href="icono-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    /* ========= ESTILO MODERNO MENDIcar ========= */

body{
  margin:0;
  font-family:'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#eef4ff,#f7fbff);
  color:#1f2937;
}

/* CAJAS */

.box{
  max-width:1200px;
  margin:24px auto;
  background:white;
  border-radius:24px;
  overflow:hidden;
  box-shadow:
    0 10px 30px rgba(0,0,0,.08),
    0 2px 8px rgba(0,0,0,.05);
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  padding:26px;
}

.header-logo{
  display:flex;
  align-items:center;
  gap:18px;
}

.header-logo img{
  width:76px;
  height:76px;
  border-radius:18px;
  background:white;
  padding:6px;
  object-fit:contain;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header h2{
  margin:0;
  font-size:34px;
  font-weight:800;
  letter-spacing:.5px;
}

.header p{
  margin-top:6px;
  opacity:.95;
  font-size:15px;
}

/* CONTENIDO */

.content{
  padding:26px;
}

/* FOOTER */

.footer-credit{
  text-align:center;
  padding:16px;
  font-size:13px;
  color:#6b7280;
  background:#f9fafb;
  border-top:1px solid #e5e7eb;
}

.footer-credit strong{
  color:#2563eb;
}

/* MENSAJES */

.msg{
  padding:14px;
  border-radius:14px;
  margin-bottom:18px;
  white-space:pre-wrap;
  font-weight:600;
}

.error{
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca;
}

.info{
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
}

.success{
  background:#ecfdf5;
  color:#047857;
  border:1px solid #a7f3d0;
}

/* BOTONES */

button{
  border:none;
  border-radius:14px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:700;
  font-size:15px;
  transition:.18s;
}

button:hover{
  transform:translateY(-1px);
}

.small-btn{
  width:auto;
  min-width:150px;
}

.secondary-btn{
  background:#6b7280;
  color:white;
}

.secondary-btn:hover{
  background:#4b5563;
}

.danger-btn{
  background:#b91c1c;
  color:white;
}

.danger-btn:hover{
  background:#991b1b;
}

/* INPUTS */

input,
textarea,
select{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border-radius:14px;
  border:1px solid #d1d5db;
  font-size:15px;
  box-sizing:border-box;
  font-family:inherit;
  transition:.15s;
  background:white;
}

input:focus,
textarea:focus,
select:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

textarea{
  min-height:110px;
  resize:vertical;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

/* TARJETAS */

.vehicle-card{
  border:1px solid #e5e7eb;
  border-radius:22px;
  padding:24px;
  background:#fafcff;
  margin-bottom:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.04);
}

.vehicle-title{
  margin:0 0 20px;
  font-size:30px;
  color:#111827;
  font-weight:800;
}

/* GRID */

.vehicle-grid,
.form-grid,
.work-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

/* CAMPOS */

.field{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:16px;
  box-shadow:0 2px 6px rgba(0,0,0,.03);
}

.field-label{
  font-size:11px;
  color:#6b7280;
  text-transform:uppercase;
  margin-bottom:8px;
  letter-spacing:.8px;
  font-weight:700;
}

.field-value{
  font-size:16px;
  font-weight:700;
  word-break:break-word;
}

/* BLOQUES */

.ficha-box,
.edit-box{
  margin-top:16px;
  padding:18px;
  border-radius:18px;
  background:white;
  border:1px solid #e5e7eb;
  white-space:pre-wrap;
  box-shadow:0 2px 6px rgba(0,0,0,.03);
}

/* TABLAS */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:18px;
  overflow:hidden;
}

th,
td{
  border-bottom:1px solid #e5e7eb;
  padding:14px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f9fafb;
  font-size:13px;
  text-transform:uppercase;
  color:#6b7280;
}

tr.clickable-row{
  transition:.12s;
}

tr.clickable-row:hover{
  background:#eff6ff;
  cursor:pointer;
}

/* ESTADO GUARDADO */

.save-status{
  display:inline-block;
  padding:10px 12px;
  border-radius:12px;
  font-size:13px;
  margin-bottom:14px;
  background:#eff6ff;
  color:#1d4ed8;
  font-weight:700;
}

/* BANNER BLOQUEO */

.danger-banner{
  background:linear-gradient(135deg,#dc2626,#b91c1c);
  color:white;
  padding:16px;
  border-radius:18px;
  margin-bottom:16px;
  font-weight:700;
  white-space:pre-wrap;
  box-shadow:0 4px 10px rgba(185,28,28,.25);
}

/* TRABAJOS */

.work-card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  border:1px solid #e5e7eb;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.priority-urgente{
  border-left:8px solid #dc2626;
}

.priority-alta{
  border-left:8px solid #f59e0b;
}

.priority-normal{
  border-left:8px solid #2563eb;
}

/* BADGES */

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.badge-open{
  background:#dcfce7;
  color:#166534;
}

.badge-progress{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-closed{
  background:#fee2e2;
  color:#991b1b;
}

/* RESPONSIVE */

@media (max-width:800px){

  .vehicle-grid,
  .form-grid,
  .work-columns{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
    align-items:stretch;
  }

  .small-btn{
    width:100%;
  }

  .header-logo{
    align-items:flex-start;
  }

  .header h2{
    font-size:28px;
  }

}
  </style>
</head>

<body>

  <div id="loginView" class="box">
    <div class="header">
      <div class="header-logo">
        <img src="icono-512.png" alt="MENDIcar">
        <div>
          <h2>MENDIcar</h2>
          <p>Gestión digital de automoción</p>
        </div>
      </div>
    </div>

    <div class="content">
      <input id="username" type="text" placeholder="Usuario / correo" />
      <input id="password" type="password" placeholder="Contraseña" />
      <button type="button" onclick="login()">Entrar</button>
      <div id="loginError" class="msg error hidden"></div>
    </div>

    <div class="footer-credit">
      Aplicación realizada por <strong>Alain Urionabarrenetxea</strong>
    </div>
  </div>

  <div id="appView" class="box hidden">
    <div class="header">
      <div class="header-logo">
        <img src="icono-512.png" alt="MENDIcar">
        <div>
          <h2>MENDIcar</h2>
          <p id="welcomeText"></p>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="topbar">
        <div id="viewModeText">Consulta de vehículo</div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button id="showAllBtn" class="small-btn hidden" type="button" onclick="showAllVehicles()">Ver todos</button>
          <button id="showWorksBtn" class="small-btn hidden" type="button" onclick="showWorksPanel()">Trabajos</button>
          <button class="small-btn secondary-btn" type="button" onclick="logout()">Cerrar sesión</button>
        </div>
      </div>

      <div id="appMessage" class="msg info hidden"></div>
      <div id="vehicleDetail"></div>

      <div id="tableContainer" class="table-wrap hidden">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Vehículo</th>
              <th>Color</th>
              <th>VIN</th>
              <th>Estado</th>
              <th>Observaciones</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="footer-credit">
      Aplicación realizada por <strong>Alain Urionabarrenetxea</strong>
    </div>
  </div>

  <script>
    let USERS = [];
    let vehicles = [];
    let currentUser = null;

    const SHEET_ID = "1sf2TS8gCKachrkz66S6E_zQuafVpu7F_AhSLdhi-W-g";
    const SHEET_GID = "0";
    const SAVE_API_URL = "https://script.google.com/macros/s/AKfycbwBYs2oADcw-Za-nLVbR0oF5L6ZHx2gYd1JS-0vjIW9IbD53P9j7U68R09-WGieM2Er2A/exec";

    function showLoginError(text) {
      const el = document.getElementById("loginError");
      el.textContent = text;
      el.classList.remove("hidden");
    }

    function clearLoginError() {
      const el = document.getElementById("loginError");
      el.textContent = "";
      el.classList.add("hidden");
    }

    function showMessage(text, type = "info") {
      const el = document.getElementById("appMessage");
      el.textContent = text;
      el.className = "msg " + type;
      el.classList.remove("hidden");
    }

    function clearMessage() {
      const el = document.getElementById("appMessage");
      el.textContent = "";
      el.classList.add("hidden");
    }

    function value(v) {
      return v == null ? "" : String(v).trim();
    }

    function normalizeYesNo(v) {
      const x = String(v || "").trim().toLowerCase();
      if (x === "bai" || x === "si" || x === "sí" || x === "yes") return "Bai";
      if (x === "ez" || x === "no") return "Ez";
      return "Ez";
    }

    function normalizeRole(v) {
      const x = String(v || "").trim().toLowerCase();
      if (x === "profesor" || x === "irakaslea") return "profesor";
      if (x === "alumno" || x === "ikaslea") return "alumno";
      return x;
    }

    function isActive(v) {
      const x = String(v || "").trim().toLowerCase();
      return x === "bai" || x === "si" || x === "sí" || x === "yes" || x === "1" || x === "true";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    function escapeJs(value) {
      return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
    }

    function getEntryParams() {
      const params = new URLSearchParams(window.location.search);

      return {
        id: params.get("id"),
        trabajo: params.get("trabajo"),
        profesor: params.get("profesor"),
        panel: params.get("panel"),
        qrHarrera: params.get("qrHarrera") || params.get("harrera") || params.get("qr")
      };
    }

    async function login() {
      clearLoginError();

      const username = document.getElementById("username").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();

      try {
        const response = await fetch("https://opensheet.elk.sh/" + SHEET_ID + "/ERABILTZAILEAK");
        USERS = await response.json();

        const user = USERS.find(u =>
          String(u.usuario || "").trim().toLowerCase() === username &&
          String(u.password || "").trim() === password &&
          isActive(u.activo)
        );

        if (!user) {
          showLoginError("Usuario o contraseña incorrectos, o usuario inactivo.");
          return;
        }

        const role = normalizeRole(user.rol);
        const entry = getEntryParams();

        if (role === "alumno" && !entry.id && !entry.trabajo && !entry.qrHarrera) {
          showLoginError("Acceso solo permitido mediante QR del coche, ficha de trabajo o QR de recepción.");
          return;
        }

        currentUser = {
          username: String(user.usuario || "").trim(),
          role: role,
          name: String(user.nombre || user.usuario || "").trim(),
          taldea: String(user.taldea || "").trim()
        };

        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("appView").classList.remove("hidden");

        document.getElementById("welcomeText").textContent =
          "Bienvenido, " + currentUser.name + " · Rol: " + currentUser.role;

        if (currentUser.role === "profesor") {
          document.getElementById("showWorksBtn").classList.remove("hidden");
        }

        loadVehiclesJSONP();

      } catch (err) {
        showLoginError("Error cargando usuarios:\n" + err.message);
      }
    }

    function logout() {
      currentUser = null;
      vehicles = [];

      document.getElementById("appView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");

      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("vehicleDetail").innerHTML = "";
      document.getElementById("tableBody").innerHTML = "";
      document.getElementById("tableContainer").classList.add("hidden");
      document.getElementById("showAllBtn").classList.add("hidden");
      document.getElementById("showWorksBtn").classList.add("hidden");

      clearMessage();
      clearLoginError();
    }

    function loadVehiclesJSONP() {
      clearMessage();

      const old = document.getElementById("sheetJsonpScript");
      if (old) old.remove();

      window.handleSheetData = function(response) {
        try {
          const cols = response.table.cols.map((col, index) => {
            const label = (col.label || "").trim();
            return label || "Columna " + (index + 1);
          });

          const rows = response.table.rows.map(row => {
            const obj = {};
            cols.forEach((colName, index) => {
              obj[colName] = row.c[index] && row.c[index].v != null ? row.c[index].v : "";
            });
            return obj;
          });

          vehicles = rows.map(r => ({
            id: value(r["ID"]),
            qr: value(r["QR"]),
            tailerra: value(r["TAILERRA"]),
            autoa: value(r["Autoa"]),
            color: value(r["Kolorea"]),
            vin: value(r["VIN"]),
            fitxaTeknika: value(r["Fitxa teknika"]),
            rta: value(r["RTA"]),
            egokitua: value(r["Egokitua"]),
            erabilpena: value(r["Erabilpena"]),
            estado: value(r["Egoera"]),
            piztenDu: normalizeYesNo(value(r["Pizten du"])),
            piztuBeharDu: normalizeYesNo(value(r["Piztu behar du"])),
            observaciones: value(r["Oharrak"]),
            blokatuta: normalizeYesNo(value(r["BLOKATUTA"])),
            idBlokeoa: value(r["ID BLOKEOA"]),
            blokeoData: value(r["BLOKEO DATA"]),
            blokeoZergatia: value(r["BLOKEO ZERGATIA"])
          })).filter(v => v.id !== "");

          routeAfterLoad();

        } catch (error) {
          showMessage("Error procesando la hoja:\n" + error.message, "error");
        }
      };

      const script = document.createElement("script");
      script.id = "sheetJsonpScript";
      script.src =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq?gid=" +
        SHEET_GID +
        "&tqx=responseHandler:handleSheetData";

      script.onerror = function() {
        showMessage("No se ha podido cargar la hoja desde Google Sheets.", "error");
      };

      document.body.appendChild(script);
    }

    function routeAfterLoad() {
      const entry = getEntryParams();

      if (!currentUser) return;

      if (entry.qrHarrera) {
        loadReceptionQR(entry.qrHarrera);
        return;
      }

      if (currentUser.role === "profesor") {
        if (entry.panel === "irakaslea") {
          showWorksPanel();
          return;
        }

        if (entry.id) {
          const vehicle = vehicles.find(v => String(v.id) === String(entry.id));

          if (!vehicle) {
            showMessage("No se ha encontrado ningún vehículo con ese ID.", "error");
            return;
          }

          renderVehicleDetail(vehicle);
          return;
        }

        document.getElementById("viewModeText").textContent = "Panel general de profesor";
        document.getElementById("tableContainer").classList.remove("hidden");
        renderVehiclesTable();
        return;
      }

      if (currentUser.role === "alumno") {
        if (entry.id) {
          const vehicle = vehicles.find(v => String(v.id) === String(entry.id));

          if (!vehicle) {
            showMessage("No se ha encontrado ningún vehículo con ese ID.", "error");
            return;
          }

          renderVehicleDetail(vehicle);
          return;
        }

        showMessage("Acceso denegado. El alumnado solo puede entrar desde QR o ficha de trabajo.", "error");
      }
    }

    function showAllVehicles() {
      if (!currentUser || currentUser.role !== "profesor") return;

      document.getElementById("viewModeText").textContent = "Listado completo de vehículos";
      document.getElementById("vehicleDetail").innerHTML = "";
      document.getElementById("tableContainer").classList.remove("hidden");
      document.getElementById("showAllBtn").classList.add("hidden");

      renderVehiclesTable();
    }

    function renderVehiclesTable() {
      const tableBody = document.getElementById("tableBody");

      tableBody.innerHTML = vehicles.map(v => `
        <tr class="clickable-row" onclick="openVehicleAsProfessor('${escapeJs(v.id)}')">
          <td>${escapeHtml(v.id)}</td>
          <td>${escapeHtml(v.autoa)}</td>
          <td>${escapeHtml(v.color)}</td>
          <td>${escapeHtml(v.vin)}</td>
          <td>${escapeHtml(v.estado)}</td>
          <td>${escapeHtml(v.observaciones)}</td>
        </tr>
      `).join("");
    }

    function openVehicleAsProfessor(vehicleId) {
      if (!currentUser || currentUser.role !== "profesor") return;

      const vehicle = vehicles.find(v => String(v.id) === String(vehicleId));
      if (!vehicle) return;

      renderVehicleDetail(vehicle);
    }

    function renderVehicleDetail(vehicle) {
      const isProfesor = currentUser && currentUser.role === "profesor";
      const isBlockedForStudent = !isProfesor && vehicle.blokatuta === "Bai";

      document.getElementById("viewModeText").textContent = isProfesor ? "Ficha de vehículo" : "Ficha asignada por QR";
      document.getElementById("tableContainer").classList.add("hidden");

      if (isProfesor) document.getElementById("showAllBtn").classList.remove("hidden");
      else document.getElementById("showAllBtn").classList.add("hidden");

      document.getElementById("vehicleDetail").innerHTML = `
        ${vehicle.blokatuta === "Bai" ? `
          <div class="danger-banner">🚫 VEHÍCULO BLOQUEADO
${vehicle.idBlokeoa ? "Bloqueado por: " + escapeHtml(vehicle.idBlokeoa) : ""}
${vehicle.blokeoData ? "\nFecha: " + escapeHtml(vehicle.blokeoData) : ""}
${vehicle.blokeoZergatia ? "\nMotivo: " + escapeHtml(vehicle.blokeoZergatia) : ""}</div>
        ` : ""}

        <div class="vehicle-card">
          <h2 class="vehicle-title">${escapeHtml(vehicle.autoa || "Vehículo")}</h2>

          <div class="vehicle-grid">
            <div class="field"><div class="field-label">ID</div><div class="field-value">${escapeHtml(vehicle.id)}</div></div>
            <div class="field"><div class="field-label">Taller</div><div class="field-value">${escapeHtml(vehicle.tailerra)}</div></div>
            <div class="field"><div class="field-label">Color</div><div class="field-value">${escapeHtml(vehicle.color)}</div></div>
            <div class="field"><div class="field-label">VIN</div><div class="field-value">${escapeHtml(vehicle.vin)}</div></div>
            <div class="field"><div class="field-label">Egokitua</div><div class="field-value">${escapeHtml(vehicle.egokitua)}</div></div>
            <div class="field"><div class="field-label">Erabilpena</div><div class="field-value">${escapeHtml(vehicle.erabilpena)}</div></div>
          </div>

          <div class="edit-box">
            <div id="saveStatus" class="save-status">Lista para guardar.</div>

            <div class="form-grid">
              <div><label><strong>Estado / Egoera</strong></label><textarea id="estadoInput" ${isBlockedForStudent ? "disabled" : ""}>${escapeHtml(vehicle.estado)}</textarea></div>
              <div><label><strong>Observaciones / Oharrak</strong></label><textarea id="observacionesInput" ${isBlockedForStudent ? "disabled" : ""}>${escapeHtml(vehicle.observaciones || "")}</textarea></div>

              <div>
                <label><strong>Pizten du</strong></label>
                <select id="piztenDuInput" ${isBlockedForStudent ? "disabled" : ""}>
                  <option value="Bai" ${vehicle.piztenDu === "Bai" ? "selected" : ""}>Bai</option>
                  <option value="Ez" ${vehicle.piztenDu === "Ez" ? "selected" : ""}>Ez</option>
                </select>
              </div>

              <div>
                <label><strong>Piztu behar du</strong></label>
                <select id="piztuBeharDuInput" ${isBlockedForStudent ? "disabled" : ""}>
                  <option value="Bai" ${vehicle.piztuBeharDu === "Bai" ? "selected" : ""}>Bai</option>
                  <option value="Ez" ${vehicle.piztuBeharDu === "Ez" ? "selected" : ""}>Ez</option>
                </select>
              </div>

              ${isProfesor ? `
                <div>
                  <label><strong>BLOKATUTA</strong></label>
                  <select id="blokatutaInput">
                    <option value="Bai" ${vehicle.blokatuta === "Bai" ? "selected" : ""}>Bai</option>
                    <option value="Ez" ${vehicle.blokatuta === "Ez" ? "selected" : ""}>Ez</option>
                  </select>
                </div>

                <div><label><strong>BLOKEO ZERGATIA</strong></label><textarea id="blokeoZergatiaInput">${escapeHtml(vehicle.blokeoZergatia || "")}</textarea></div>
              ` : ""}
            </div>

            ${!isBlockedForStudent ? `<button type="button" onclick="saveVehicleChanges('${escapeJs(vehicle.id)}')">Guardar cambios</button>` : ""}
          </div>

          ${renderFichaTecnica(vehicle.fitxaTeknika)}
          ${renderRTA(vehicle.rta)}
        </div>
      `;
    }

    function setSaveStatus(text, isError = false) {
      const el = document.getElementById("saveStatus");
      if (!el) return;

      el.textContent = text;
      el.style.background = isError ? "#fef2f2" : "#eff6ff";
      el.style.color = isError ? "#b91c1c" : "#1d4ed8";
    }

    function saveVehicleChanges(vehicleId) {
      const vehicle = vehicles.find(v => String(v.id) === String(vehicleId));
      if (!vehicle || !currentUser) return;

      const payload = {
        accion: "guardarVehiculo",
        usuario: currentUser.username,
        rol: currentUser.role,
        idVehiculo: vehicle.id,
        autoa: vehicle.autoa,
        estado: document.getElementById("estadoInput").value.trim(),
        observaciones: document.getElementById("observacionesInput").value.trim(),
        piztenDu: document.getElementById("piztenDuInput").value,
        piztuBeharDu: document.getElementById("piztuBeharDuInput").value,
        blokeado: currentUser.role === "profesor" && document.getElementById("blokatutaInput")
          ? document.getElementById("blokatutaInput").value
          : vehicle.blokatuta,
        motivo: currentUser.role === "profesor" && document.getElementById("blokeoZergatiaInput")
          ? document.getElementById("blokeoZergatiaInput").value.trim()
          : vehicle.blokeoZergatia
      };

      callSaveAPI(payload, function(result) {
        if (!result || !result.ok) {
          showMessage("Error al guardar:\n" + (result && result.msg ? result.msg : "Error desconocido"), "error");
          setSaveStatus("Error al guardar.", true);
          return;
        }

        showMessage("Cambios guardados correctamente.", "success");
        loadVehiclesJSONP();
      });
    }

    async function loadReceptionQR(qrId) {
      clearMessage();

      try {
        const response = await fetch("https://opensheet.elk.sh/" + SHEET_ID + "/QR_HARRERA");
        const rows = await response.json();

        const qr = rows.find(r => String(r["QR_HARRERA"] || "").trim() === String(qrId).trim());

        if (!qr) {
          showMessage("No existe este QR de recepción: " + qrId, "error");
          return;
        }

        const estado = String(qr["EGOERA"] || "").trim().toLowerCase();

        if (estado === "libre") {
          renderReceptionForm(qrId);
          return;
        }

        renderReceptionDetail(qr);

      } catch (err) {
        showMessage("Error cargando QR de recepción:\n" + err.message, "error");
      }
    }

    function renderReceptionForm(qrId) {
      document.getElementById("viewModeText").textContent = "Nueva recepción de taller";
      document.getElementById("tableContainer").classList.add("hidden");
      document.getElementById("showAllBtn").classList.add("hidden");

      document.getElementById("vehicleDetail").innerHTML = `
        <div class="vehicle-card">
          <h2 class="vehicle-title">Recepción vehículo externo</h2>

          <div class="field" style="margin-bottom:12px;">
            <div class="field-label">QR recepción</div>
            <div class="field-value">${escapeHtml(qrId)}</div>
          </div>

          <div class="form-grid">
            <div><label><strong>Matrícula</strong></label><input id="recMatricula"></div>
            <div><label><strong>Marca</strong></label><input id="recMarca"></div>
            <div><label><strong>Modelo</strong></label><input id="recModelo"></div>
            <div><label><strong>Kilómetros</strong></label><input id="recKm"></div>
            <div><label><strong>Cliente</strong></label><input id="recCliente"></div>
            <div><label><strong>Teléfono</strong></label><input id="recTelefono"></div>
            <div><label><strong>Email</strong></label><input id="recEmail"></div>
            <div>
              <label><strong>Estado recepción</strong></label>
              <select id="recEstadoRecepcion">
                <option value="abierta">abierta</option>
                <option value="en curso">en curso</option>
                <option value="cerrada">cerrada</option>
              </select>
            </div>
          </div>

          <label><strong>Queja del cliente</strong></label>
          <textarea id="recQuejaCliente"></textarea>

          <label><strong>Trabajo solicitado</strong></label>
          <textarea id="recTrabajoSolicitado"></textarea>

          <label><strong>Daños visibles</strong></label>
          <textarea id="recDanosVisibles"></textarea>

          <label><strong>Fotos</strong></label>
          <textarea id="recFotos"></textarea>

          <label><strong>Observaciones</strong></label>
          <textarea id="recObservaciones"></textarea>

          <button type="button" onclick="createReception('${escapeJs(qrId)}')">Crear recepción</button>
        </div>
      `;
    }

    function renderReceptionDetail(qr) {
      document.getElementById("viewModeText").textContent = "Ficha de recepción";
      document.getElementById("tableContainer").classList.add("hidden");
      document.getElementById("showAllBtn").classList.add("hidden");

      document.getElementById("vehicleDetail").innerHTML = `
        <div class="vehicle-card">
          <h2 class="vehicle-title">Recepción ocupada</h2>

          <div class="vehicle-grid">
            <div class="field"><div class="field-label">QR</div><div class="field-value">${escapeHtml(qr["QR_HARRERA"])}</div></div>
            <div class="field"><div class="field-label">Estado QR</div><div class="field-value">${escapeHtml(qr["EGOERA"])}</div></div>
          </div>

          <div class="ficha-box">Este QR está ocupado. La recepción está guardada en la hoja HARRERA.</div>

          ${currentUser && currentUser.role === "profesor" ? `
            <button type="button" class="danger-btn" onclick="closeReceptionQR('${escapeJs(qr["QR_HARRERA"])}')">
              Cerrar recepción y liberar QR
            </button>
          ` : ""}
        </div>
      `;
    }

    function createReception(qrId) {
      if (!currentUser) return;

      const payload = {
        accion: "crearRecepcion",
        qrRecepcion: qrId,
        usuario: currentUser.username,
        rol: currentUser.role,
        taldea: currentUser.taldea,
        matricula: document.getElementById("recMatricula").value.trim(),
        marca: document.getElementById("recMarca").value.trim(),
        modelo: document.getElementById("recModelo").value.trim(),
        km: document.getElementById("recKm").value.trim(),
        cliente: document.getElementById("recCliente").value.trim(),
        telefono: document.getElementById("recTelefono").value.trim(),
        email: document.getElementById("recEmail").value.trim(),
        quejaCliente: document.getElementById("recQuejaCliente").value.trim(),
        trabajoSolicitado: document.getElementById("recTrabajoSolicitado").value.trim(),
        estadoVehiculo: "",
        danosVisibles: document.getElementById("recDanosVisibles").value.trim(),
        fotos: document.getElementById("recFotos").value.trim(),
        observaciones: document.getElementById("recObservaciones").value.trim(),
        estadoRecepcion: document.getElementById("recEstadoRecepcion").value
      };

      if (!payload.matricula || !payload.cliente) {
        showMessage("Rellena al menos matrícula y cliente.", "error");
        return;
      }

      callSaveAPI(payload, function(result) {
        if (!result || !result.ok) {
          showMessage("Error creando recepción:\n" + (result && result.msg ? result.msg : "Error desconocido"), "error");
          return;
        }

        showMessage("Recepción creada correctamente.", "success");
        loadReceptionQR(qrId);
      });
    }

    function closeReceptionQR(qrId) {
      if (!confirm("¿Cerrar esta recepción y liberar el QR?")) return;

      callSaveAPI({
        accion: "cerrarRecepcion",
        qrRecepcion: qrId,
        usuario: currentUser.username,
        rol: currentUser.role
      }, function(result) {
        if (!result || !result.ok) {
          showMessage("Error cerrando recepción:\n" + (result && result.msg ? result.msg : "Error desconocido"), "error");
          return;
        }

        showMessage("Recepción cerrada y QR liberado.", "success");
        loadReceptionQR(qrId);
      });
    }

    async function showWorksPanel() {
      if (!currentUser || currentUser.role !== "profesor") return;

      document.getElementById("viewModeText").textContent = "Panel de trabajos";
      document.getElementById("tableContainer").classList.add("hidden");
      document.getElementById("showAllBtn").classList.remove("hidden");

      document.getElementById("vehicleDetail").innerHTML = `
        <div class="vehicle-card">
          <h2 class="vehicle-title">Nuevo trabajo</h2>

          <div class="form-grid">
            <div>
              <label><strong>Taller</strong></label>
              <select id="workTailerra">
                <option value="MEKANIKA">MEKANIKA</option>
                <option value="KARROZERIA">KARROZERIA</option>
              </select>
            </div>

            <div><label><strong>Cliente</strong></label><input id="workCliente"></div>
            <div><label><strong>Vehículo</strong></label><input id="workAutoa"></div>
            <div><label><strong>Matrícula</strong></label><input id="workMatricula"></div>
            <div><label><strong>Fecha programada</strong></label><input type="date" id="workFecha"></div>
            <div><label><strong>Hora programada</strong></label><input type="time" id="workHora"></div>

            <div>
              <label><strong>Prioridad</strong></label>
              <select id="workPrioridad">
                <option value="normal">normal</option>
                <option value="alta">alta</option>
                <option value="urgente">urgente</option>
              </select>
            </div>
          </div>

          <label><strong>Trabajo a realizar</strong></label>
          <textarea id="workLana"></textarea>

          <button type="button" onclick="createWork()">Crear trabajo</button>
        </div>

        <div class="vehicle-card">
          <h2 class="vehicle-title">Listado ordenado</h2>
          <div id="worksList">Cargando...</div>
        </div>

        <div class="vehicle-card">
          <h2 class="vehicle-title">Tablero por estado</h2>
          <div id="worksKanban">Cargando...</div>
        </div>
      `;

      loadWorks();
    }

    async function loadWorks() {
      try {
        const response = await fetch("https://opensheet.elk.sh/" + SHEET_ID + "/LANAK");
        const rows = await response.json();
        renderWorks(rows);
      } catch (err) {
        document.getElementById("worksList").innerHTML =
          "<div class='msg error'>Error cargando trabajos</div>";
      }
    }

    function getWorkSortValue(r) {
      const programmed = String(r.NOIZKO || "").trim();
      const programmedHour = String(r["N.ORDUA"] || "").trim();

      if (programmed) return programmed + " " + programmedHour;

      return String(r.SORTZE_DATA || r.DATA || "") + " " + String(r.SORTZE_ORDUA || r.ORDUA || "");
    }

    function renderWorks(rows) {
      const validRows = rows.filter(r => String(r.ID_TRABAJO || "").trim() !== "");

      validRows.sort((a, b) => getWorkSortValue(a).localeCompare(getWorkSortValue(b)));

      const activeRows = validRows.filter(r =>
        String(r.EGOERA || "").trim() !== "terminado" &&
        String(r.EGOERA || "").trim() !== "cancelado"
      );

      const mekanika = activeRows.filter(r => String(r.TAILERRA || "").trim() === "MEKANIKA");
      const karrozeria = activeRows.filter(r => String(r.TAILERRA || "").trim() === "KARROZERIA");

      document.getElementById("worksList").innerHTML = `
        <div class="work-columns">
          <div><h3>MEKANIKA</h3>${renderWorkCards(mekanika)}</div>
          <div><h3>KARROZERIA</h3>${renderWorkCards(karrozeria)}</div>
        </div>
      `;

      const pendientes = activeRows.filter(r => String(r.EGOERA || "").trim() === "pendiente");
      const enCurso = activeRows.filter(r => String(r.EGOERA || "").trim() === "en curso");
      const terminados = validRows.filter(r => String(r.EGOERA || "").trim() === "terminado").slice(-10).reverse();

      document.getElementById("worksKanban").innerHTML = `
        <div class="work-columns">
          <div><h3>Pendiente</h3>${renderWorkCards(pendientes)}</div>
          <div><h3>En curso</h3>${renderWorkCards(enCurso)}</div>
        </div>
        <h3>Últimos terminados</h3>
        ${renderWorkCards(terminados)}
      `;
    }

    function renderWorkCards(rows) {
      if (!rows.length) return "<div class='ficha-box'>Sin trabajos</div>";

      return rows.map(r => {
        const prioridad = String(r.LEHENTASUNA || "normal").trim();

        return `
          <div class="work-card priority-${escapeAttr(prioridad)}">
            <strong>${escapeHtml(r.AUTOA || "")}</strong>
            ${r.MATRIKULA ? " · " + escapeHtml(r.MATRIKULA) : ""}
            <br>
            Cliente: ${escapeHtml(r.BEZEROA || "")}
            <br>
            Taller: ${escapeHtml(r.TAILERRA || "")}
            <br>
            Fecha: ${escapeHtml(r.NOIZKO || r.DATA || "")} ${escapeHtml(r["N.ORDUA"] || r.ORDUA || "")}
            <br>
            Prioridad: ${escapeHtml(r.LEHENTASUNA || "")}
            <br><br>
            ${escapeHtml(r.LANA || "")}

            <br><br>

            <select onchange="changeWorkStatus('${escapeJs(r.ID_TRABAJO)}', this.value)">
              <option value="pendiente" ${r.EGOERA === "pendiente" ? "selected" : ""}>pendiente</option>
              <option value="en curso" ${r.EGOERA === "en curso" ? "selected" : ""}>en curso</option>
              <option value="terminado" ${r.EGOERA === "terminado" ? "selected" : ""}>terminado</option>
              <option value="cancelado" ${r.EGOERA === "cancelado" ? "selected" : ""}>cancelado</option>
            </select>
          </div>
        `;
      }).join("");
    }

    function createWork() {
      const payload = {
        accion: "crearTrabajo",
        tailerra: document.getElementById("workTailerra").value,
        cliente: document.getElementById("workCliente").value.trim(),
        autoa: document.getElementById("workAutoa").value.trim(),
        matricula: document.getElementById("workMatricula").value.trim(),
        fecha: document.getElementById("workFecha").value,
        hora: document.getElementById("workHora").value,
        prioridad: document.getElementById("workPrioridad").value,
        lana: document.getElementById("workLana").value.trim(),
        usuario: currentUser.username
      };

      if (!payload.cliente || !payload.lana) {
        showMessage("Falta cliente o trabajo a realizar.", "error");
        return;
      }

      callSaveAPI(payload, function(result) {
        if (!result || !result.ok) {
          showMessage("Error creando trabajo:\n" + (result && result.msg ? result.msg : "Error desconocido"), "error");
          return;
        }

        showMessage("Trabajo creado correctamente.", "success");
        showWorksPanel();
      });
    }

    function changeWorkStatus(idTrabajo, estado) {
      callSaveAPI({
        accion: "cambiarEstadoTrabajo",
        idTrabajo: idTrabajo,
        estado: estado,
        usuario: currentUser.username
      }, function(result) {
        if (!result || !result.ok) {
          showMessage("Error actualizando estado:\n" + (result && result.msg ? result.msg : "Error desconocido"), "error");
          return;
        }

        loadWorks();
      });
    }

    function callSaveAPI(payload, onDone) {
      const callbackName = "handleSaveResponse_" + Date.now();

      window[callbackName] = function(result) {
        try {
          onDone(result);
        } finally {
          const script = document.getElementById(callbackName);
          if (script) script.remove();
          delete window[callbackName];
        }
      };

      const params = new URLSearchParams();
      params.set("callback", callbackName);

      Object.keys(payload).forEach(key => {
        params.set(key, payload[key] ?? "");
      });

      const script = document.createElement("script");
      script.id = callbackName;
      script.src = SAVE_API_URL + "?" + params.toString();

      script.onerror = function() {
        showMessage("Error al conectar con el servicio de guardado.", "error");
        script.remove();
        delete window[callbackName];
      };

      document.body.appendChild(script);
    }

    function renderFichaTecnica(link) {
      if (!link) return "";

      return `
        <div class="ficha-box">
          <strong>Ficha técnica</strong><br><br>
          <a class="button-link" href="${escapeAttr(link)}" target="_blank" rel="noopener">
            <button type="button" class="small-btn">Ver ficha técnica</button>
          </a>
        </div>
      `;
    }

    function renderRTA(link) {
      if (!link) return "";

      return `
        <div class="ficha-box">
          <strong>RTA</strong><br><br>
          <a class="button-link" href="${escapeAttr(link)}" target="_blank" rel="noopener">
            <button type="button" class="small-btn">Ver RTA</button>
          </a>
        </div>
      `;
    }

    document.getElementById("password").addEventListener("keydown", function(e) {
      if (e.key === "Enter") login();
    });
  </script>
</body>
