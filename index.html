<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MENDIcar</title>

<link rel="icon" href="icono-512.png">
<link rel="apple-touch-icon" href="icono-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
}

.hidden{
  display:none !important;
}

.container{
  max-width:1200px;
  margin:20px auto;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.header{
  background:#2563eb;
  color:white;
  padding:24px;
}

.logo{
  display:flex;
  align-items:center;
  gap:18px;
}

.logo img{
  width:72px;
  height:72px;
  border-radius:14px;
  object-fit:cover;
  background:white;
}

.header h1{
  margin:0;
  font-size:34px;
}

.header p{
  margin-top:6px;
  opacity:.95;
}

.content{
  padding:24px;
}

.topbar{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.topbar-left{
  font-size:20px;
  font-weight:bold;
}

.topbar-right{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
}

.primary{
  background:#2563eb;
  color:white;
}

.primary:hover{
  background:#1d4ed8;
}

.secondary{
  background:#6b7280;
  color:white;
}

.secondary:hover{
  background:#4b5563;
}

.success{
  background:#047857;
  color:white;
}

.success:hover{
  background:#065f46;
}

.danger{
  background:#b91c1c;
  color:white;
}

.danger:hover{
  background:#991b1b;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #d1d5db;
  box-sizing:border-box;
  margin-top:6px;
  margin-bottom:14px;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:20px;
  background:#fafafa;
}

.card h2{
  margin-top:0;
}

.msg{
  padding:14px;
  border-radius:12px;
  margin-bottom:18px;
  white-space:pre-wrap;
}

.msg-info{
  background:#eff6ff;
  color:#1d4ed8;
}

.msg-error{
  background:#fef2f2;
  color:#b91c1c;
}

.msg-success{
  background:#ecfdf5;
  color:#047857;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}

th{
  background:#f9fafb;
}

tr:hover{
  background:#eff6ff;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

.badge-open{
  background:#dcfce7;
  color:#166534;
}

.badge-closed{
  background:#fee2e2;
  color:#991b1b;
}

.badge-progress{
  background:#dbeafe;
  color:#1d4ed8;
}

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
    align-items:stretch;
  }

  .topbar-right{
    width:100%;
  }

  .topbar-right button{
    width:100%;
  }

}

</style>
</head>

<body>

<div id="loginView" class="container">

  <div class="header">

    <div class="logo">
      <img src="icono-512.png">

      <div>
        <h1>MENDIcar</h1>
        <p>Gestión digital de automoción</p>
      </div>
    </div>

  </div>

  <div class="content">

    <div class="card">

      <h2>Acceso</h2>

      <input id="username" placeholder="Usuario">

      <input id="password" type="password" placeholder="Contraseña">

      <button class="primary" onclick="login()">
        Entrar
      </button>

      <div id="loginMsg"></div>

    </div>

  </div>

</div>

<div id="appView" class="container hidden">

  <div class="header">

    <div class="logo">

      <img src="icono-512.png">

      <div>
        <h1>MENDIcar</h1>
        <p id="welcomeText"></p>
      </div>

    </div>

  </div>

  <div class="content">

    <div class="topbar">

      <div class="topbar-left">
        Panel de trabajos
      </div>

      <div class="topbar-right">

        <button class="primary" onclick="showCreateWork()">
          Nuevo trabajo
        </button>

        <button class="success" onclick="loadWorks()">
          Actualizar
        </button>

        <button class="secondary" onclick="logout()">
          Cerrar sesión
        </button>

      </div>

    </div>

    <div id="appMsg"></div>

    <div id="createWorkBox" class="card">

      <h2>Nuevo trabajo</h2>

      <div class="grid">

        <div>
          <label>Taller</label>

          <select id="tailerra">
            <option value="MEKANIKA">MEKANIKA</option>
            <option value="KARROZERIA">KARROZERIA</option>
          </select>
        </div>

        <div>
          <label>Cliente</label>
          <input id="bezeroa">
        </div>

        <div>
          <label>Vehículo</label>
          <input id="autoa">
        </div>

        <div>
          <label>Matrícula</label>
          <input id="matrikula">
        </div>

        <div>
          <label>Fecha programada</label>
          <input id="data" type="date">
        </div>

        <div>
          <label>Hora programada</label>
          <input id="ordua" type="time">
        </div>

        <div>
          <label>Prioridad</label>

          <select id="lehentasuna">
            <option value="normal">normal</option>
            <option value="alta">alta</option>
            <option value="urgente">urgente</option>
          </select>
        </div>

      </div>

      <label>Trabajo a realizar</label>

      <textarea id="lana"></textarea>

      <button class="primary" onclick="createWork()">
        Crear trabajo
      </button>

    </div>

    <br>

    <div class="card">

      <h2>Listado de trabajos</h2>

      <div style="overflow:auto;">

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Taller</th>
              <th>Cliente</th>
              <th>Vehículo</th>
              <th>Matrícula</th>
              <th>Trabajo</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Estado</th>
              <th>Prioridad</th>
            </tr>
          </thead>

          <tbody id="worksTable"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script>

const SHEET_ID = "1sf2TS8gCKachrkz66S6E_zQuafVpu7F_AhSLdhi-W-g";

const SAVE_API_URL = "TU_SCRIPT_URL";

let currentUser = null;

function showMessage(id,text,type){

  const el = document.getElementById(id);

  el.innerHTML =
    '<div class="msg msg-'+type+'">'+text+'</div>';
}

function clearMessage(id){
  document.getElementById(id).innerHTML = "";
}

async function login(){

  clearMessage("loginMsg");

  const username =
    document.getElementById("username")
    .value.trim()
    .toLowerCase();

  const password =
    document.getElementById("password")
    .value.trim();

  try{

    const response =
      await fetch(
        "https://opensheet.elk.sh/"
        + SHEET_ID +
        "/ERABILTZAILEAK"
      );

    const users = await response.json();

    const user = users.find(u =>

      String(u.usuario || "")
      .trim()
      .toLowerCase() === username

      &&

      String(u.password || "")
      .trim() === password
    );

    if(!user){

      showMessage(
        "loginMsg",
        "Usuario o contraseña incorrectos",
        "error"
      );

      return;
    }

    currentUser = user;

    document
      .getElementById("loginView")
      .classList.add("hidden");

    document
      .getElementById("appView")
      .classList.remove("hidden");

    document
      .getElementById("welcomeText")
      .textContent =
      "Bienvenido "
      + user.usuario;

    loadWorks();

  }catch(err){

    showMessage(
      "loginMsg",
      err.toString(),
      "error"
    );

  }

}

function logout(){

  currentUser = null;

  document
    .getElementById("appView")
    .classList.add("hidden");

  document
    .getElementById("loginView")
    .classList.remove("hidden");

}

function showCreateWork(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function loadWorks(){

  try{

    const response =
      await fetch(
        "https://opensheet.elk.sh/"
        + SHEET_ID +
        "/LANAK"
      );

    const rows = await response.json();

    rows.sort((a,b)=>{

      const da =
        (a.DATA || "")
        +
        (a.ORDUA || "");

      const db =
        (b.DATA || "")
        +
        (b.ORDUA || "");

      return da.localeCompare(db);

    });

    const tbody =
      document.getElementById("worksTable");

    tbody.innerHTML = rows.map(r=>`

      <tr>

        <td>${r.ID_TRABAJO || ""}</td>

        <td>${r.TAILERRA || ""}</td>

        <td>${r.BEZEROA || ""}</td>

        <td>${r.AUTOA || ""}</td>

        <td>${r.MATRIKULA || ""}</td>

        <td>${r.LANA || ""}</td>

        <td>${r.DATA || ""}</td>

        <td>${r.ORDUA || ""}</td>

        <td>
          ${
            renderEstado(r.EGOERA || "")
          }
        </td>

        <td>${r.LEHENTASUNA || ""}</td>

      </tr>

    `).join("");

  }catch(err){

    showMessage(
      "appMsg",
      err.toString(),
      "error"
    );

  }

}

function renderEstado(v){

  const x = String(v || "").toLowerCase();

  if(x === "itxita"){

    return `
      <span class="badge badge-closed">
        cerrada
      </span>
    `;
  }

  if(x === "martxan"){

    return `
      <span class="badge badge-progress">
        en curso
      </span>
    `;
  }

  return `
    <span class="badge badge-open">
      abierta
    </span>
  `;
}

function createWork(){

  if(!currentUser) return;

  const payload = {

    accion:"crearTrabajo",

    usuario:
      currentUser.usuario || "",

    tailerra:
      document.getElementById("tailerra").value,

    bezeroa:
      document.getElementById("bezeroa").value,

    autoa:
      document.getElementById("autoa").value,

    matrikula:
      document.getElementById("matrikula").value,

    data:
      document.getElementById("data").value,

    ordua:
      document.getElementById("ordua").value,

    lehentasuna:
      document.getElementById("lehentasuna").value,

    lana:
      document.getElementById("lana").value

  };

  if(!payload.bezeroa || !payload.lana){

    showMessage(
      "appMsg",
      "Cliente y trabajo son obligatorios",
      "error"
    );

    return;
  }

  const callback =
    "cb_" + Date.now();

  window[callback] = function(result){

    if(result.ok){

      showMessage(
        "appMsg",
        "Trabajo creado correctamente",
        "success"
      );

      document
        .getElementById("bezeroa")
        .value = "";

      document
        .getElementById("autoa")
        .value = "";

      document
        .getElementById("matrikula")
        .value = "";

      document
        .getElementById("data")
        .value = "";

      document
        .getElementById("ordua")
        .value = "";

      document
        .getElementById("lana")
        .value = "";

      loadWorks();

    }else{

      showMessage(
        "appMsg",
        result.msg || "Error",
        "error"
      );

    }

    delete window[callback];

  };

  const params =
    new URLSearchParams();

  params.set("callback",callback);

  Object.keys(payload).forEach(k=>{
    params.set(k,payload[k]);
  });

  const script =
    document.createElement("script");

  script.src =
    SAVE_API_URL
    + "?"
    + params.toString();

  document.body.appendChild(script);

}

document
.getElementById("password")
.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    login();
  }

});

</script>

</body>
</html>
