  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:linear-gradient(135deg,#eef4ff,#f8fbff);color:#1f2937}.hidden{display:none!important}.box{max-width:1200px;margin:24px auto;background:white;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05);overflow:hidden}.header{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;padding:24px}.header-logo{display:flex;align-items:center;gap:18px}.header-logo img{width:76px;height:76px;border-radius:18px;background:white;padding:6px;object-fit:contain;box-shadow:0 4px 12px rgba(0,0,0,.15)}.header h2{margin:0 0 6px;font-size:34px;font-weight:800;letter-spacing:.5px}.header p{margin:0;opacity:.95}.content{padding:26px}.footer-credit{text-align:center;padding:16px;font-size:13px;color:#6b7280;background:#f9fafb;border-top:1px solid #e5e7eb}.footer-credit strong{color:#2563eb}input,button,textarea,select{width:100%;padding:13px;margin-bottom:12px;border-radius:14px;border:1px solid #d1d5db;font-size:15px;box-sizing:border-box;font-family:inherit;background:white}input:focus,textarea:focus,select:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.12)}textarea{min-height:110px;resize:vertical}button{background:#2563eb;color:white;border:none;cursor:pointer;font-weight:700;transition:.18s}button:hover{background:#1d4ed8;transform:translateY(-1px)}.secondary-btn{background:#6b7280}.secondary-btn:hover{background:#4b5563}.danger-btn{background:#b91c1c}.danger-btn:hover{background:#991b1b}.msg{padding:14px;border-radius:14px;margin-bottom:18px;white-space:pre-wrap;font-weight:600}.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.success{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.danger-banner{background:linear-gradient(135deg,#dc2626,#b91c1c);color:white;padding:16px;border-radius:18px;margin-bottom:16px;font-weight:700;white-space:pre-wrap;box-shadow:0 4px 10px rgba(185,28,28,.25)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}.topbar-actions{display:flex;gap:10px;flex-wrap:wrap}.small-btn{width:auto;min-width:150px;margin-bottom:0}.button-link{text-decoration:none}.vehicle-card{border:1px solid #e5e7eb;border-radius:22px;padding:24px;background:#fafcff;margin-bottom:18px;box-shadow:0 4px 12px rgba(0,0,0,.04)}.vehicle-title{margin:0 0 20px;font-size:30px;color:#111827;font-weight:800}.vehicle-grid,.form-grid,.work-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.03)}.field-label{font-size:11px;color:#6b7280;text-transform:uppercase;margin-bottom:8px;letter-spacing:.8px;font-weight:700}.field-value{font-size:16px;font-weight:700;word-break:break-word}.ficha-box,.edit-box{margin-top:16px;padding:18px;border-radius:18px;background:white;border:1px solid #e5e7eb;white-space:pre-wrap;box-shadow:0 2px 6px rgba(0,0,0,.03)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;background:white;border-radius:18px;overflow:hidden;min-width:850px}th,td{border-bottom:1px solid #e5e7eb;padding:14px;text-align:left;vertical-align:top}th{background:#f9fafb;font-size:13px;text-transform:uppercase;color:#6b7280}tr.clickable-row:hover{background:#eff6ff;cursor:pointer}.save-status{display:inline-block;padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:14px;background:#eff6ff;color:#1d4ed8;font-weight:700}.work-card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;border:1px solid #e5e7eb;box-shadow:0 4px 10px rgba(0,0,0,.05);border-left:8px solid #2563eb}.priority-urgente{border-left-color:#dc2626}.priority-alta{border-left-color:#f59e0b}.priority-normal{border-left-color:#2563eb}.badge{display:inline-block;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-top:8px}.badge-pendiente{background:#dbeafe;color:#1d4ed8}.badge-curso{background:#fef3c7;color:#92400e}.badge-terminado{background:#dcfce7;color:#166534}.badge-cancelado{background:#fee2e2;color:#991b1b}@media(max-width:800px){.vehicle-grid,.form-grid,.work-columns{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:stretch}.topbar-actions{width:100%}.small-btn{width:100%}.header-logo{align-items:flex-start}.header-logo img{width:58px;height:58px}.header h2{font-size:28px}.content{padding:18px}}
  
    .help-floating{position:fixed;right:18px;bottom:18px;z-index:9998;width:auto;min-width:112px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.22);background:#111827}
    .help-floating:hover{background:#030712}
    .tutorial-overlay{position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}
    .tutorial-card{width:min(560px,100%);background:white;border-radius:24px;padding:24px;box-shadow:0 18px 45px rgba(0,0,0,.28);border:1px solid #e5e7eb}
    .tutorial-card h2{margin:0 0 10px;color:#111827;font-size:28px}
    .tutorial-card p{font-size:17px;line-height:1.5;color:#374151;white-space:pre-wrap}
    .tutorial-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .tutorial-actions button{width:auto;min-width:130px;margin-bottom:0}
    .tutorial-secondary{background:#6b7280}
    .tutorial-secondary:hover{background:#4b5563}
    .tutorial-progress{color:#6b7280;font-size:13px;font-weight:700;margin-bottom:8px}
    @media(max-width:700px){.help-floating{right:12px;bottom:12px;min-width:96px;padding:12px 14px}.tutorial-card{padding:20px}.tutorial-card h2{font-size:24px}.tutorial-actions button{width:100%}}

  
    .task-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
    .task-row{border:1px solid #e5e7eb;border-radius:14px;background:white;overflow:hidden}
    .task-summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .task-summary::-webkit-details-marker{display:none}
    .task-title{font-weight:800;color:#111827}
    .task-meta{font-size:13px;color:#6b7280;margin-top:3px}
    .task-body{padding:0 14px 14px}
    .task-check{font-size:20px;font-weight:900;margin-right:8px}

  
    /* ===== MENDIcar v1.9 VISUAL ===== */
    .status-strip{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px}
    .status-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;font-weight:800;font-size:13px;border:1px solid #e5e7eb;background:white;box-shadow:0 4px 12px rgba(15,23,42,.06)}
    .chip-pendiente{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
    .chip-curso{background:#fef3c7;color:#92400e;border-color:#fde68a}
    .chip-terminado{background:#dcfce7;color:#166534;border-color:#bbf7d0}
    .chip-cancelado{background:#fee2e2;color:#991b1b;border-color:#fecaca}
    .chip-ocupado{background:#111827;color:white;border-color:#111827}
    .chip-libre{background:#dcfce7;color:#166534;border-color:#bbf7d0}
    .badge{font-weight:900!important;text-transform:uppercase;letter-spacing:.03em;box-shadow:0 4px 10px rgba(0,0,0,.06)}
    .badge-pendiente{background:#dbeafe!important;color:#1d4ed8!important}
    .badge-curso{background:#fef3c7!important;color:#92400e!important}
    .badge-terminado{background:#dcfce7!important;color:#166534!important}
    .badge-cancelado{background:#fee2e2!important;color:#991b1b!important}
    .priority-normal{border-left:10px solid #2563eb!important}
    .priority-alta{border-left:10px solid #f59e0b!important}
    .priority-urgente{border-left:10px solid #dc2626!important}
    .work-card,.task-row{transition:transform .12s ease,box-shadow .12s ease}
    .work-card:hover,.task-row:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(15,23,42,.12)!important}
    .task-summary{background:linear-gradient(180deg,#ffffff,#f8fafc)}
    .task-row[open] .task-summary{border-bottom:1px solid #e5e7eb}
    .task-title{font-size:17px}
    .blocked-alert{background:#fee2e2;border:2px solid #dc2626;color:#7f1d1d;border-radius:18px;padding:18px;margin:15px 0;font-weight:800;box-shadow:0 8px 22px rgba(220,38,38,.18)}
    .blocked-alert-title{font-size:22px;margin-bottom:8px}
    .save-busy{background:#6b7280!important;cursor:not-allowed!important;opacity:.85}

  
.qr-occupied-banner{
background:#fee2e2;
border:2px solid #dc2626;
padding:16px;
border-radius:16px;
margin-bottom:14px;
box-shadow:0 8px 18px rgba(220,38,38,.15);
}
.qr-occupied-title{font-size:20px;font-weight:900;color:#991b1b}
.qr-occupied-info{margin-top:8px;font-weight:700}


    .occupied-summary-card{
      background:linear-gradient(135deg,#fee2e2,#fff7ed);
      border:2px solid #dc2626;
      border-radius:20px;
      padding:20px;
      margin:18px 0;
      box-shadow:0 10px 26px rgba(220,38,38,.18);
    }
    .occupied-summary-title{
      color:#991b1b;
      font-size:24px;
      font-weight:900;
      margin-bottom:12px;
    }
    .occupied-summary-line{
      font-size:17px;
      line-height:1.55;
      color:#111827;
      font-weight:700;
    }
    .next-qr-box{
      margin-top:16px;
      padding:14px;
      border-radius:16px;
      background:#dcfce7;
      border:1px solid #86efac;
      color:#166534;
      font-weight:900;
      font-size:18px;
    }
    .success-box{
      background:#dcfce7;
      border:1px solid #86efac;
      color:#166534;
      padding:14px;
      border-radius:14px;
      font-weight:800;
      margin:12px 0;
    }

  
    .qr-assigned-big{
      background:linear-gradient(135deg,#dcfce7,#eff6ff);
      border:3px solid #16a34a;
      border-radius:22px;
      padding:22px;
      margin:18px 0;
      box-shadow:0 14px 30px rgba(22,163,74,.20);
      text-align:center;
    }
    .qr-assigned-title{
      font-size:24px;
      font-weight:900;
      color:#166534;
      margin-bottom:10px;
    }
    .qr-assigned-code{
      font-size:34px;
      font-weight:1000;
      color:#111827;
      background:white;
      border-radius:18px;
      padding:16px;
      margin:12px 0;
      border:2px dashed #16a34a;
    }
    .qr-assigned-note{
      font-size:17px;
      font-weight:800;
      color:#374151;
      line-height:1.4;
    }

  
    .checklist-card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 22px rgba(15,23,42,.08)}
    .check-item{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;border:1px solid #e5e7eb;border-radius:14px;background:#f8fafc;font-size:17px;font-weight:750}
    .check-item input{width:24px;height:24px}
    .check-item-done{background:#dcfce7;border-color:#86efac;color:#166534}
    .task-state-select{width:150px;margin-left:auto;padding:8px;border-radius:10px}

  
    /* ===== MENDIcar v3.2 checklist estable ===== */
    .work-reception-card{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:20px;
      margin:14px 0;
      padding:0;
      overflow:hidden;
      box-shadow:0 10px 26px rgba(15,23,42,.08);
      border-left:10px solid #2563eb;
    }
    .work-reception-summary{
      list-style:none;
      cursor:pointer;
      padding:18px;
      background:linear-gradient(180deg,#ffffff,#f8fafc);
    }
    .work-reception-summary::-webkit-details-marker{display:none;}
    .qr-line{
      display:inline-block;
      margin-top:8px;
      padding:8px 12px;
      background:#111827;
      color:white;
      border-radius:999px;
      font-weight:900;
      font-size:14px;
    }
    .pending-line{
      color:#2563eb;
      font-weight:800;
      margin-top:7px;
    }
    .checklist-card{
      background:white;
      border-top:1px solid #e5e7eb;
      padding:16px;
    }
    .check-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      margin:8px 0;
      border:1px solid #e5e7eb;
      border-radius:14px;
      background:#f8fafc;
      font-size:17px;
      font-weight:750;
    }
    .check-item input{
      width:24px;
      height:24px;
      flex-shrink:0;
    }
    .check-item-done{
      background:#dcfce7;
      border-color:#86efac;
      color:#166534;
    }
    .check-item-cancelled{
      background:#fee2e2;
      border-color:#fecaca;
      color:#991b1b;
    }
    .task-state-select{
      width:145px;
      margin-left:auto;
      padding:8px;
      border-radius:10px;
      border:1px solid #d1d5db;
      background:white;
      font-weight:700;
    }
    .check-actions{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:12px;
    }
    @media (min-width: 700px){
      .check-actions{flex-direction:row;}
    }

  
    /* ===== MENDIcar v3.5 calendario mensual ===== */
    .calendar-nav{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      margin:14px 0;
    }
    .calendar-month-title{
      font-size:24px;
      font-weight:900;
      color:#111827;
    }
    .month-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:8px;
      margin-top:14px;
    }
    .day-head{
      font-weight:900;
      text-align:center;
      color:#374151;
      padding:8px 4px;
    }
    .day-cell{
      min-height:88px;
      border:1px solid #e5e7eb;
      border-radius:14px;
      background:white;
      padding:8px;
      cursor:pointer;
      box-shadow:0 4px 10px rgba(15,23,42,.04);
    }
    .day-cell:hover{
      border-color:#2563eb;
      box-shadow:0 8px 18px rgba(37,99,235,.16);
    }
    .day-muted{
      background:#f3f4f6;
      color:#9ca3af;
    }
    .day-number{
      font-weight:900;
      font-size:16px;
    }
    .day-badges{
      display:flex;
      flex-wrap:wrap;
      gap:4px;
      margin-top:8px;
    }
    .day-badge{
      display:inline-block;
      border-radius:999px;
      padding:3px 7px;
      font-size:11px;
      font-weight:900;
    }
    .badge-plan{background:#dbeafe;color:#1d4ed8;}
    .badge-real{background:#dcfce7;color:#166534;}
    .selected-day-panel{
      margin-top:18px;
      padding:16px;
      border-radius:18px;
      background:#f8fafc;
      border:1px solid #e5e7eb;
    }

  
    /* ===== MENDIcar v3.6 loading overlay ===== */
    .loading-overlay{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(3px);
      z-index:99999;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .loading-overlay.hidden{
      display:none!important;
    }
    .loading-box{
      background:white;
      padding:26px;
      border-radius:22px;
      box-shadow:0 14px 40px rgba(15,23,42,.18);
      text-align:center;
      min-width:230px;
      border:1px solid #e5e7eb;
    }
    .spinner{
      width:58px;
      height:58px;
      border:6px solid #dbeafe;
      border-top:6px solid #2563eb;
      border-radius:50%;
      animation:mendiSpin .8s linear infinite;
      margin:0 auto 16px;
    }
    .loading-text{
      font-weight:900;
      font-size:17px;
      color:#111827;
    }
    @keyframes mendiSpin{
      0%{transform:rotate(0deg);}
      100%{transform:rotate(360deg);}
    }

  
    /* ===== MENDIcar v4.4 dashboard limpio fijo ===== */
    #appView .topbar-actions{
      display:none!important;
    }

    .main-dashboard{
      padding:8px 0 12px;
    }

    .dashboard-user{
      text-align:center;
      margin:8px 0 22px;
      color:#111827;
      font-size:18px;
      line-height:1.35;
    }

    .dashboard-user strong{
      color:#2563eb;
    }

    .dashboard-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
    }

    .dashboard-tile{
      min-height:142px;
      border:1px solid #e5e7eb;
      background:white;
      border-radius:24px;
      box-shadow:0 10px 28px rgba(15,23,42,.08);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:10px;
      padding:18px 12px;
      cursor:pointer;
      transition:.15s ease;
      color:#111827;
      text-align:center;
    }

    .dashboard-tile:active{
      transform:scale(.98);
    }

    .dashboard-icon{
      width:70px;
      height:70px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      background:#dbeafe;
    }

    .dashboard-title{
      font-size:21px;
      font-weight:900;
      line-height:1.1;
    }

    .dashboard-subtitle{
      font-size:14px;
      color:#6b7280;
      line-height:1.25;
      max-width:150px;
    }

    .tile-green .dashboard-icon{background:#dcfce7;}
    .tile-purple .dashboard-icon{background:#ede9fe;}
    .tile-orange .dashboard-icon{background:#ffedd5;}
    .tile-gray .dashboard-icon{background:#f1f5f9;}

    .dashboard-logout{
      width:100%;
      margin-top:16px;
      min-height:72px;
      border:1px solid #d1d5db;
      border-radius:20px;
      background:#f8fafc;
      color:#111827;
      font-size:20px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      cursor:pointer;
    }

    .section-back{
      margin-bottom:14px;
      width:100%;
      background:#111827!important;
      color:white!important;
    }

    @media(max-width:430px){
      .dashboard-grid{gap:12px;}
      .dashboard-tile{min-height:128px;border-radius:20px;}
      .dashboard-icon{width:60px;height:60px;font-size:32px;}
      .dashboard-title{font-size:18px;}
      .dashboard-subtitle{font-size:13px;}
    }

  
    /* ===== MENDIcar v4.5 trabajos plegados ===== */
    .work-reception-card{
      scroll-margin-top:18px;
    }
    .work-reception-card:not([open]) .work-reception-summary{
      border-bottom:none;
    }
    .work-head-main{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      width:100%;
    }
    .work-head-left{
      min-width:0;
    }
    .work-head-title{
      font-size:22px;
      font-weight:950;
      color:#111827;
      line-height:1.18;
    }
    .work-head-qr{
      display:inline-block;
      margin-bottom:8px;
      padding:8px 12px;
      background:#111827;
      color:white;
      border-radius:999px;
      font-weight:950;
      font-size:14px;
    }
    .work-head-meta{
      margin-top:4px;
      color:#6b7280;
      font-weight:800;
      line-height:1.35;
    }
    .work-head-open{
      margin-top:10px;
      color:#2563eb;
      font-weight:900;
      font-size:16px;
    }
    .work-reception-card[open] .work-head-open::after{
      content:" abierto";
    }
    .work-reception-card:not([open]) .work-head-open::after{
      content:" tocar para desplegar";
    }

  
    /* ===== MENDIcar v4.7 secciones de trabajos plegadas ===== */
    .work-section{
      border:1px solid #e5e7eb;
      border-radius:22px;
      background:#ffffff;
      box-shadow:0 10px 26px rgba(15,23,42,.08);
      overflow:hidden;
      margin-bottom:18px;
    }
    .work-section-summary{
      list-style:none;
      cursor:pointer;
      padding:20px;
      background:linear-gradient(135deg,#f8fafc,#eff6ff);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .work-section-summary::-webkit-details-marker{
      display:none;
    }
    .work-section-title{
      font-size:26px;
      font-weight:950;
      color:#111827;
      line-height:1.15;
    }
    .work-section-sub{
      margin-top:6px;
      color:#6b7280;
      font-weight:800;
      font-size:15px;
    }
    .work-section-count{
      background:#111827;
      color:#fff;
      border-radius:999px;
      padding:10px 14px;
      font-size:15px;
      font-weight:950;

async function normKeyValue(v){return String(v||'').trim().toLowerCase()}
function getField(r,names){if(!r)return '';for(let i=0;i<names.length;i++){const n=names[i];if(r[n]!==undefined&&r[n]!==null&&String(r[n]).trim()!=='')return String(r[n]).trim()}return ''}

function getLatestByQR(rows, qrId){
  const target=normKeyValue(qrId);
  const filtered=rows.filter(r=>{
    const qrValue=getField(r,['QR_RECEPCION','QR_HARRERA','QR','qrRecepcion','qrHarrera']);
    return normKeyValue(qrValue)===target;
  });
  if(!filtered.length)return null;
  filtered.sort((a,b)=>{
    const av=getField(a,['FECHA','DATA'])+' '+getField(a,['HORA','ORDUA']);
    const bv=getField(b,['FECHA','DATA'])+' '+getField(b,['HORA','ORDUA']);
    return av.localeCompare(bv);
  });
  return filtered[filtered.length-1];
}


function getLatestWorkRowsByRecepcion(rows,idRecepcion,matricula){
  const rec=String(idRecepcion||'').trim();
  const mat=String(matricula||'').trim().toLowerCase();
  let filtered=rows.filter(r=>String(r.ID_TRABAJO||'').trim()!=='' && String(r.ID_RECEPCION||'').trim()===rec);
  if(!filtered.length && mat){
    filtered=rows.filter(r=>String(r.ID_TRABAJO||'').trim()!=='' && String(r.MATRIKULA||'').trim().toLowerCase()===mat);
  }
  filtered.sort((a,b)=>getWorkSortValue(a).localeCompare(getWorkSortValue(b)));
  const latestMap={};
  filtered.forEach(r=>{latestMap[String(r.ID_TRABAJO||'').trim()]=r});
  return Object.values(latestMap).filter(r=>{
    const estado=String(r.EGOERA||'').trim().toLowerCase();
    return estado!=='terminado'&&estado!=='cancelado';
  });
}

function getLatestWorkRowsByMatricula(rows, matricula){
  const filtered = rows.filter(r =>
    String(r.ID_TRABAJO || '').trim() !== '' &&
    String(r.MATRIKULA || '').trim().toLowerCase() === String(matricula || '').trim().toLowerCase()
  );

  filtered.sort((a,b) => getWorkSortValue(a).localeCompare(getWorkSortValue(b)));

  const latestMap = {};
  filtered.forEach(r => {
    latestMap[String(r.ID_TRABAJO || '').trim()] = r;
  });

  return Object.values(latestMap).filter(r => {
    const estado = String(r.EGOERA || '').trim().toLowerCase();
    return estado !== 'terminado' && estado !== 'cancelado';
  });
}

function loadReceptionQR(qrId){
  clearMessage();
  registrarActividadQR('HARRERA', qrId, 'ENTRA_QR', 'Entrada al QR de recepción');

  callSaveAPI({accion:'comprobarQrHarrera', qrRecepcion: qrId}, checkResp => {
    if(checkResp && checkResp.ok && checkResp.ocupado){
      showMessage(
        'Este QR ya está ocupado. No se puede crear otra recepción con el mismo QR.' +
        (checkResp.sugerido ? ' Si necesitas otro QR, coge el ' + checkResp.sugerido + '.' : ''),
        'error'
      );

      renderOccupiedQrSummary(qrId, checkResp.recepcion || {}, checkResp.sugerido || '');

      // Carga trabajos/histórico debajo si existen, pero la tarjeta básica ya queda visible aunque falle la lectura.
      callSaveAPI({accion:'listarLanak'}, lResp => {
        if(lResp && lResp.ok){
          WORK_ROWS_CACHE = lResp.rows || [];
        }
      });

      return;
    }

    callSaveAPI({accion:'listarQrHarrera'}, qrResp => {
      if(!qrResp || !qrResp.ok){
        showMessage('Error cargando QR de recepción.', 'error');
        return;
      }

      const rows = qrResp.rows || [];
      const qr = rows.find(r => String(r.QR_HARRERA || '').trim() === String(qrId).trim());

      if(!qr){
        showMessage('No existe este QR de recepción: ' + qrId, 'error');
        return;
      }

      const estado = String(qr.EGOERA || '').trim().toLowerCase();

      if(estado === 'libre'){
        renderReceptionForm(qrId);
        return;
      }

      callSaveAPI({accion:'listarHarrera'}, hResp => {
        const harreraRows = hResp && hResp.ok ? (hResp.rows || []) : [];
        let harrera = getLatestByQR(harreraRows, qrId);

        callSaveAPI({accion:'listarLanak'}, lResp => {
          const lanakRows = lResp && lResp.ok ? (lResp.rows || []) : [];
          WORK_ROWS_CACHE = lanakRows;
          renderReceptionDetail(qr, harrera, lanakRows);
        });
      });
    });
  });
}

function getReceptionDisplayField(row, names){
  if(!row) return '';

  for(let i = 0; i < names.length; i++){
    const name = names[i];

    if(row[name] !== undefined && row[name] !== null && String(row[name]).trim() !== ''){
      return String(row[name]).trim();
    }
  }

  const normalized = {};
  Object.keys(row).forEach(k => {
    normalized[String(k).trim().toUpperCase()] = row[k];
  });

  for(let i = 0; i < names.length; i++){
    const key = String(names[i]).trim().toUpperCase();

    if(normalized[key] !== undefined && normalized[key] !== null && String(normalized[key]).trim() !== ''){
      return String(normalized[key]).trim();
    }
  }

  return '';
}



function getReceptionWorkshop(row){
  const candidates = [
    row.TIPO_TRABAJO,
    row.TAILERRA,
    row.TALLER,
    row.QUEJA_CLIENTE,
    row.TRABAJO_SOLICITADO
  ];

  for(const value of candidates){
    const s = String(value || '').trim().toUpperCase();

    if(s === 'MEKANIKA' || s === 'MECANICA' || s === 'MECÁNICA'){
      return 'MEKANIKA';
    }

    if(s === 'KARROZERIA' || s === 'CARROCERIA' || s === 'CARROCERÍA'){
      return 'KARROZERIA';
    }
  }

  return 'SIN_TALLER';
}


function parseTrabajosJsonFront(row){
  const raw = getReceptionDisplayField(row, ['TRABAJOS_JSON','trabajos_json']);
  const trabajoSolicitado = getReceptionDisplayField(row, ['TRABAJO_SOLICITADO','Trabajo solicitado','LANA']);
  try{
    const parsed = JSON.parse(raw || '[]');
    if(Array.isArray(parsed) && parsed.length) return parsed;
  }catch(e){}
  return String(trabajoSolicitado || '').split(',').map(x=>x.trim()).filter(Boolean).map((texto,i)=>({id:'T'+(i+1),texto:texto,estado:'pendiente',obs:'',evidencias:[]}));
}

    trabajoSolicitado:document.getElementById('recTrabajoSolicitado').value.trim(),
    estadoVehiculo:'',
    danosVisibles:document.getElementById('recDanosVisibles').value.trim(),
    fotos:'',
    observaciones:document.getElementById('recObservaciones').value.trim(),
    estadoRecepcion:document.getElementById('recEstadoRecepcion').value
  };

  if(!payload.matricula||!payload.cliente){
    showMessage('Rellena al menos matrícula y cliente.','error');
    return;
  }

  SAVE_LOCKS['crearRecepcion']=true;

  const btn = document.getElementById('btnCrearRecepcion');
  if(btn){
    btn.disabled = true;
    btn.dataset.oldText = btn.textContent;
    btn.textContent = 'Guardando...';
    btn.classList.add('save-busy');
  }

  showMessage('Guardando recepción. No cierres la aplicación ni pulses varias veces.', 'success');

  callSaveAPI(payload,r=>{
    SAVE_LOCKS['crearRecepcion']=false;

    if(btn){
      btn.disabled = false;
      btn.textContent = btn.dataset.oldText || 'Crear recepción';
      btn.classList.remove('save-busy');
    }

    if(!r||!r.ok){
      showMessage('Error creando recepción:\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');
      return;
    }

    showMessage('Recepción creada correctamente. Guardado con éxito.', 'success');
    document.getElementById('vehicleDetail').insertAdjacentHTML('afterbegin', '<div class="success-box">✅ Recepción guardada con éxito</div>');

    setTimeout(()=>loadReceptionQR(qrId),800);
  });
}

function getPlannedTime(row){

function getCalendarStatus(row){
  const trabajos = parseTrabajosJsonFront(row);
  if(!trabajos.length) return 'sin trabajos';

  const pendientes = trabajos.filter(t=>{
    const e = String(t.estado || '').toLowerCase();
    return e !== 'terminado' && e !== 'cancelado';
  }).length;

  if(pendientes === 0) return 'cerrado';

  if(trabajos.some(t=>String(t.estado || '').toLowerCase()==='en curso')) return 'en curso';

  return 'pendiente';
}

      const estado = String(getAnyField(r,['ESTADO_RECEPCION','ESTADO RECEPCION']) || 'abierta').toLowerCase();
      return estado !== 'cerrada' && estado !== 'cerrado';
    });

function dateDiffDays(a,b){
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((da - db) / 86400000);
}

function renderCalendar(rows, mode, base){
  const filtered = rows.filter(r=>{
    const fecha = getPlannedDate(r);
    if(mode === 'all') return true;
    if(!fecha) return mode === 'all';

    const diff = dateDiffDays(fecha, base);
    if(mode === 'today') return diff === 0;
    if(mode === 'week') return diff >= 0 && diff <= 6;
    return true;
  }).sort((a,b)=>{
    const av = (getPlannedDate(a)||'9999-99-99') + ' ' + (getPlannedTime(a)||'99:99');
    const bv = (getPlannedDate(b)||'9999-99-99') + ' ' + (getPlannedTime(b)||'99:99');
    return av.localeCompare(bv);
  });

  if(!filtered.length){
    document.getElementById('calendarList').innerHTML = "<div class='ficha-box'>No hay trabajos planificados en esta vista.</div>";
    return;
  }

  const grouped = {};
  filtered.forEach(r=>{
    const fecha = getPlannedDate(r) || 'Sin fecha';
    if(!grouped[fecha]) grouped[fecha] = [];
    grouped[fecha].push(r);
  });

  document.getElementById('calendarList').innerHTML = Object.keys(grouped).map(fecha=>{
    return `
      <h3 style="margin-top:18px;font-size:22px;">${escapeHtml(fecha)}</h3>
      ${grouped[fecha].map(r=>{
        const hora = getPlannedTime(r) || '-';

        const marca = getAnyField(r,['MARCA']);
        const modelo = getAnyField(r,['MODELO']);
        const matricula = getAnyField(r,['MATRICULA','MATRIKULA']);
        const cliente = getAnyField(r,['CLIENTE','BEZEROA']);
        const taller = getReceptionWorkshop(r);
        const trabajos = parseTrabajosJsonFront(r);
        const estado = getCalendarStatus(r);
        const tareas = trabajos.map(t=>`${t.estado==='terminado'?'☑':'☐'} ${escapeHtml(t.texto||'')}`).join('<br>');

        return `
          <div class="work-reception-card" style="border-left-color:${estado==='en curso'?'#f59e0b':estado==='cerrado'?'#16a34a':'#2563eb'};">
            <div class="work-reception-summary">
              <strong style="font-size:20px;">${escapeHtml(hora)} · ${escapeHtml((marca+' '+modelo).trim() || 'Vehículo')}</strong>
              ${matricula ? `<span style="color:#6b7280;"> · ${escapeHtml(matricula)}</span>` : ''}
              <br>

              <div style="margin-top:10px;line-height:1.5;">${tareas}</div>

}

// MENDICAR_V3_2_FRONT_HELPERS

function normalizeHeaderName(name){
  return String(name || '')
    .trim()
    .toUpperCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,'_');
}

function getAnyField(row, names){
  if(!row) return '';

  for(const n of names){
    if(row[n] !== undefined && row[n] !== null && String(row[n]).trim() !== ''){
      return String(row[n]).trim();
    }
  }

  const normalized = {};
  Object.keys(row || {}).forEach(k => {
    normalized[normalizeHeaderName(k)] = row[k];
  });

  for(const n of names){
    const key = normalizeHeaderName(n);
    if(normalized[key] !== undefined && normalized[key] !== null && String(normalized[key]).trim() !== ''){
      return String(normalized[key]).trim();
    }
  }

  return '';
}

function parseTrabajosJsonFront(row){
  // 1) Lectura principal desde TRABAJOS_JSON
  let raw = getAnyField(row, ['TRABAJOS_JSON','TRABAJOS JSON','trabajos_json']);

  // 2) Si por cualquier desplazamiento de columna viene en una clave rara,
  // buscamos en todos los valores de la fila un texto que parezca JSON de trabajos.
  if(!raw){
    for(const k of Object.keys(row || {})){
      const v = String(row[k] || '').trim();
      if(v.startsWith('[{') && v.includes('"texto"')){
        raw = v;
        break;
      }
    }
  }

  try{
    const parsed = JSON.parse(raw || '[]');
    if(Array.isArray(parsed) && parsed.length){
      return parsed.map((t,i)=>({
        id: t.id || ('T'+(i+1)),
        texto: t.texto || t.lana || t.trabajo || '',
        estado: t.estado || 'pendiente',
        obs: t.obs || '',
        evidencias: Array.isArray(t.evidencias) ? t.evidencias : []
      })).filter(t => String(t.texto || '').trim() !== '');
    }
  }catch(e){}

  // 3) Fallback: reconstruir desde TRABAJO_SOLICITADO
  const trabajoSolicitado = getAnyField(row, ['TRABAJO_SOLICITADO','TRABAJO SOLICITADO','LANA','QUEJA_CLIENTE']);
  return String(trabajoSolicitado || '')
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean)
    .map((texto,i)=>({
      id:'T'+(i+1),
      texto:texto,
      estado:'pendiente',
      obs:'',
      evidencias:[]
    }));
}

function getReceptionWorkshop(row){
  const candidates = [
    getAnyField(row, ['TIPO_TRABAJO','TIPO TRABAJO']),
    getAnyField(row, ['TAILERRA','TALLER']),
    getAnyField(row, ['QUEJA_CLIENTE','QUEJA CLIENTE'])
  ];

  for(const value of candidates){
    const s = String(value || '').trim().toUpperCase();
    if(s === 'MEKANIKA' || s === 'MECANICA' || s === 'MECÁNICA') return 'MEKANIKA';
    if(s === 'KARROZERIA' || s === 'CARROCERIA' || s === 'CARROCERÍA') return 'KARROZERIA';
  }

  return 'SIN_TALLER';
}

  return (window.RECEPCIONES_CACHE || []).find(r =>

function toggleChecklistItem(idRecepcion, idTarea, checked){
  const r = getRecepcionById(idRecepcion);
  if(!r) return;

  const trabajos = parseTrabajosJsonFront(r);
  const t = trabajos.find(x => String(x.id) === String(idTarea));
  if(!t) return;

  t.estado = checked ? 'terminado' : 'pendiente';
  r.TRABAJOS_JSON = JSON.stringify(trabajos);

  const sel = document.getElementById('estado_' + idRecepcion + '_' + idTarea);
  if(sel) sel.value = t.estado;
}

function selectChecklistState(idRecepcion, idTarea, estado){
  const r = getRecepcionById(idRecepcion);
  if(!r) return;

  const trabajos = parseTrabajosJsonFront(r);
  const t = trabajos.find(x => String(x.id) === String(idTarea));
  if(!t) return;

  t.estado = estado;
  r.TRABAJOS_JSON = JSON.stringify(trabajos);

  document
    .querySelectorAll('input[data-idrecepcion="'+idRecepcion+'"][data-idtarea="'+idTarea+'"]')
    .forEach(ch => { ch.checked = estado === 'terminado'; });
}

function guardarChecklistRecepcion(idRecepcion){
  if(SAVE_LOCKS['checklist_'+idRecepcion]){
    showMessage('Ya se está guardando este checklist. Espera unos segundos.', 'error');
    return;
  }

  const r = getRecepcionById(idRecepcion);
  if(!r){
    showMessage('No se ha encontrado la recepción.', 'error');
    return;
  }

  const trabajos = parseTrabajosJsonFront(r);
  const obsEl = document.getElementById('obsChecklist_' + idRecepcion);
  const obs = obsEl ? obsEl.value : '';

  SAVE_LOCKS['checklist_'+idRecepcion] = true;
  const tareasCerradas = trabajos.filter(t=>String(t.estado||'').toLowerCase()==='terminado').map(t=>t.texto).join(', ');
  const tareasCanceladas = trabajos.filter(t=>String(t.estado||'').toLowerCase()==='cancelado').map(t=>t.texto).join(', ');
  const qrLog = getAnyField(r,['QR_RECEPCION','QR RECEPCION']);
  if(tareasCerradas) registrarActividadQR('HARRERA', qrLog, 'TERMINA_TAREA', tareasCerradas);
  if(tareasCanceladas) registrarActividadQR('HARRERA', qrLog, 'CANCELA_TAREA', tareasCanceladas);
  registrarActividadQR('HARRERA', qrLog, 'GUARDA_CHECKLIST', obs || 'Checklist actualizado');
  showLoading('Guardando checklist...');
  showMessage('Guardando checklist...', 'success');

  callSaveAPI({
    accion:'actualizarTrabajosRecepcion',
    idRecepcion:idRecepcion,
    trabajosJson:JSON.stringify(trabajos),
    usuario:currentUser ? currentUser.username : '',
    oharrak:obs
  }, resp => {
    SAVE_LOCKS['checklist_'+idRecepcion] = false;

    hideLoading();
    if(!resp || !resp.ok){
      showMessage('Error guardando checklist: ' + (resp && resp.msg ? resp.msg : 'Error desconocido'), 'error');
      return;
    }

    hideLoading();
    showMessage(resp.msg || 'Checklist guardado correctamente.', 'success');
    registrarUsoApp('GUARDAR_CHECKLIST','Checklist actualizado',idRecepcion,getAnyField(r,['QR_RECEPCION','QR RECEPCION']),getAnyField(r,['MATRICULA','MATRIKULA']));

    setTimeout(()=>{
      const entry = getEntryParams();
      if(entry.qrHarrera){
        loadReceptionQR(entry.qrHarrera);
      }else{
        showWorksPanel();
      }
    },700);
  });
}

  callSaveAPI({accion:'listarHarrera'}, hResp=>{
    if(!hResp || !hResp.ok){
      document.getElementById('worksList').innerHTML="<div class='msg error'>Error cargando recepciones</div>";
      hideLoading();
      return;
    }

    const rows = hResp.rows || [];

    window.RECEPCIONES_CACHE = rows.filter(r=>{
      const estadoRecepcion = String(getAnyField(r, ['ESTADO_RECEPCION','ESTADO RECEPCION']) || 'abierta').trim().toLowerCase();
      const idRecepcion = getAnyField(r, ['ID_RECEPCION','ID RECEPCION']);
      const qr = getAnyField(r, ['QR_RECEPCION','QR RECEPCION']);
      const trabajos = parseTrabajosJsonFront(r);

      if(!idRecepcion && !qr) return false;
      if(estadoRecepcion === 'cerrada' || estadoRecepcion === 'cerrado') return false;

      // Activa si tiene tareas pendientes/en curso o si no hay JSON todavía pero hay trabajo solicitado
      if(!trabajos.length) return true;

      return !trabajos.every(t=>{
        const e = String(t.estado || '').toLowerCase();
        return e === 'terminado' || e === 'cancelado';
      });
    });

    renderWorks(window.RECEPCIONES_CACHE);
      hideLoading();
  });
}

function getWorkSortValue(r){
  const programmedDate = String(r.NOIZKO || '').trim();
  const programmedHour = String(r['N.ORDUA'] || '').trim();

  if(programmedDate){
    return programmedDate + ' ' + programmedHour;
  }

  return String(r.SORTZE_DATA || r.DATA || '') + ' ' + String(r.SORTZE_ORDUA || r.ORDUA || '');
}

function getPriorityValue(r){
  const p = String(r.LEHENTASUNA || 'normal').trim().toLowerCase();
  if(p === 'urgente') return 0;
  if(p === 'alta') return 1;
  return 2;
}

function getProgressValue(r){return String(r.AURRERAPENA||r.PROGRESO||r.OHARRAK||r.OBSERVACIONES||'').trim()}
function renderWorks(rows){

function showWorkHistory(){
  const input = document.getElementById('historyMatricula');
  const result = document.getElementById('historyResult');

  if(!input || !result) return;

  const matricula = String(input.value || '').trim().toLowerCase();

  if(!matricula){
    result.innerHTML = "<div class='msg error'>Introduce una matrícula.</div>";
    return;
  }

  const rows = WORK_ROWS_CACHE.filter(r =>
    String(r.MATRIKULA || '').trim().toLowerCase() === matricula
  );

  rows.sort((a,b) => getWorkSortValue(a).localeCompare(getWorkSortValue(b)));

  if(!rows.length){
    result.innerHTML = "<div class='ficha-box'>No hay histórico para esa matrícula.</div>";
    return;
  }

  result.innerHTML = rows.map(r => {
    const estado = String(r.EGOERA || '').trim();
    const prioridad = String(r.LEHENTASUNA || 'normal').trim();
    const qrAsignado = String(r.QR_RECEPCION || r.QR_HARRERA || r.QR || '').trim();
    const badgeClass = estado === 'en curso' ? 'badge-curso' :
                       estado === 'terminado' ? 'badge-terminado' :

function createWork(){
  if(SAVE_LOCKS['crearTrabajo']){
    showMessage('Ya se está creando el trabajo. Espera unos segundos.', 'error');
    return;
  }

  const payload={
    accion:'crearTrabajo',
    tailerra:document.getElementById('workTailerra').value,
    cliente:document.getElementById('workCliente').value.trim(),
    autoa:document.getElementById('workAutoa').value.trim(),
    matricula:document.getElementById('workMatricula').value.trim(),
    fecha:document.getElementById('workFecha').value,
    hora:document.getElementById('workHora').value,
    prioridad:document.getElementById('workPrioridad').value,
    lana:document.getElementById('workLana').value.trim(),
    usuario:currentUser.username,
    rol:currentUser.role,
    taldea:currentUser.taldea || ''
  };

  if(!payload.cliente||!payload.lana){
    showMessage('Falta cliente o trabajo a realizar.','error');
    return;
  }

  SAVE_LOCKS['crearTrabajo']=true;
  const btn=document.getElementById('btnCrearTrabajo');
  if(btn){
    btn.disabled=true;
    btn.dataset.oldText=btn.textContent;
    btn.textContent='Guardando...';
    btn.classList.add('save-busy');
  }

  const resultBox=document.getElementById('workCreateResult');
  if(resultBox) resultBox.innerHTML='<div class="success-box">Guardando trabajo y buscando QR libre...</div>';

  callSaveAPI(payload,r=>{
    SAVE_LOCKS['crearTrabajo']=false;

    if(btn){
      btn.disabled=false;
      btn.textContent=btn.dataset.oldText || 'Crear trabajo y asignar QR libre';
      btn.classList.remove('save-busy');
    }

    if(!r||!r.ok){
      showMessage('Error creando trabajo:\\n'+(r&&r.msg?r.msg:'Error desconocido'),'error');
      if(resultBox) resultBox.innerHTML='';
      return;
    }

    const qrAsignado = r.qrAsignado || r.qr || '';
    const idRecepcion = r.idRecepcion || '';

    hideLoading();
    showMessage('Trabajo creado correctamente. QR asignado automáticamente: '+qrAsignado,'success');
    registrarUsoApp('CREAR_ORDEN','Orden creada desde Trabajos',idRecepcion,qrAsignado,payload.matricula);

    if(resultBox){
      resultBox.innerHTML = `
        <div class="qr-assigned-big">
          <div class="qr-assigned-title">✅ ORDEN CREADA</div>
          <div class="qr-assigned-note">QR asignado automáticamente:</div>
          <div class="qr-assigned-code">${escapeHtml(qrAsignado)}</div>
          <div class="qr-assigned-note">
            Coge físicamente el cartel ${escapeHtml(qrAsignado)} y colócalo en el coche.<br>
            ID recepción: ${escapeHtml(idRecepcion)}
          </div>
          <button type="button" onclick="loadReceptionQR('${escapeJs(qrAsignado)}')">Abrir orden del ${escapeHtml(qrAsignado)}</button>
        </div>
      `;
    }

    setTimeout(()=>loadWorks(),700);
  });
}

function saveWorkStatus(idTrabajo){
  const selectEstado = document.getElementById('estado_' + idTrabajo);
  const selectPrioridad = document.getElementById('prioridad_' + idTrabajo);
  const progresoInput = document.getElementById('progreso_' + idTrabajo);

  if(!selectEstado){
    showMessage('No se ha encontrado el selector de estado.','error');
    return;
  }

  const botonActivo = document.activeElement;
  if(botonActivo && botonActivo.tagName === 'BUTTON'){
    botonActivo.disabled = true;
    botonActivo.textContent = 'Guardando...';
  }

  callSaveAPI({
    accion:'cambiarEstadoTrabajo',
    idTrabajo:idTrabajo,
    estado:selectEstado.value,
    prioridad:selectPrioridad ? selectPrioridad.value : '',
    progreso:progresoInput ? progresoInput.value.trim() : '',
    usuario:currentUser.username
  }, r => {
    if(botonActivo && botonActivo.tagName === 'BUTTON'){
      botonActivo.disabled = false;
      botonActivo.textContent = 'Guardar cambios';
    }

    if(!r || !r.ok){
      showMessage('Error actualizando trabajo:\n' + (r && r.msg ? r.msg : 'Error desconocido'), 'error');
      return;
    }

    showMessage(r.msg || 'Trabajo guardado correctamente.', 'success');

    const entry = getEntryParams();

    setTimeout(() => {
      if(entry.qrHarrera){
        loadReceptionQR(entry.qrHarrera);
      }else{
        loadWorks();
      }
    }, 500);
  });
}

function changeCalendarMonth(delta){
  CALENDAR_MONTH_DATE = new Date(CALENDAR_MONTH_DATE.getFullYear(), CALENDAR_MONTH_DATE.getMonth() + delta, 1);
  loadCalendarMonth();
}

function loadCalendarMonth(){
  callSaveAPI({accion:'listarHarrera'}, hResp=>{
    const hRows = hResp && hResp.ok ? (hResp.rows || []) : [];

    callSaveAPI({accion:'listarRegistro'}, regResp=>{
      const rRows = regResp && regResp.ok ? (regResp.rows || []) : [];
      window.CALENDAR_HARRERA_CACHE = hRows;
      window.CALENDAR_REGISTRO_CACHE = rRows;
      renderMonthCalendar(hRows, rRows);
    });
  });
}

function ymd(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,'0');
  const d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function parseDateLike(v){
  const s=String(v||'').trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if(/^\d{2}\/\d{2}\/\d{4}/.test(s)){
    const [d,m,y]=s.split(/[\/ ]/);
    return `${y}-${m}-${d}`;
  }
  return s.slice(0,10);
}

function getReceptionDate(row){
  return parseDateLike(getAnyField(row, ['NOIZKO','FECHA_PROGRAMADA','FECHA','DATA']));
}

function getRegistroDate(row){
  return parseDateLike(getAnyField(row, ['FECHA','DATA','data']));
}

function renderMonthCalendar(hRows, rRows){
  const year = CALENDAR_MONTH_DATE.getFullYear();
  const month = CALENDAR_MONTH_DATE.getMonth();

  const first = new Date(year, month, 1);
  const start = new Date(first);
  const day = (first.getDay() + 6) % 7; // lunes=0
  start.setDate(first.getDate() - day);

  const monthName = first.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
  document.getElementById('calendarMonthTitle').textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);

  const heads = ['L','M','X','J','V','S','D'];
  let html = `<div class="month-grid">${heads.map(h=>`<div class="day-head">${h}</div>`).join('')}`;

  for(let i=0;i<42;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    const dateStr = ymd(d);
    const inMonth = d.getMonth() === month;

    const planned = (hRows||[]).filter(r => getReceptionDate(r) === dateStr);
    const real = (rRows||[]).filter(r => getRegistroDate(r) === dateStr);

    html += `
      <div class="day-cell ${inMonth?'':'day-muted'}" onclick="showCalendarDay('${dateStr}')">
        <div class="day-number">${d.getDate()}</div>
        <div class="day-badges">
          ${planned.length ? `<span class="day-badge badge-plan">${planned.length} plan.</span>` : ''}
          ${real.length ? `<span class="day-badge badge-real">${real.length} reg.</span>` : ''}
        </div>
      </div>
    `;
  }

  html += '</div>';
  document.getElementById('calendarMonthGrid').innerHTML = html;
}

function showCalendarDay(dateStr){
  const hRows = window.CALENDAR_HARRERA_CACHE || [];
  const rRows = window.CALENDAR_REGISTRO_CACHE || [];

  const planned = hRows.filter(r => getReceptionDate(r) === dateStr);
  const real = rRows.filter(r => getRegistroDate(r) === dateStr);

  document.getElementById('calendarDayDetail').innerHTML = `
    <h3>${escapeHtml(dateStr)}</h3>

    <h4>Programadas / Planifikatuak</h4>
    ${planned.length ? planned.map(renderCalendarReceptionItem).join('') : "<div class='ficha-box'>No hay tareas programadas.</div>"}

    <h4 style="margin-top:18px;">Registros del día / Eguneko erregistroak</h4>
    ${real.length ? real.slice().reverse().map(renderCalendarRegistroItem).join('') : "<div class='ficha-box'>No hay registros ese día.</div>"}
  `;
}

// ===== MENDIcar v3.6 Historial sin duplicidades =====
function getHistoryDateTimeValue(r){
  const fecha = getAnyField(r,['FECHA','DATA','data']);
  const hora = getAnyField(r,['HORA','ORDUA','hora']);
  return String(fecha || '') + ' ' + String(hora || '');
}

function getHistoryKey(r){
  const qr = getAnyField(r,['QR','QR_RECEPCION','ID']);
  return String(qr || '').trim() || ('SIN_QR_' + getHistoryDateTimeValue(r));
}

function obtenerUltimoRegistroPorQR(rows){
  const mapa = {};

  (rows || []).forEach(r=>{
    const key = getHistoryKey(r);
    const dt = getHistoryDateTimeValue(r);

    if(!mapa[key] || dt >= mapa[key]._fechaHora){
      r._fechaHora = dt;
      mapa[key] = r;
    }
  });

  return Object.values(mapa);
}

// Override renderQrHistoryFromCache: by default shows only latest record per QR/car.
function renderQrHistoryFromCache(){
  const q = String(document.getElementById('histQrSearch')?.value || '').trim().toUpperCase();
  const action = String(document.getElementById('histActionFilter')?.value || '').trim().toUpperCase();
  const latestOnly = document.getElementById('histLatestOnly') ? document.getElementById('histLatestOnly').checked : true;

  let rows = (window.REGISTRO_CACHE || []).filter(r=>{
    const qr = String(getAnyField(r,['QR','ID','QR_RECEPCION']) || '').toUpperCase();
    const qrName = String(getQrDisplayName(qr) || '').toUpperCase();
    const acc = String(getAnyField(r,['ACCION','CAMBIO','LANA']) || '').toUpperCase();
    const detail = String(getAnyField(r,['DETALLE','OHARRAK','DESCRIPCION','test']) || '').toUpperCase();

    if(q && !(qr.includes(q) || qrName.includes(q) || detail.includes(q))) return false;
    if(action && acc !== action) return false;
    return qr || acc || detail;
  });

  if(latestOnly){
    rows = obtenerUltimoRegistroPorQR(rows);
  }

  rows = rows.slice().sort((a,b)=>getHistoryDateTimeValue(b).localeCompare(getHistoryDateTimeValue(a))).slice(0,150);

  if(!rows.length){
    document.getElementById('qrHistoryList').innerHTML = "<div class='ficha-box'>No hay registros con ese filtro.</div>";
    return;
  }

  document.getElementById('qrHistoryList').innerHTML = rows.map(r=>{
    const fecha = getAnyField(r,['FECHA','DATA','data']);
    const hora = getAnyField(r,['HORA','ORDUA','hora']);
    const usuario = getAnyField(r,['USUARIO','ERABILTZAILEA','usuario']);
    const rol = getAnyField(r,['ROL','rol']);
    const taldea = getAnyField(r,['TALDEA','taldea']);
    const tipoQr = getAnyField(r,['TIPO_QR','TIPO QR']);
    const qr = getAnyField(r,['QR','ID','QR_RECEPCION']);
    const accion = getAnyField(r,['ACCION','CAMBIO','LANA']);
    const detalle = getAnyField(r,['DETALLE','OHARRAK','DESCRIPCION','test']);
    const displayName = getQrDisplayName(qr);

    return `
      <div class="work-reception-card" style="border-left-color:#111827;">
        <div class="work-reception-summary">
          <strong>${escapeHtml(fecha || '-')} ${escapeHtml(hora || '')}</strong>
          <br>
          <span class="qr-line">${escapeHtml(displayName || qr || '-')}</span>
          ${displayName && displayName !== qr ? `<br><span style="font-weight:800;color:#6b7280;">${escapeHtml(qr || '')}</span>` : ''}
          <br>
          <strong>${escapeHtml(accion || '-')}</strong>
          <div style="margin-top:8px;color:#374151;">${escapeHtml(detalle || '')}</div>
          <div style="margin-top:8px;color:#6b7280;font-weight:800;">
            ${escapeHtml(usuario || '-')} · ${escapeHtml(rol || '-')} ${taldea ? '· '+escapeHtml(taldea) : ''} ${tipoQr ? '· '+escapeHtml(tipoQr) : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function normalizeSearchText(v){
  return String(v || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function rowTextForSearch(row){
  return normalizeSearchText(Object.values(row || {}).join(' '));
}

function buildAutoakSearchMap(autoakRows){
  const items = [];
  (autoakRows || []).forEach(v=>{
    const id = getAnyField(v,['ID','Id','id']);
    const autoa = getAnyField(v,['Autoa','AUTOA','autoa','Vehículo','VEHICULO']);
    const color = getAnyField(v,['Kolorea','KOLOREA','Color']);
    const vin = getAnyField(v,['VIN','vin']);
    const qr = id ? 'ID-' + id : '';
    const label = [id ? 'ID-'+id : '', autoa, color].filter(Boolean).join(' · ');
    const text = normalizeSearchText([id, qr, autoa, color, vin, rowTextForSearch(v)].join(' '));
    if(label) items.push({tipo:'AUTOAK', id:id, qr:qr, label:label, text:text, row:v});
  });
  return items;
}

function buildHarreraSearchMap(harreraRows){
  const items = [];
  (harreraRows || []).forEach(r=>{
    const qr = getAnyField(r,['QR_RECEPCION','QR RECEPCION']);
    const marca = getAnyField(r,['MARCA']);
    const modelo = getAnyField(r,['MODELO']);
    const matricula = getAnyField(r,['MATRICULA','MATRIKULA']);
    const cliente = getAnyField(r,['CLIENTE','BEZEROA']);
    const idRecepcion = getAnyField(r,['ID_RECEPCION','ID RECEPCION']);
    const label = [marca, modelo, matricula ? '· '+matricula : '', qr ? '· '+qr : ''].filter(Boolean).join(' ');
    const text = normalizeSearchText([qr, marca, modelo, matricula, cliente, idRecepcion, rowTextForSearch(r)].join(' '));
    if(qr || matricula || marca || modelo) items.push({tipo:'HARRERA', id:idRecepcion, qr:qr, label:label || qr || matricula, text:text, row:r});
  });
  return items;
}

function buscarHistorialGeneral(){
  const query = normalizeSearchText(document.getElementById('histGeneralSearch')?.value || '');
  if(!query){
    showMessage('Introduce matrícula, QR, ID o modelo para buscar.', 'error');
    return;
  }

  showLoading('Buscando historial...');

  callSaveAPI({accion:'listarAutoak'}, aResp=>{
    const autoakRows = aResp && aResp.ok ? (aResp.rows || []) : [];
    callSaveAPI({accion:'listarHarrera'}, hResp=>{
      const harreraRows = hResp && hResp.ok ? (hResp.rows || []) : [];
      callSaveAPI({accion:'listarRegistro'}, rResp=>{
        const registroRows = rResp && rResp.ok ? (rResp.rows || []) : [];
        callSaveAPI({accion:'listarLanak'}, lResp=>{
          const lanakRows = lResp && lResp.ok ? (lResp.rows || []) : [];
          const autoItems = buildAutoakSearchMap(autoakRows).filter(x=>x.text.includes(query));
          const harreraItems = buildHarreraSearchMap(harreraRows).filter(x=>x.text.includes(query));

          window.HIST_GENERAL_CONTEXT = {query, autoItems, harreraItems, registroRows, lanakRows};
          renderGeneralHistoryResults();
          hideLoading();
        });
      });
    });
  });
}

function getHistoryKeysFromMatches(ctx){
  const keys = [];
  (ctx.autoItems || []).forEach(x=>{
    if(x.qr) keys.push(x.qr);
    if(x.id) keys.push(String(x.id));
    if(x.id) keys.push('ID-' + String(x.id));
    if(x.label) keys.push(x.label);
  });
  (ctx.harreraItems || []).forEach(x=>{
    if(x.qr) keys.push(x.qr);
    if(x.id) keys.push(x.id);
    const mat = getAnyField(x.row,['MATRICULA','MATRIKULA']);
    if(mat) keys.push(mat);
  });
  return [...new Set(keys.filter(Boolean))];
}

function historyRowMatchesKeys(row, keys, query){
  const text = normalizeSearchText(rowTextForSearch(row));
  if(query && text.includes(query)) return true;
  return (keys || []).some(k=>{
    const nk = normalizeSearchText(k);
    return nk && text.includes(nk);
  });
}

function renderGeneralHistoryResults(){
  const ctx = window.HIST_GENERAL_CONTEXT;
  if(!ctx) return;

  const latestOnly = document.getElementById('histGeneralLatestOnly') ? document.getElementById('histGeneralLatestOnly').checked : true;
  const keys = getHistoryKeysFromMatches(ctx);

  let registros = (ctx.registroRows || []).filter(r=>historyRowMatchesKeys(r, keys, ctx.query));
  let lanak = (ctx.lanakRows || []).filter(r=>historyRowMatchesKeys(r, keys, ctx.query));

  if(latestOnly){
    registros = obtenerUltimoRegistroPorQR(registros);
    lanak = obtenerUltimoRegistroPorQR(lanak);
  }

  registros = registros.slice().sort((a,b)=>getHistoryDateTimeValue(b).localeCompare(getHistoryDateTimeValue(a))).slice(0,80);
  lanak = lanak.slice().sort((a,b)=>getHistoryDateTimeValue(b).localeCompare(getHistoryDateTimeValue(a))).slice(0,80);

  const selectedHtml = `
    <div class="ficha-box">
      <strong>Coincidencias encontradas:</strong><br>
      ${ctx.autoItems.length ? `<br><strong>Vehículos del centro:</strong><br>${ctx.autoItems.map(x=>'🚗 '+escapeHtml(x.label)).join('<br>')}` : ''}
      ${ctx.harreraItems.length ? `<br><strong>Recepciones externas:</strong><br>${ctx.harreraItems.map(x=>'🔧 '+escapeHtml(x.label)).join('<br>')}` : ''}
      ${!ctx.autoItems.length && !ctx.harreraItems.length ? 'No se ha encontrado ficha exacta, pero se muestran registros que coinciden con la búsqueda.' : ''}
    </div>
  `;

  const regHtml = registros.length ? registros.map(renderGenericHistoryRow).join('') : "<div class='ficha-box'>No hay registros en REGISTRO.</div>";
  const lanakHtml = lanak.length ? lanak.map(renderGenericHistoryRow).join('') : "<div class='ficha-box'>No hay registros en LANAK.</div>";

  document.getElementById('histGeneralResults').innerHTML = `
    ${selectedHtml}
    <h3 style="margin-top:18px;">Últimos registros / REGISTRO</h3>
    ${regHtml}
    <h3 style="margin-top:18px;">Histórico de trabajos / LANAK</h3>
    ${lanakHtml}
  `;
}

// ===== MENDIcar v4.8 Historial con selección exacta =====
function makeHistoryTargets(autoItems, harreraItems){
  const targets = [];

  (autoItems || []).forEach(x=>{
    const id = String(x.id || '').trim();
    const autoa = getAnyField(x.row, ['Autoa','AUTOA','autoa','Vehículo','VEHICULO']);
    const color = getAnyField(x.row, ['Kolorea','KOLOREA','Color']);
    const vin = getAnyField(x.row, ['VIN','vin']);

    targets.push({
      tipo:'AUTOAK',
      label:x.label || ['ID-'+id, autoa, color].filter(Boolean).join(' · '),
      keys:[id, 'ID-'+id, autoa, vin].filter(Boolean),
      row:x.row
    });
  });

  (harreraItems || []).forEach(x=>{
    const qr = String(x.qr || '').trim();
    const idRecepcion = String(x.id || '').trim();
    const matricula = getAnyField(x.row,['MATRICULA','MATRIKULA']);
    const marca = getAnyField(x.row,['MARCA']);
    const modelo = getAnyField(x.row,['MODELO']);
    const cliente = getAnyField(x.row,['CLIENTE','BEZEROA']);
    const label = x.label || [marca, modelo, matricula ? '· '+matricula : '', qr ? '· '+qr : ''].filter(Boolean).join(' ');

    targets.push({
      tipo:'HARRERA',
      label:label,
      keys:[qr, idRecepcion, matricula, (marca+' '+modelo).trim(), cliente].filter(Boolean),
      row:x.row
    });
  });

  return targets;
}

function buscarHistorialGeneral(){
  const query = normalizeSearchText(document.getElementById('histGeneralSearch')?.value || '');
  if(!query){
    showMessage('Introduce matrícula, QR, ID o modelo para buscar.', 'error');
    return;
  }

  showLoading('Buscando coincidencias...');

  callSaveAPI({accion:'listarAutoak'}, aResp=>{
    const autoakRows = aResp && aResp.ok ? (aResp.rows || []) : [];

    callSaveAPI({accion:'listarHarrera'}, hResp=>{
      const harreraRows = hResp && hResp.ok ? (hResp.rows || []) : [];

      callSaveAPI({accion:'listarRegistro'}, rResp=>{
        const registroRows = rResp && rResp.ok ? (rResp.rows || []) : [];

        callSaveAPI({accion:'listarLanak'}, lResp=>{
          const lanakRows = lResp && lResp.ok ? (lResp.rows || []) : [];

          const autoItems = buildAutoakSearchMap(autoakRows).filter(x=>x.text.includes(query));
          const harreraItems = buildHarreraSearchMap(harreraRows).filter(x=>x.text.includes(query));
          const targets = makeHistoryTargets(autoItems, harreraItems);

          window.HIST_GENERAL_CONTEXT = {
            query,
            autoItems,
            harreraItems,
            targets,
            selectedTargetIndex: targets.length === 1 ? 0 : null,
            registroRows,
            lanakRows
          };

          renderGeneralHistoryResults();
          hideLoading();
        });
      });
    });
  });
}

function selectHistoryTarget(i){
  if(!window.HIST_GENERAL_CONTEXT) return;
  window.HIST_GENERAL_CONTEXT.selectedTargetIndex = i;
  renderGeneralHistoryResults();
}

function getSelectedHistoryTarget(ctx){
  if(!ctx) return null;
  if(ctx.selectedTargetIndex === null || ctx.selectedTargetIndex === undefined) return null;
  return (ctx.targets || [])[ctx.selectedTargetIndex] || null;
}

function normalizeHistoryKey(v){
  return normalizeSearchText(v).replace(/\s+/g,' ');
}

function historyRowMatchesTarget(row, target){
  if(!target) return false;

  const keys = (target.keys || []).map(normalizeHistoryKey).filter(Boolean);

  if(!keys.length) return false;

  const candidateFields = [
    'QR','QR_RECEPCION','QR RECEPCION','QR_HARRERA',
    'ID','ID_VEHICULO','ID AUTOA','ID_RECEPCION','ID RECEPCION',
    'MATRICULA','MATRIKULA',
    'AUTOA','Autoa','autoa',
    'VEHICULO','Vehículo',
    'CLIENTE','BEZEROA'
  ];

  const values = candidateFields
    .map(f=>getAnyField(row,[f]))
    .filter(Boolean)
    .map(normalizeHistoryKey);

  // Coincidencia exacta por campo clave: evita que buscar "C4" saque todos los textos que contienen C4.
  if(values.some(v=>keys.includes(v))) return true;

  // Caso especial para registros antiguos: ID del vehículo en REGISTRO puede ser solo número.
  const rowId = normalizeHistoryKey(getAnyField(row,['ID']));
  if(target.tipo === 'AUTOAK'){
    const idKey = keys.find(k=>/^\d+$/.test(k));
    if(rowId && idKey && rowId === idKey) return true;
  }

  return false;
}

function renderHistoryTargetChoices(ctx){
  const targets = ctx.targets || [];

  if(!targets.length){
    return `
      <div class="ficha-box">
        No se ha encontrado ningún vehículo o recepción que coincida con la búsqueda.
      </div>
    `;
  }

  if(targets.length === 1){
    return `
      <div class="history-selected">
        Seleccionado: ${escapeHtml(targets[0].label)}
      </div>
    `;
  }

  return `
    <div class="ficha-box">
      <strong>Coincidencias encontradas:</strong><br>
      Selecciona exactamente qué vehículo quieres consultar. Hasta que no elijas uno, no se cargan registros.
    </div>
    ${targets.map((t,i)=>`
      <button type="button" class="history-choice" onclick="selectHistoryTarget(${i})">
        ${t.tipo === 'AUTOAK' ? '🚗' : '🔧'} ${escapeHtml(t.label)}
        <small>${t.tipo === 'AUTOAK' ? 'Vehículo del centro' : 'Recepción externa / QR'}</small>
      </button>
    `).join('')}
  `;
}

function renderGeneralHistoryResults(){
  const ctx = window.HIST_GENERAL_CONTEXT;
  if(!ctx) return;

  const latestOnly = document.getElementById('histGeneralLatestOnly') ? document.getElementById('histGeneralLatestOnly').checked : true;
  const selected = getSelectedHistoryTarget(ctx);

  const choicesHtml = renderHistoryTargetChoices(ctx);

  if(!selected){
    document.getElementById('histGeneralResults').innerHTML = choicesHtml;
    return;
  }

  let registros = (ctx.registroRows || []).filter(r=>historyRowMatchesTarget(r, selected));
  let lanak = (ctx.lanakRows || []).filter(r=>historyRowMatchesTarget(r, selected));

  if(latestOnly){
    registros = obtenerUltimoRegistroPorQR(registros);
    lanak = obtenerUltimoRegistroPorQR(lanak);
  }

  registros = registros.slice().sort((a,b)=>getHistoryDateTimeValue(b).localeCompare(getHistoryDateTimeValue(a))).slice(0,80);
  lanak = lanak.slice().sort((a,b)=>getHistoryDateTimeValue(b).localeCompare(getHistoryDateTimeValue(a))).slice(0,80);

  const regHtml = registros.length ? registros.map(renderGenericHistoryRow).join('') : "<div class='ficha-box'>No hay registros en REGISTRO para el vehículo seleccionado.</div>";
  const lanakHtml = lanak.length ? lanak.map(renderGenericHistoryRow).join('') : "<div class='ficha-box'>No hay registros en LANAK para el vehículo seleccionado.</div>";

  document.getElementById('histGeneralResults').innerHTML = `
    ${choicesHtml}

    <h3 style="margin-top:18px;">Últimos registros / REGISTRO</h3>
    ${regHtml}

    <h3 style="margin-top:18px;">Histórico de trabajos / LANAK</h3>
    ${lanakHtml}
  `;
}



// ===== MENDIcar v5.1 Historial mejorado: tareas realizadas visibles =====

function buildHistoryKeysForTarget(target){
  if(!target) return [];
  const keys = (target.keys || []).filter(Boolean);

  if(target.row){
    [
      ['QR_RECEPCION','QR_HARRERA','QR HARRERA'],
      ['ID_RECEPCION','ID RECEPCION'],
      ['MATRICULA','MATRIKULA'],
      ['Autoa','AUTOA','autoa','VEHICULO','Vehículo'],
      ['MARCA'],
      ['MODELO'],
      ['CLIENTE','BEZEROA']
    ].forEach(group=>{
      const v = getAnyField(target.row, group);
      if(v) keys.push(v);
    });

    const marca = getAnyField(target.row,['MARCA']);
    const modelo = getAnyField(target.row,['MODELO']);
    if((marca || modelo)) keys.push((marca+' '+modelo).trim());
  }

  return [...new Set(keys.map(k=>String(k||'').trim()).filter(Boolean))];
}

function historyRowMatchesTargetLoose(row, target){
  if(!target) return false;
  const keys = buildHistoryKeysForTarget(target).map(normalizeHistoryKey).filter(Boolean);
  if(!keys.length) return false;

  const fields = [
    'QR','QR_RECEPCION','QR_HARRERA',
    'ID_RECEPCION','ID RECEPCION',
    'ID','ID_VEHICULO',
    'MATRICULA','MATRIKULA',
    'AUTOA','Autoa','autoa',
    'VEHICULO','Vehículo',
    'CLIENTE','BEZEROA',
    'LANA','Lana','TRABAJO','Trabajo'
  ];

  const values = fields.map(f=>getAnyField(row,[f])).filter(Boolean).map(normalizeHistoryKey);

  if(values.some(v=>keys.includes(v))) return true;

  // Para coches internos antiguos: REGISTRO puede guardar solo ID numérico.
  if(target.tipo === 'AUTOAK'){
    const targetId = keys.find(k=>/^\d+$/.test(k));
    const rowId = normalizeHistoryKey(getAnyField(row,['ID']));
    if(targetId && rowId && targetId === rowId) return true;
  }

  return false;
}

function renderGenericHistoryRow(r){
  const fecha = getAnyField(r,['FECHA','Fecha','fecha','DATA','Data','data']);
  const hora = getAnyField(r,['HORA','Hora','hora','ORDUA','Ordua','ordua']);
  const usuario = getAnyField(r,['USUARIO','Usuario','usuario','ERABILTZAILEA','Erabiltzailea']);
  const rol = getAnyField(r,['ROL','Rol','rol']);
  const taldea = getAnyField(r,['TALDEA','Taldea','taldea']);
  const qr = getAnyField(r,['QR','QR_RECEPCION','QR_HARRERA']);
  const autoa = getAnyField(r,['AUTOA','Autoa','autoa','VEHICULO','Vehículo']);
  const matricula = getAnyField(r,['MATRICULA','MATRIKULA','Matrícula']);
  const accion = getAnyField(r,['ACCION','Acción','Accion','accion','CAMBIO','Cambio','cambio']);
  const tarea = getAnyField(r,['LANA','Lana','lana','TRABAJO','Trabajo','trabajo','TRABAJO_REALIZADO','Trabajo realizado']);
  const estado = getAnyField(r,['EGOERA','Egoera','egoera','ESTADO','Estado','estado']);
  const detalle = getAnyField(r,['DETALLE','Detalle','detalle','OHARRAK','Oharrak','oharrak','DESCRIPCION','Descripción','test']);
  const displayName = qr ? getQrDisplayName(qr) : '';

  return `
    <div class="work-reception-card" style="border-left-color:#111827;">
      <div class="work-reception-summary">
        <strong>${escapeHtml(fecha || '-')} ${escapeHtml(hora || '')}</strong>
        <br>
        ${qr ? `<span class="qr-line">${escapeHtml(displayName || qr)}</span><br>` : ''}
        ${autoa ? `<strong>${escapeHtml(autoa)}</strong>${matricula ? ' · '+escapeHtml(matricula) : ''}<br>` : ''}
        ${accion ? `<strong>${escapeHtml(accion)}</strong>` : ''}

        ${tarea ? `
          <div class="history-task-line">
            <span class="history-task-label">Tarea realizada:</span>
            ${escapeHtml(tarea)}
            ${estado ? `<span class="history-task-state">${escapeHtml(estado)}</span>` : ''}
          </div>
        ` : ''}

        ${detalle ? `<div style="margin-top:8px;color:#374151;">${escapeHtml(detalle)}</div>` : ''}

        <div style="margin-top:8px;color:#6b7280;font-weight:800;">
          ${escapeHtml(usuario || '-')} ${rol ? '· '+escapeHtml(rol) : ''} ${taldea ? '· '+escapeHtml(taldea) : ''}
        </div>
      </div>
    </div>
  `;
}

function renderGeneralHistoryResults(){
  const ctx = window.HIST_GENERAL_CONTEXT;
  if(!ctx) return;

  const latestOnly = document.getElementById('histGeneralLatestOnly') ? document.getElementById('histGeneralLatestOnly').checked : true;
  const selected = getSelectedHistoryTarget(ctx);

  const choicesHtml = renderHistoryTargetChoices(ctx);

  if(!selected){
    document.getElementById('histGeneralResults').innerHTML = choicesHtml;
    return;
  }

  let registros = (ctx.registroRows || []).filter(r=>historyRowMatchesTargetLoose(r, selected));
  let lanak = (ctx.lanakRows || []).filter(r=>historyRowMatchesTargetLoose(r, selected));

  if(latestOnly){
    registros = obtenerUltimoRegistroPorQR(registros);
    lanak = obtenerUltimoRegistroPorQR(lanak);
  }

  registros = registros.slice().sort((a,b)=>getHistoryDateTimeValue(b).localeCompare(getHistoryDateTimeValue(a))).slice(0,120);
  lanak = lanak.slice().sort((a,b)=>getHistoryDateTimeValue(b).localeCompare(getHistoryDateTimeValue(a))).slice(0,120);

  const regHtml = registros.length ? registros.map(renderGenericHistoryRow).join('') : "<div class='ficha-box'>No hay registros en REGISTRO para el vehículo seleccionado.</div>";
  const lanakHtml = lanak.length ? lanak.map(renderGenericHistoryRow).join('') : "<div class='ficha-box'>No hay tareas realizadas en LANAK para el vehículo seleccionado.</div>";

  document.getElementById('histGeneralResults').innerHTML = `
    ${choicesHtml}

    <h3 style="margin-top:18px;">Registros / REGISTRO</h3>
    ${regHtml}

    <h3 style="margin-top:18px;">Tareas realizadas / LANAK</h3>
    ${lanakHtml}
  `;
}

// Garantía: todas las vistas abiertas desde el dashboard tienen botón volver.
function openDashboardSection(section){
  clearMainContent();

  if(section === 'vehiculos'){
    document.getElementById('viewModeText').textContent='Ver todos';
    if(typeof showLoading === 'function') showLoading('Cargando vehículos...');
    loadVehiclesJSONP();
    setTimeout(()=>{
      if(typeof hideLoading === 'function') hideLoading();
      addBackToHome();
    },700);
    return;
  }

  if(section === 'trabajos'){
    showWorksPanel();
    setTimeout(()=>addBackToHome(),250);
    return;
  }

  if(section === 'calendario'){
    showCalendarPanel();
    setTimeout(()=>addBackToHome(),250);
    return;
  }

  if(section === 'historial'){
    showHistoryPanel();
    setTimeout(()=>addBackToHome(),250);
    return;
  }

  if(section === 'ajustes'){
    showSettingsPanel();
    setTimeout(()=>addBackToHome(),250);
    return;
  }
}
