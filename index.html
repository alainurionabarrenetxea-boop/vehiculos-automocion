// Override loadWorks: loads external HARRERA + center works from LANAK.
function loadWorks(){
  showLoading('Lan aktiboak kargatzen...');
  clearMessage();

  callSaveAPI({accion:'listarHarrera'}, hResp=>{
    const hRows = hResp && hResp.ok ? (hResp.rows || []) : [];

    callSaveAPI({accion:'listarLanak'}, lResp=>{
      const lRows = lResp && lResp.ok ? (lResp.rows || []) : [];

      const externas = hRows.filter(r=>{
        const estadoRecepcion = String(getAnyField(r, ['ESTADO_RECEPCION','ESTADO RECEPCION']) || 'abierta').trim().toLowerCase();
        const idRecepcion = getAnyField(r, ['ID_RECEPCION','ID RECEPCION']);
        const qr = getAnyField(r, ['QR_RECEPCION','QR RECEPCION']);
        const trabajos = parseTrabajosJsonFront(r);

        if(!idRecepcion && !qr) return false;
        if(estadoRecepcion === 'cerrada' || estadoRecepcion === 'cerrado') return false;
        if(!trabajos.length) return true;

        return !trabajos.every(t=>{
          const e = String(t.estado || '').toLowerCase();
          return e === 'terminado' || e === 'cancelado';
        });
      }).map(r=>Object.assign({}, r, {TIPO_VEHICULO:'EXTERNO'}));

      const centro = getLatestCenterWorks(lRows);

      window.RECEPCIONES_CACHE = externas;
      window.CENTER_WORKS_CACHE = centro;

      renderWorksMixed(externas, centro);
      hideLoading();
    });
  });
}

function getLatestCenterWorks(rows){
  const latest = {};
  (rows || []).forEach(r=>{
    const tipo = String(getAnyField(r,['TIPO_VEHICULO','Tipo vehículo','tipoVehiculo']) || '').toUpperCase();
    const idTrabajo = getAnyField(r,['ID_TRABAJO','ID TRABAJO']);
    if(tipo !== 'CENTRO' || !idTrabajo) return;
    latest[idTrabajo] = r;
  });

  return Object.values(latest).filter(r=>{
    const estado = String(getAnyField(r,['EGOERA','ESTADO','Estado']) || '').toLowerCase();
    const visible = String(getAnyField(r,['VISIBLE_AKTIBO','VISIBLE','AKTIBO']) || 'SI').toUpperCase();
    return visible !== 'NO' && estado !== 'terminado' && estado !== 'cancelado';
  });
}

function getWorkWorkshopAny(r){
  return getAnyField(r,['TAILERRA','TALLER']) || getReceptionWorkshop(r);
}

function renderWorksMixed(externas, centro){
  const allCentro = centro || [];
  const ext = externas || [];

  const mekanikaExt = ext.filter(r=>getReceptionWorkshop(r)==='MEKANIKA');
  const karrozeriaExt = ext.filter(r=>getReceptionWorkshop(r)==='KARROZERIA');
  const biakExt = ext.filter(r=>getReceptionWorkshop(r)==='SIN_TALLER' && String(getAnyField(r,['QUEJA_CLIENTE','TIPO_TRABAJO','TAILERRA']) || '').toUpperCase()==='BIAK');

  const mekanikaCentro = allCentro.filter(r=>String(getWorkWorkshopAny(r)).toUpperCase()==='MEKANIKA');
  const karrozeriaCentro = allCentro.filter(r=>String(getWorkWorkshopAny(r)).toUpperCase()==='KARROZERIA');

  document.getElementById('worksList').innerHTML = `
    ${renderWorkSectionMixed('MEKANIKA', mekanikaExt, mekanikaCentro)}
    ${renderWorkSectionMixed('KARROZERIA', karrozeriaExt, karrozeriaCentro)}
    ${biakExt.length ? renderWorkSectionMixed('BIAK / SIN CLASIFICAR', biakExt, []) : ''}
  `;
}

function renderWorkSectionMixed(title, extRows, centroRows){
  const total = (extRows || []).length + (centroRows || []).length;
  return `
    <details class="work-section">
      <summary class="work-section-summary">
        <div>
          <div class="work-section-title">${escapeHtml(title)}</div>
          <div class="work-section-sub">Pulsa para ver coches externos y coches del centro</div>
        </div>
        <div class="work-section-count">${total} ${total === 1 ? 'trabajo' : 'trabajos'}</div>
      </summary>
      <div class="work-section-body">
        ${(centroRows || []).length ? `<h3>Vehículos del centro</h3>${renderCenterWorkList(centroRows)}` : ''}
        ${(extRows || []).length ? `<h3>Vehículos externos</h3>${renderReceptionWorkList(extRows)}` : ''}
        ${!total ? "<div class='ficha-box'>Sin trabajos</div>" : ''}
      </div>
    </details>
  `;
}

function renderCenterWorkList(rows){

    return `

                <option value="en curso" ${String(estado).toLowerCase()==='en curso'?'selected':''}>en curso</option>

function guardarTrabajoCentro(idTrabajo){
  const row = (window.CENTER_WORKS_CACHE || []).find(r=>String(getAnyField(r,['ID_TRABAJO']))===String(idTrabajo));
  if(!row){showMessage('No se encuentra el trabajo de centro.','error');return;}

  const estado = document.getElementById('estadoCentro_'+idTrabajo)?.value || 'pendiente';
  const obs = document.getElementById('obsCentro_'+idTrabajo)?.value || '';

  callSaveAPI({
    accion:'actualizarTrabajoCentro',
    idTrabajo:idTrabajo,
    estado:estado,
    oharrak:obs,
    usuario:currentUser ? currentUser.username : '',
    rol:currentUser ? currentUser.role : '',
    taldea:currentUser ? currentUser.taldea : ''
  }, resp=>{
    if(!resp || !resp.ok){
      showMessage('Error guardando práctica: '+(resp&&resp.msg?resp.msg:'Error desconocido'),'error');
      return;
    }
    showMessage(resp.msg || 'Práctica guardada.','success');
    setTimeout(()=>showWorksPanel(),700);
  });
}

  const sel = document.getElementById('workCentroVehicle');

    if(!note && sel.parentElement){
      note = document.createElement('div');
      note.id = 'centerVehicleDebug';
      note.className = 'compact-note';
      sel.parentElement.appendChild(note);
    }

    if(note){
      if(filtrados.length){
        note.innerHTML = `Cargados ${filtrados.length} vehículos para ${escapeHtml(selectedGroup)} desde AUTOAK/Egokitua.`;
      }else{
        const gruposDetectados = [...new Set(rows.map(v=>String(v.taldeaEsleitua||'').trim()).filter(Boolean))].slice(0,30);

    }

    syncSelectedCenterVehicle();
  });

    status.innerHTML = isLoading ? '<span class="mini-spinner"></span> '+escapeHtml(text || 'Cargando...') : (text ? escapeHtml(text) : '');
  }
}

function cargarAutoakCache(callback){
  callSaveAPI({accion:'listarAutoak', cacheBust: Date.now()}, resp=>{
    if(!resp || !resp.ok){
      showMessage('No se han podido cargar los coches del centro desde AUTOAK.','error');
      if(callback) callback([]);
      return;
    }
    const rows = (resp.rows || []).map(mapAutoakRowToVehicle).filter(v=>v.id);
    window.CENTER_AUTOAK_CACHE = rows;
    if(callback) callback(rows);
  });
}

function cargarGruposAutoak(){
  const selGrupo = document.getElementById('workGrupoAsignado');
  if(!selGrupo) return;

  const oldValue = selGrupo.value;
  selGrupo.innerHTML = '<option value="">Cargando grupos...</option>';
  setCenterVehicleLoading(true, 'Leyendo grupos reales de AUTOAK/Egokitua...');

  let finished = false;
  const timer = setTimeout(()=>{
    if(finished) return;
    finished = true;
    setCenterVehicleLoading(false, 'La carga de grupos está tardando demasiado. Pulsa “Actualizar grupos”.');
    selGrupo.innerHTML = '<option value="">Error cargando grupos</option>';
  }, 15000);

  cargarAutoakCache(rows=>{
    if(finished) return;
    finished = true;
    clearTimeout(timer);

    const groups = [];
    rows.forEach(v=>{
      splitGroupCell(v.taldeaEsleitua || 'DENAK').forEach(g=>{
        if(g && !['TODOS','GUZTIAK'].includes(g)) groups.push(g);
      });
    });

    const unique = [...new Set(groups)]
      .filter(Boolean)
      .sort((a,b)=>a.localeCompare(b, 'es', {numeric:true}));

    if(!unique.includes('DENAK')) unique.push('DENAK');

    selGrupo.innerHTML = unique.length ? unique.map(g=>`
      <option value="${escapeAttr(g)}">${escapeHtml(g)}</option>
    `).join('') : '<option value="DENAK">DENAK</option>';

    if(oldValue && unique.includes(normalizeGroupValue(oldValue))){
      selGrupo.value = normalizeGroupValue(oldValue);
    }

    setCenterVehicleLoading(false, 'Grupos cargados: '+unique.length+'. Elige grupo y pulsa “Cargar coches del grupo”.');
    resetCenterVehicleSelector(false);
  });
}

function resetCenterVehicleSelector(clearStatus=true){
  const sel = document.getElementById('workCentroVehicle');
  if(sel){
    sel.innerHTML = '<option value="">Pulsa “Cargar coches del grupo”</option>';
  }
  const status = document.getElementById('centerVehicleLoadStatus');
  if(status && clearStatus) status.innerHTML = '';
  const note = document.getElementById('centerVehicleDebug');
  if(note) note.innerHTML = '';
  syncSelectedCenterVehicle();
}

function cargarVehiculosCentroParaGrupo(){
  const sel = document.getElementById('workCentroVehicle');
  const groupSel = document.getElementById('workGrupoAsignado');
  if(!sel || !groupSel) return;

  const selectedGroup = normalizeGroupValue(groupSel.value);
  if(!selectedGroup){
    showMessage('Primero selecciona un grupo.','error');
    return;
  }

  sel.innerHTML = `<option value="">Cargando vehículos de ${escapeHtml(selectedGroup)}...</option>`;
  setCenterVehicleLoading(true, 'Buscando vehículos exclusivos de '+selectedGroup+'...');
  syncSelectedCenterVehicle();

  const doFilter = (rows)=>{
    const filtrados = rows.filter(v=>{
      const grupos = splitGroupCell(v.taldeaEsleitua || 'DENAK');
      const esComun = grupos.includes('DENAK') || grupos.includes('TODOS') || grupos.includes('GUZTIAK');

      // SOLO el grupo seleccionado.
      // Los DENAK se muestran solo cuando se selecciona DENAK.
      if(selectedGroup === 'DENAK' || selectedGroup === 'LIBRE') return esComun;
      return grupos.includes(selectedGroup);
    });

    sel.innerHTML = filtrados.length ? filtrados.map(v=>`
      <option value="${escapeAttr(v.id)}">
        ID ${escapeHtml(v.id)} · ${escapeHtml(v.autoa || 'Vehículo')} ${v.color ? '· '+escapeHtml(v.color) : ''} · Grupo: ${escapeHtml(v.taldeaEsleitua || 'DENAK')}
      </option>
    `).join('') : `<option value="">No hay vehículos disponibles para el grupo ${escapeHtml(selectedGroup)}</option>`;

    let note = document.getElementById('centerVehicleDebug');
    if(!note && sel.parentElement){
      note = document.createElement('div');
      note.id = 'centerVehicleDebug';
      note.className = 'compact-note';
      sel.parentElement.appendChild(note);
    }

    if(filtrados.length){
      setCenterVehicleLoading(false, 'Cargados '+filtrados.length+' vehículos exclusivos de '+selectedGroup+'.');
      if(note) note.innerHTML = '';
    }else{
      const gruposDetectados = [...new Set(rows.flatMap(v=>splitGroupCell(v.taldeaEsleitua||'')))].filter(Boolean).slice(0,50);
      setCenterVehicleLoading(false, 'No hay vehículos para '+selectedGroup+'.');
      if(note){
        note.innerHTML = `Grupos detectados en AUTOAK/Egokitua: ${escapeHtml(gruposDetectados.join(', ') || 'ninguno')}`;
      }
    }

    syncSelectedCenterVehicle();
  };

  const rows = window.CENTER_AUTOAK_CACHE || [];
  if(rows.length){
    doFilter(rows);
  }else{
    cargarAutoakCache(doFilter);
  }
}

function populateCenterVehicleOptions(){
  cargarVehiculosCentroParaGrupo();
}

function getSelectedCenterVehicle(){
  const id = document.getElementById('workCentroVehicle')?.value || '';
  const cache = window.CENTER_AUTOAK_CACHE || [];
  return cache.find(v=>String(v.id)===String(id)) || null;
}

function syncSelectedCenterVehicle(){
  const v = getSelectedCenterVehicle();
  const autoa = document.getElementById('workAutoa');
  const matricula = document.getElementById('workMatricula');

  if(!v){
    if(autoa){ autoa.value=''; autoa.disabled=true; }
    if(matricula){ matricula.value=''; matricula.disabled=true; }
    return;
  }

  if(autoa){
    autoa.value = v.autoa || '';
    autoa.disabled = true;
  }
  if(matricula){
    matricula.value = v.id ? 'ID-'+v.id : '';
    matricula.disabled = true;
  }
}

// ===== v6.1.0 filtro real de TXOSTENAK =====
// TXOSTENAK debe mostrar SOLO acciones reales sobre vehículo/trabajo.
// NO muestra login, consultas, abrir calendario, abrir historial, ver trabajos, ver informes, etc.
function getReportActionText(row){
  return [
    getAnyField(row,['OHARRAK','Oharrak','oharrak','DESCRIPCION','Detalle','DETALLE','test','CAMBIO','ACCION','EKINTZA']),
    getAnyField(row,['LANA','Lana','lana','TRABAJO','Trabajo','trabajo','TRABAJO_REALIZADO']),
    getAnyField(row,['EGOERA','ESTADO','Estado','estado']),
    getAnyField(row,['AUTOA','Autoa','autoa','VEHICULO','Vehículo']),
    getAnyField(row,['ID_RECEPCION','ID_TRABAJO','QR_RECEPCION','QR_HARRERA'])
  ].join(' ').toLowerCase();
}

function isReportableAction(row){
  const txt = getReportActionText(row);
  if(!txt.trim()) return false;

  // Excluir consultas y navegación. Esto NO debe salir en informes.
  const excludedOnly = [
    'login',
    'entrada en la aplicación',
    'entrada en aplicacion',
    'consulta',
    'consultar',
    'consultado',
    'calendario',
    'historial',
    'informe',
    'informes',
    'trabajos activos',
    'ver trabajos',
    'ver todos',
    'panel',
    'menú',
    'menu'
  ];

  // Acciones que SÍ demuestran modificación o trabajo real.
  const reportable = [
    'recepcion',
    'recepción',
    'crear trabajo',
    'trabajo creado',
    'creado',
    'creación',
    'actualización checklist',
    'actualizacion checklist',
    'checklist',
    'guardado',
    'guardar',
    'cambio de estado',
    'estado cambiado',
    'terminado',
    'amaituta',
    'cancelado',
    'bertan behera',
    'en curso',
    'martxan',
    'bloqueado',
    'liberado',
    'evidencia',
    'foto',
    'observacion',
    'observación',
    'observaciones',
    'oharrak',
    'tarea realizada',
    'trabajo realizado',
    'lana',
    'lanak'
  ];

  const hasReportable = reportable.some(x => txt.includes(x));
  if(!hasReportable) return false;

  // Si incluye palabras de consulta pero también incluye una acción real, se conserva.
  // Ejemplo: "Actualización checklist" se conserva.
  const isOnlyQuery = excludedOnly.some(x => txt.includes(x)) && !hasReportable;
  if(isOnlyQuery) return false;

  // Evitar filas genéricas vacías de estado/consulta.
  const task = String(getReportTask(row) || '').trim().toLowerCase();
  const obs = String(getAnyField(row,['OHARRAK','Oharrak','oharrak','DESCRIPCION','Detalle','DETALLE','test']) || '').trim().toLowerCase();
  const estado = String(getReportEstado(row) || '').trim().toLowerCase();

  if(!task && !obs && !estado) return false;

  return true;
}

function filterReportRows(rows){
  const desde = document.getElementById('repDesde')?.value || '';
  const hasta = document.getElementById('repHasta')?.value || '';
  const usuario = normalizeReportText(document.getElementById('repUsuario')?.value || '');
  const grupo = normalizeReportText(document.getElementById('repGrupo')?.value || '');
  const vehiculo = normalizeReportText(document.getElementById('repVehiculo')?.value || '');
  const estadoFiltro = normalizeReportText(document.getElementById('repEstado')?.value || '');

  return (rows||[]).filter(r=>{
    if(!isReportableAction(r)) return false;
    const dt = getReportDateTime(r);
    const fecha = dt.fecha.substring(0,10);

    if(desde && fecha && fecha < desde) return false;
    if(hasta && fecha && fecha > hasta) return false;

    const user = normalizeReportText(getReportUser(r));
    const group = normalizeReportText(getReportGroup(r));
    const estado = normalizeReportText(getReportEstado(r));

    const big = normalizeReportText([
      getReportVehicle(r),
      getAnyField(r,['MATRIKULA','MATRICULA','Matrícula','matricula']),
      getAnyField(r,['QR','QR_RECEPCION','QR_HARRERA','QR_AUTOAK']),
      getReportTask(r),
      getReportId(r)
    ].join(' '));

    if(usuario && !user.includes(usuario)) return false;
    if(grupo && !group.includes(grupo)) return false;
    if(estadoFiltro && estado !== estadoFiltro) return false;
    if(vehiculo && !big.includes(vehiculo)) return false;

    return true;
  });
}

function generarInformeTrabajos(){
  const status = document.getElementById('reportStatus');
  const results = document.getElementById('reportResults');
  if(status) status.innerHTML = '<span class="mini-spinner"></span> Cargando LANAK...';
  if(results) results.innerHTML = '';

  callSaveAPI({accion:'listarLanak', cacheBust:Date.now()}, resp=>{
    if(!resp || !resp.ok){
      if(status) status.textContent = 'Error cargando LANAK.';
      showMessage('No se ha podido cargar LANAK para el informe.','error');
      return;
    }

    const rows = filterReportRows(resp.rows || []);
    window.LAST_REPORT_ROWS = rows;

    if(status) status.textContent = `Txostena sortuta: ${rows.length} aldaketa / lan erreal.`;

    renderInformeTrabajos(rows);
  });
}

function renderInformeTrabajos(rows){
  const results = document.getElementById('reportResults');
  if(!results) return;

  if(!rows.length){
    results.innerHTML = `<div class="ficha-box">No hay registros con esos filtros.</div>`;
    return;
  }

  const byUser = {};
  rows.forEach(r=>{
    const u = getReportUser(r) || 'Sin usuario';
    if(!byUser[u]) byUser[u] = [];
    byUser[u].push(r);
  });

  const resumen = Object.entries(byUser).map(([u,list])=>{
    const terminados = list.filter(r=>normalizeReportText(getReportEstado(r))==='terminado').length;
    return `
      <div class="report-card">
        <div class="report-card-title">${escapeHtml(u)}</div>
        <span class="report-pill">${list.length} registros</span>
        <span class="report-pill">${terminados} terminados</span>
      </div>
    `;
  }).join('');

  const sorted = rows.slice().sort((a,b)=>{
    const da = getReportDateTime(a), db = getReportDateTime(b);
    return parseReportDateValue(db.fecha,db.hora).localeCompare(parseReportDateValue(da.fecha,da.hora));
  });

  const table = `
    <table class="report-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Usuario</th>
          <th>Grupo</th>
          <th>Coche</th>
          <th>Taller</th>
          <th>Tarea realizada</th>
          <th>Estado</th>
          <th>Observaciones</th>
        </tr>
      </thead>
      <tbody>
        ${sorted.map(r=>{
          const dt = getReportDateTime(r);
          const obs = getAnyField(r,['OHARRAK','Oharrak','oharrak','DESCRIPCION','Detalle','DETALLE','test']) || '';
          return `
            <tr>
              <td>${escapeHtml(dt.fecha)}</td>
              <td>${escapeHtml(dt.hora)}</td>
              <td>${escapeHtml(getReportUser(r))}</td>
              <td>${escapeHtml(getReportGroup(r))}</td>
              <td>${escapeHtml(getReportVehicle(r))}</td>
              <td>${escapeHtml(getReportWorkshop(r))}</td>
              <td><strong>${escapeHtml(getReportTask(r))}</strong></td>
              <td>${escapeHtml(getReportEstado(r))}</td>
              <td>${escapeHtml(obs)}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;

  results.innerHTML = `
    <div id="printableReport">
      <div class="report-print-header">
        <h1>MENDIcar · Informe de trabajos</h1>
        <p>Generado por ${escapeHtml(currentUser?.name || '')} · ${new Date().toLocaleString()}</p>
      </div>

      <h3>Resumen por alumno/profesor</h3>
      ${resumen}

      <h3>Detalle de tareas realizadas</h3>
      ${table}
    </div>
  `;
}

function imprimirInforme(){
  if(!window.LAST_REPORT_ROWS || !window.LAST_REPORT_ROWS.length){
    showMessage('Primero genera un informe.','error');
    return;
  }
  window.print();
}

function exportarInformeCSV(){
  const rows = window.LAST_REPORT_ROWS || [];
  if(!rows.length){
    showMessage('Primero genera un informe.','error');
    return;
  }

  const headers = ['Fecha','Hora','Usuario','Grupo','Coche','Taller','Tarea realizada','Estado','Observaciones'];
  const csvRows = [headers];

  rows.forEach(r=>{
    const dt = getReportDateTime(r);
    csvRows.push([
      dt.fecha,
      dt.hora,
      getReportUser(r),
      getReportGroup(r),
      getReportVehicle(r),
      getReportWorkshop(r),
      getReportTask(r),
      getReportEstado(r),
      getAnyField(r,['OHARRAK','Oharrak','oharrak','DESCRIPCION','Detalle','DETALLE','test']) || ''
    ]);
  });

  const csv = csvRows.map(row=>row.map(cell=>{
    const s = String(cell||'');
    return '"' + s.replace(/"/g,'""') + '"';
  }).join(';')).join('\n');

  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'MENDIcar_informe_trabajos.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function keyForText(s){
  s = String(s || '').replace(/\s+/g,' ').trim();
  if(!s) return '';
  if(TR_MAP[s]) return TR_MAP[s];

  // Sin iconos
  const clean = s.replace(/^[🚪?+←\s]+/u,'').trim();
  return TR_MAP[clean] || '';
}

function applyPrefix(original, translated, key){
  const s = String(original || '').trim();
  let out = translated;
  if(s.startsWith('🚪')) out = '🚪 ' + out.replace(/^🚪\s*/,'');
  if(s.startsWith('?')) out = '? ' + out.replace(/^\?\s*/,'');
  if(s.startsWith('+')) out = '+ ' + out.replace(/^\+\s*/,'');
  if(s.startsWith('←')) out = '← ' + out.replace(/^←\s*/,'');
  return out;
}

function translateOneText(raw){
  const original = String(raw || '');
  const compact = original.replace(/\s+/g,' ').trim();
  if(!compact) return raw;

  const key = keyForText(compact);
  if(key){
    return original.replace(compact, applyPrefix(compact, LT(key), key));
  }

  // Reemplazos dentro de frases largas o mezcladas.
  let out = original;
  Object.keys(TR_MAP)
    .filter(k => k.length > 8)
    .sort((a,b)=>b.length-a.length)
    .forEach(k=>{
      if(out.includes(k)) out = out.split(k).join(LT(TR_MAP[k]));
    });
  return out;
}

function isInsideFixedHeader(node){
  const el = node.nodeType === 3 ? node.parentElement : node;
  return !!(el && el.closest && el.closest('.app-header'));
}

function translateAllText(includeHeader=false){
  const root = document.getElementById('appView') || document.body;
  if(!root) return;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(n => {
    if(!includeHeader && isInsideFixedHeader(n)) return;
    const translated = translateOneText(n.nodeValue);
    if(translated !== n.nodeValue) n.nodeValue = translated;
  });

  root.querySelectorAll('input[placeholder],textarea[placeholder],button,option,[title],[aria-label]').forEach(el=>{
    if(!includeHeader && isInsideFixedHeader(el)) return;

    ['placeholder','title','aria-label'].forEach(attr=>{
      if(el.hasAttribute && el.hasAttribute(attr)){
        const old = el.getAttribute(attr);
        const translated = translateOneText(old);
        if(old !== translated) el.setAttribute(attr, translated);
      }
    });

    if(el.tagName === 'BUTTON' || el.tagName === 'OPTION'){
      const old = el.textContent;
      const translated = translateOneText(old);
      if(old !== translated) el.textContent = translated;
    }
  });

  // Forzar botón flotante de ayuda siempre.
  document.querySelectorAll('.help-floating').forEach(btn=>{
    btn.innerHTML = btn.innerHTML.replace(/Ayuda|Laguntza|Ajuda/g, LT('help'));
  });

  const sel = document.getElementById('appLangSelect');
  if(sel) sel.value = APP_LANG;
}

function patchLangRender(fnName){
  if(typeof window[fnName] !== 'function' || window['__lang604_'+fnName]) return;
  window['__lang604_'+fnName] = window[fnName];
  window[fnName] = function(...args){
    const res = window['__lang604_'+fnName].apply(this,args);
    setTimeout(()=>translateAllText(true),80);
    return res;
  };
}

function translateWorkCardsExtra(root){
  root = root || document.getElementById('appView') || document.body;
  if(!root) return;

  function replNode(n){
    let txt = n.nodeValue;
    let compact = String(txt || '').replace(/\s+/g,' ').trim();
    if(!compact) return;

    const replacements = [
      [/AKTIBO/g, LT('active')],
      [/Irakasle arduraduna:/g, LT('responsibleTeacher') + ':'],
      [/Profesor responsable/g, LT('responsibleTeacher')],
      [/Tailerra:/g, LT('workshopLabel') + ':'],
      [/Egitekoak:/g, LT('pendingPlural') + ':'],
      [/Pendientes/g, LT('pendingLabel')],
      [/Pulsa para tocar\s*para desplegar/g, LT('clickToExpand')],
      [/Tocar para abrir\/cerrar/g, LT('touchToExpand')],
      [/Vehículos externos/g, LT('externalCars')],
      [/Primero pulsa el taller\. Después pulsa el vehículo\/QR para desplegar sus tareas\./g, LT('activeWorksNote')],
      [/Pulsa para ver coches externos y coches del centro/g, LT('showCars')],
      [/(\d+)\s+trabajos/g, '$1 ' + LT('jobs')],
      [/(\d+)\s+trabajo/g, '$1 ' + LT('job')]
    ];

    replacements.forEach(([re, val]) => {
      txt = txt.replace(re, val);
    });

    if(txt !== n.nodeValue) n.nodeValue = txt;
  }

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(replNode);

  root.querySelectorAll('button,option,[title],[aria-label]').forEach(el=>{
    ['title','aria-label'].forEach(attr=>{
      if(el.hasAttribute && el.hasAttribute(attr)){
        let v = el.getAttribute(attr);
        let old = v;
        v = v.replace(/AKTIBO/g, LT('active'))
             .replace(/Profesor responsable/g, LT('responsibleTeacher'))
             .replace(/Taller/g, LT('workshopLabel'))
             .replace(/Pendientes/g, LT('pendingLabel'))
             .replace(/Pulsa para tocar\s*para desplegar/g, LT('clickToExpand'));
        if(v !== old) el.setAttribute(attr, v);
      }
    });

    if(el.tagName === 'BUTTON' || el.tagName === 'OPTION'){
      let old = el.textContent;
      let v = old.replace(/AKTIBO/g, LT('active'))
                 .replace(/Profesor responsable/g, LT('responsibleTeacher'))
                 .replace(/Taller/g, LT('workshopLabel'))
                 .replace(/Pendientes/g, LT('pendingLabel'))
                 .replace(/Pulsa para tocar\s*para desplegar/g, LT('clickToExpand'))
                 .replace(/(\d+)\s+trabajos/g, '$1 ' + LT('jobs'))
                 .replace(/(\d+)\s+trabajo/g, '$1 ' + LT('job'));
      if(v !== old) el.textContent = v;
    }
  });

  document.querySelectorAll('.help-floating').forEach(btn=>{
    btn.innerHTML = btn.innerHTML.replace(/Ayuda|Laguntza|Ajuda/g, LT('help'));
  });
}

// ===== v6.1.3 reparación recepción QR externo =====
// Si un QR externo no tiene recepción activa en HARRERA, debe dejar rellenar matrícula/cliente aunque QR_HARRERA esté marcado como ocupado.
function loadReceptionQR(qrId){
  clearMessage();
  registrarActividadQR('HARRERA', qrId, 'ENTRA_QR', 'Entrada al QR de recepción');

  callSaveAPI({accion:'comprobarQrHarrera', qrRecepcion: qrId}, checkResp => {
    if(checkResp && checkResp.ok && checkResp.ocupado){
      showMessage(
        'QR hau dagoeneko okupatuta dago. Harrera aktiboa badu, ezin da berriro sortu.',
        'error'
      );

      renderOccupiedQrSummary(qrId, checkResp.recepcion || {}, checkResp.sugerido || '');

      callSaveAPI({accion:'listarLanak'}, lResp => {
        if(lResp && lResp.ok) WORK_ROWS_CACHE = lResp.rows || [];
      });
      return;
    }

    // No hay recepción activa: se permite crear la recepción aunque QR_HARRERA figure como ocupado por error.
    callSaveAPI({accion:'listarQrHarrera'}, qrResp => {
      if(!qrResp || !qrResp.ok){
        showMessage('Errorea: ezin da QR zerrenda kargatu.', 'error');
        return;
      }

      const rows = qrResp.rows || [];
      const qr = rows.find(r => {
        const v = r.QR_HARRERA || r.QR || r.qr || r['QR HARRERA'] || '';
        return String(v).trim() === String(qrId).trim();
      });

      if(!qr){
        showMessage('QR hau ez dago QR_HARRERA taulan: ' + qrId, 'error');
        return;
      }

      const estado = String(qr.EGOERA || qr.ESTADO || qr.Estado || '').trim().toLowerCase();

      // Si el estado no es libre pero no existe recepción activa, se enseña el formulario.
      // Esto repara estados antiguos mal cerrados.
      if(estado && estado !== 'libre'){
        showMessage('Oharra: QR hau libre ez bezala agertzen da, baina ez du harrera aktiborik. Harrera berria sortzen utziko da.', 'success');
      }

      renderReceptionForm(qrId);
    });
  });
}

function isFormRequestRow(r){
  const j = String(getAnyField(r,['JATORRIA','ORIGEN']) || '').trim().toUpperCase();

  return j === 'FORM' && !qr && (

    estado === 'nueva' ||
    estado === 'pendiente' ||
    estado === 'sin_qr'
  );

window.PRAKTIKAK_CACHE = window.PRAKTIKAK_CACHE || [];
window.PRAKTIKA_ASSIGNMENTS_CACHE = window.PRAKTIKA_ASSIGNMENTS_CACHE || [];
window.PRAKTIKA_AUTOAK_CACHE = window.PRAKTIKA_AUTOAK_CACHE || [];

function callPraktikaAPI(payload,onDone){
  let finished=false;
  const finish=(result)=>{
    if(finished) return;
    finished=true;
    try{ onDone(result); }catch(e){ console.error('Praktikak callback error',e); }
  };

  const params=new URLSearchParams();
  Object.keys(payload||{}).forEach(k=>params.set(k,payload[k]??''));
  params.set('_ts',Date.now());
  const baseUrl=PRAKTIKA_API_URL+'?'+params.toString();

  // 1) Intento normal con fetch. En móvil suele funcionar mejor que JSONP
  // con las redirecciones de script.google.com -> script.googleusercontent.com.
  const controller=(typeof AbortController!=='undefined')?new AbortController():null;
  const fetchTimer=setTimeout(()=>{ try{ if(controller) controller.abort(); }catch(e){} },9000);

  fetch(baseUrl,{method:'GET',cache:'no-store',redirect:'follow',signal:controller?controller.signal:undefined})
    .then(r=>{
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.text();
    })
    .then(txt=>{
      clearTimeout(fetchTimer);
      let data=null;
      try{ data=JSON.parse(txt); }catch(e){ throw new Error('Respuesta no JSON'); }
      finish(data);
    })
    .catch(()=>{
      clearTimeout(fetchTimer);
      if(finished) return;

      // 2) Fallback JSONP para navegadores/redes donde fetch esté bloqueado por CORS.
      const callbackName='handlePraktikaResponse_'+Date.now()+'_'+Math.floor(Math.random()*100000);
      const jsonpParams=new URLSearchParams(params);
      jsonpParams.set('callback',callbackName);
      const script=document.createElement('script');
      script.id=callbackName;
      let jsonpFinished=false;
      const cleanup=()=>{
        if(jsonpFinished) return;
        jsonpFinished=true;
        clearTimeout(jsonpTimer);
        try{ script.remove(); }catch(e){}
        try{ delete window[callbackName]; }catch(e){}
      };
      window[callbackName]=function(result){
        cleanup();
        finish(result);
      };
      script.src=PRAKTIKA_API_URL+'?'+jsonpParams.toString();
      script.onerror=function(){
        cleanup();
        finish({ok:false,msg:'No se ha podido conectar con el servicio de prácticas.'});
      };
      const jsonpTimer=setTimeout(()=>{
        cleanup();
        finish({ok:false,msg:'Tiempo de espera agotado al conectar con prácticas.'});
      },10000);
      document.body.appendChild(script);
    });
}

function callPraktikaAPIPromise(payload){
  return new Promise(resolve=>callPraktikaAPI(payload,resolve));
}

function praktikakResourceType(p){
  let t=String((p&&p.baliabideMota)||'').trim();
  if(t) return t;
  const id=String((p&&p.idPraktika)||'').trim().toUpperCase();
  // Fallback temporal del piloto si la columna H aún no llega por API.
  if(id==='TRA-01' || id==='TRA-02') return 'Elebadorea';
  if(id==='TRA-03' || id==='TRA-04') return 'Mahaiak';
  return '';
}

function praktikakNeedsVehicle(p){
  const t=praktikakResourceType(p).toUpperCase();
  return t.includes('ELEB') || t.includes('ELEV') || t==='AUTOA' || t==='AUTO';
}

function loadPracticePlannerData(){
  showLoading('Cargando prácticas...');

  const finishPlanner=(practicas)=>{
    window.PRAKTIKAK_CACHE=(practicas||[]).filter(p=>String(p.idPraktika||'').trim() && String(p.praktika||'').trim());
    hideLoading();
    renderPracticePlanner();
    refreshPracticeAssignmentsDay();

    // Los coches se cargan en segundo plano. Si este backend falla,
    // la pantalla de prácticas sigue funcionando igualmente.
    let autosDone=false;
    const autosTimer=setTimeout(()=>{
      if(autosDone) return;
      autosDone=true;
      window.PRAKTIKA_AUTOAK_CACHE=Array.isArray(vehicles)?vehicles.slice():[];
      try{ renderPracticeGroupAssignments(); }catch(e){}
    },7000);

    callSaveAPI({accion:'listarAutoak',cacheBust:Date.now()}, autoResp=>{
      if(autosDone) return;
      autosDone=true;
      clearTimeout(autosTimer);
      if(autoResp && autoResp.ok){
        window.PRAKTIKA_AUTOAK_CACHE=(autoResp.rows||[]).map(mapAutoakRowToVehicle).filter(v=>v.id);
      }else{
        window.PRAKTIKA_AUTOAK_CACHE=Array.isArray(vehicles)?vehicles.slice():[];
      }
      try{ renderPracticeGroupAssignments(); }catch(e){}
    });
  };

  callPraktikaAPI({accion:'listarPracticas'}, resp=>{
    if(resp && resp.ok){
      finishPlanner(resp.practicas||[]);
      return;
    }

    // Fallback de lectura directa de la hoja. Login ya usa OpenSheet,
    // así que aprovechamos el mismo camino para no bloquear el panel.
    fetch('https://opensheet.elk.sh/'+SHEET_ID+'/PRAKTIKAK?cacheBust='+Date.now(),{cache:'no-store'})
      .then(r=>{
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      })
      .then(rows=>{
        const practicas=(rows||[]).map(r=>({
          idPraktika:String(r.ID_PRAKTIKA||'').trim(),
          ikasgaia:String(r.IKASGAIA||'').trim(),
          praktika:String(r.PRAKTIKA||'').trim(),
          fichaEu:String(r.FICHA_EU||'').trim(),
          fichaEs:String(r.FICHA_ES||'').trim(),
          iraupena:r.IRAUPENA||'',
          oharrak:String(r.OHARRAK||'').trim(),
          baliabideMota:String(r['BALIABIDE MOTA']||r.BALIABIDE_MOTA||'').trim()
        }));
        clearMessage();
        finishPlanner(practicas);
      })
      .catch(err=>{
        hideLoading();
        document.getElementById('practicePlannerBody').innerHTML='<div class="msg error">No se han podido cargar las prácticas.</div>';
        showMessage('No se han podido cargar PRAKTIKAK: '+((resp&&resp.msg)||err.message||'Error de conexión'),'error');
      });
  });
}

        return `<div class="practice-group-card">
          <label class="practice-group-head"><input class="praktika-group-check" type="checkbox" value="${g}" onchange="togglePracticeGroupCard('${g}')"> ${g}</label>
          ${needVehicle?`<select id="praktikaAuto_${g}" disabled>${vehicleOptions}</select>`:`<div class="ficha-box" style="margin:0;">Mahaiak · ez da autorik behar</div>`}
        </div>`;
      }).join('')}
    </div>`;
}

function togglePracticeGroupCard(group){
  const checked=[...document.querySelectorAll('.praktika-group-check')].find(x=>x.value===group)?.checked;
  const sel=document.getElementById('praktikaAuto_'+group);
  if(sel) sel.disabled=!checked;
}

function clearPracticeGroupSelections(){
  document.querySelectorAll('.praktika-group-check').forEach(c=>{c.checked=false;togglePracticeGroupCard(c.value);});
  const notes=document.getElementById('praktikaSessionNotes');
  if(notes) notes.value='';
}

async function savePracticeGroupAssignments(){
  const p=getSelectedPraktika();
  const data=document.getElementById('praktikaData')?.value||'';
  const notes=document.getElementById('praktikaSessionNotes')?.value.trim()||'';
  const selected=[...document.querySelectorAll('.praktika-group-check:checked')].map(c=>c.value);
  if(!p){showMessage('Selecciona una práctica.','error');return;}
  if(!data){showMessage('Selecciona una fecha.','error');return;}
  if(!selected.length){showMessage('Selecciona al menos un grupo.','error');return;}

  const needVehicle=praktikakNeedsVehicle(p);
  const payloads=[];
  const usedVehicles=new Set();
  for(const group of selected){
    const idAutoa=needVehicle?(document.getElementById('praktikaAuto_'+group)?.value||''):'';
    if(needVehicle && !idAutoa){showMessage('Falta seleccionar vehículo para '+group+'.','error');return;}
    if(idAutoa && usedVehicles.has(idAutoa)){showMessage('El mismo vehículo está asignado dos veces en esta sesión. Cambia uno de los grupos.','error');return;}
    if(idAutoa) usedVehicles.add(idAutoa);
    payloads.push({accion:'guardarAsignacionPractica',data:data,taldea:group,idPraktika:p.idPraktika,idAutoa:idAutoa,egoera:'PENDIENTE',irakaslea:currentUser?currentUser.username:'',oharrak:notes});
  }

  const btn=document.getElementById('praktikaSaveBtn');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}
  showLoading('Guardando asignaciones...');
  let ok=0, failures=[];
  for(const payload of payloads){
    const resp=await callPraktikaAPIPromise(payload);
    if(resp && resp.ok) ok++; else failures.push((resp&&resp.msg)||payload.taldea);
  }
  hideLoading();
  if(btn){btn.disabled=false;btn.textContent='Guardar asignaciones seleccionadas';}
  if(failures.length){
    showMessage('Guardadas '+ok+' asignaciones. Errores: '+failures.join(' | '),'error');
  }else{
    showMessage('Asignaciones guardadas correctamente: '+ok+'.','success');
    clearPracticeGroupSelections();
  }
  refreshPracticeAssignmentsDay();
}

function refreshPracticeAssignmentsDay(){
  const target=document.getElementById('practiceAssignmentsDay');
  if(!target) return;
  const data=document.getElementById('praktikaData')?.value||praktikakTodayISO();
  target.innerHTML='<div class="practice-empty">Cargando asignaciones...</div>';
  callPraktikaAPI({accion:'listarAsignacionesPracticas'}, resp=>{
    if(!resp || !resp.ok){target.innerHTML='<div class="practice-empty">No se pudieron cargar las asignaciones.</div>';return;}
    const rows=(resp.asignaciones||[]).filter(a=>String(a.data||'').slice(0,10)===String(data));
    window.PRAKTIKA_ASSIGNMENTS_CACHE=resp.asignaciones||[];
    renderPracticeAssignmentsDay(rows,data);
  });
}

function renderPracticeAssignmentsDay(rows,data){
  const target=document.getElementById('practiceAssignmentsDay');
  if(!target) return;
  if(!rows.length){target.innerHTML=`<div class="practice-empty">No hay asignaciones para ${escapeHtml(data)}.</div>`;return;}
  const practicas=window.PRAKTIKAK_CACHE||[];
  const autos=window.PRAKTIKA_AUTOAK_CACHE||[];
  target.innerHTML=rows.map(a=>{
    const p=practicas.find(x=>String(x.idPraktika)===String(a.idPraktika));
    const v=autos.find(x=>String(x.id)===String(a.idAutoa));
    const pname=p?p.praktika:a.idPraktika;
    const vname=a.idAutoa?(v?`${v.autoa||'Vehículo'} · ID ${v.id}`:`ID ${a.idAutoa}`):'Mahaiak';
    return `<div class="practice-session-card">
      <div class="practice-session-title">${escapeHtml(a.taldea)} · ${escapeHtml(pname)}</div>
      <div class="practice-session-meta">${escapeHtml(vname)}<br>Estado: ${escapeHtml(a.egoera||'PENDIENTE')} · Profesor: ${escapeHtml(a.irakaslea||'')}</div>
      ${a.oharrak?`<div class="ficha-box">${escapeHtml(a.oharrak)}</div>`:''}
      ${String(a.egoera||'').toUpperCase()!=='CANCELADA'?`<button class="danger-btn" type="button" onclick="cancelPracticeAssignment('${escapeJs(a.idEsleipena)}')">Cancelar asignación</button>`:''}
    </div>`;
  }).join('');
}

function cancelPracticeAssignment(id){
  if(!id) return;
  if(!confirm('¿Cancelar esta asignación?')) return;
  callPraktikaAPI({accion:'cancelarAsignacionPractica',idEsleipena:id},resp=>{
    if(!resp || !resp.ok){showMessage('No se pudo cancelar: '+(resp&&resp.msg?resp.msg:'Error desconocido'),'error');return;}
    showMessage('Asignación cancelada.','success');
    refreshPracticeAssignmentsDay();
  });
}

function renderGlobalNav(options){
  options = options || {};
  const panel = document.getElementById('globalNavPanel');
  if(!panel) return;

  if(!canShowGlobalNav() || options.hide){
    panel.style.display = 'none';
    panel.innerHTML = '';
    return;
  }

  const showWorks = currentUser && currentUser.role === 'profesor';
  const showRequests = typeof canManageFormRequests === 'function' && canManageFormRequests();

  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="global-nav">
      <button type="button" class="nav-back" onclick="goBackSafe()">← Atzera</button>
      <button type="button" class="nav-home" onclick="showHomeDashboard()">🏠 Menua</button>
      ${showWorks ? `<button type="button" class="nav-works" onclick="showWorksPanel()">📋 Lanak</button>` : ''}
      ${showRequests ? `<button type="button" class="nav-requests" onclick="openHarreraEskaerakSafe()">📝 Eskaerak</button>` : ''}
    </div>
  `;
}

function goBackSafe(){
  try{
    if(window.history.length > 1){
      history.back();
      return;
    }
  }catch(e){}
  showHomeDashboard();
}

// Reforzamos pantallas principales para que siempre aparezca la botonera.
// En el menú principal se oculta para no duplicar botones.
const __oldShowHomeDashboard = typeof showHomeDashboard === 'function' ? showHomeDashboard : null;
if(__oldShowHomeDashboard){
  showHomeDashboard = function(){
    __oldShowHomeDashboard();
    renderGlobalNav({hide:true});
  };
}

    renderGlobalNav();
  };

if(__oldShowFormRequestsPanel){
  showFormRequestsPanel = function(){
    __oldShowFormRequestsPanel();
    renderGlobalNav();
  };
}

// Se puede llamar tras cargar fichas individuales.
const __oldRenderVehicleDetail = typeof renderVehicleDetail === 'function' ? renderVehicleDetail : null;
if(__oldRenderVehicleDetail){
  renderVehicleDetail = function(vehicle){
    __oldRenderVehicleDetail(vehicle);

if(__oldRenderReceptionDetail){
  renderReceptionDetail = function(qrId, harrera){
    __oldRenderReceptionDetail(qrId, harrera);
    renderGlobalNav();
  };
}

</script>
